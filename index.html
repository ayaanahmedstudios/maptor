<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maptor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect x='36' y='44' width='184' height='168' rx='22' fill='none' stroke='%236366f1' stroke-width='22'/%3E%3Cpolygon points='72,82 188,68 176,188 64,172' fill='none' stroke='%236366f1' stroke-width='16' stroke-linejoin='round'/%3E%3Ccircle cx='72' cy='82' r='16' fill='%236366f1'/%3E%3Ccircle cx='188' cy='68' r='16' fill='%236366f1'/%3E%3Ccircle cx='176' cy='188' r='16' fill='%236366f1'/%3E%3Ccircle cx='64' cy='172' r='16' fill='%236366f1'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-app: #0b0b0e;
      --bg-panel: #131317;
      --bg-control: #1c1c22;
      --bg-control-hover: #25252d;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f4f6;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --danger: #ef4444;
      --success: #10b981;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
      user-select: none;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    /* Layout Grid */
    #app-shell {
      display: grid;
      grid-template-rows: 46px 1fr 164px;
      grid-template-columns: 264px 1fr 318px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Toolbar */
    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-hairline);
      z-index: 30;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #topbar::-webkit-scrollbar { display: none; }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .divider-v {
      width: 1px;
      height: 20px;
      background: var(--border-hairline);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* Buttons & Controls */
    button, select, input[type="text"], input[type="number"], textarea {
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      background: var(--bg-control);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--bg-control-hover);
      border-color: var(--border-strong);
    }
    .btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #c7d2fe;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn.primary:hover {
      background: var(--accent-hover);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }
    .btn-icon {
      width: 30px;
      padding: 0;
    }
    .btn-sm {
      height: 26px;
      padding: 0 8px;
      font-size: 11.5px;
    }
    .btn-icon-sm {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 5px;
    }

    svg.ico {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Sidebars */
    #left-panel, #right-panel {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }
    #left-panel {
      border-right: 1px solid var(--border-hairline);
    }
    #right-panel {
      border-left: 1px solid var(--border-hairline);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-hairline);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.14) transparent;
    }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.14);
      border-radius: 99px;
    }

    /* Layer Items */
    .layer-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.1s, border-color 0.1s;
    }
    .layer-item:hover {
      background: var(--bg-control);
    }
    .layer-item.selected {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
    }
    .layer-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 500;
    }
    .layer-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .layer-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.78;
    }
    .layer-item:hover .layer-actions,
    .layer-item.selected .layer-actions {
      opacity: 1;
    }

    /* Stage Viewport */
    #stage-wrap {
      position: relative;
      background: var(--bg-app);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #stage-viewport {
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #000000;
      transform-origin: center center;
    }

    #gl-canvas, #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay-canvas {
      pointer-events: auto;
      cursor: default;
    }

    #stage-hud {
      position: absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 15;
    }
    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(19, 19, 23, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-hairline);
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Inspector Form Controls */
    .sec-card {
      background: rgba(255, 255, 255, 0.018);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 10px;
    }
    .sec-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-label {
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .ctrl-val {
      font-size: 11px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      min-width: 38px;
      text-align: right;
    }

    select.inp, input[type="text"].inp, input[type="number"].inp, textarea.inp {
      width: 100%;
      height: 29px;
      padding: 0 8px;
      background: var(--bg-control);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-primary);
    }
    textarea.inp {
      height: auto;
      padding: 6px 8px;
      resize: vertical;
      line-height: 1.35;
    }
    select.inp:focus, input.inp:focus, textarea.inp:focus {
      border-color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: var(--bg-control-hover);
      border-radius: 99px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 24px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .seg-group {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      background: var(--bg-app);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
      margin-bottom: 8px;
    }
    .seg-btn {
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--bg-control-hover);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    /* Bottom Show Timeline */
    #timeline-panel {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 25;
    }

    #timeline-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 38px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-hairline);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #timeline-toolbar::-webkit-scrollbar { display: none; }

    #cue-track-wrap {
      position: relative;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 12px;
      display: flex;
      align-items: stretch;
      gap: 8px;
      background: var(--bg-app);
    }

    .cue-clip {
      position: relative;
      min-width: 132px;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .cue-clip:hover {
      border-color: var(--border-strong);
      background: var(--bg-control);
    }
    .cue-clip.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.12);
    }
    .cue-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 0 var(--radius-md);
      pointer-events: none;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 120;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive Mobile / Tablet Drawers */
    #mobile-drawer-bar { display: none; }

    @media (max-width: 960px) {
      #app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: 46px 1fr 148px;
      }
      #left-panel, #right-panel {
        position: fixed;
        top: 46px;
        bottom: 148px;
        width: min(320px, 88vw);
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        box-shadow: 12px 0 40px rgba(0,0,0,0.7);
      }
      #right-panel {
        left: auto;
        right: 0;
        transform: translateX(105%);
        box-shadow: -12px 0 40px rgba(0,0,0,0.7);
      }
      #left-panel.mobile-open, #right-panel.mobile-open {
        transform: translateX(0);
      }
      #mobile-drawer-bar {
        display: flex;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- Top Toolbar -->
    <header id="topbar">
      <div class="bar-group">
        <div id="mobile-drawer-bar">
          <button class="btn btn-sm" id="btn-toggle-left" title="Toggle Surfaces">Surfaces</button>
          <button class="btn btn-sm" id="btn-toggle-right" title="Toggle Inspector">Inspector</button>
        </div>

        <!-- Transform Tools -->
        <button class="btn active" id="tool-box" title="Box Transform (V)">
          <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M2 2h4v4H2zM18 2h4v4h-4zM2 18h4v4H2zM18 18h4v4h-4z"/></svg>
          <span>Box</span>
        </button>
        <button class="btn" id="tool-warp" title="Perspective Warp (W)">
          <svg class="ico" viewBox="0 0 24 24"><polygon points="4 6 20 3 18 21 3 18"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="3" r="2"/><circle cx="18" cy="21" r="2"/><circle cx="3" cy="18" r="2"/></svg>
          <span>Warp</span>
        </button>
        <button class="btn" id="tool-pen" title="Pen Polygon Tool (P)">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
          <span>Pen</span>
        </button>

        <div class="divider-v"></div>

        <!-- Add Shapes -->
        <button class="btn" id="add-quad" title="Add Quad Surface">+ Quad</button>
        <button class="btn" id="add-triangle" title="Add Triangle Surface">+ Triangle</button>
        <button class="btn" id="add-circle" title="Add Circle / Ellipse">+ Circle</button>
        <button class="btn" id="add-text" title="Add Typography Surface">+ Text</button>
        <button class="btn" id="add-mask" title="Add Blackout Cutout Mask">+ Mask</button>
      </div>

      <div class="bar-group">
        <button class="btn" id="btn-snap" title="Toggle Snap to Grid & Guides (S)">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 15v-2a6 6 0 1 1 12 0v2"/><path d="M6 15h4v4H6zM14 15h4v4h-4z"/></svg>
          <span>Snap</span>
        </button>
        <button class="btn" id="btn-grid" title="Toggle Calibration Test Grid (G)">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          <span>Grid</span>
        </button>

        <select id="sel-resolution" class="inp tabular" style="width:116px;height:30px;" title="Output Resolution">
          <option value="1920x1080">1920×1080</option>
          <option value="3840x2160">3840×2160</option>
          <option value="1280x800">1280×800</option>
          <option value="1080x1920">1080×1920</option>
          <option value="custom">Custom...</option>
        </select>

        <div class="divider-v"></div>

        <button class="btn" id="btn-projects" title="Save / Load / Export .maptor">
          <svg class="ico" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Projects</span>
        </button>
        <button class="btn primary" id="btn-projector" title="Open Live Projector Output Window">
          <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          <span>Open Projector</span>
        </button>
      </div>
    </header>

    <!-- Left Panel: Surfaces & Masks -->
    <aside id="left-panel">
      <div class="panel-header">
        <span>Surfaces & Masks</span>
        <span id="layer-count" class="tabular">0</span>
      </div>
      <div class="panel-scroll" id="layer-list"></div>
    </aside>

    <!-- Center Stage -->
    <main id="stage-wrap">
      <div id="stage-viewport">
        <canvas id="gl-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
      <div id="stage-hud">
        <div class="hud-pill">
          <span id="hud-mode">Box Transform</span>
          <span>•</span>
          <span id="hud-res" class="tabular">1920×1080</span>
        </div>
        <div class="hud-pill">
          <button class="btn btn-icon-sm" id="btn-zoom-out" title="Zoom Out">-</button>
          <span id="hud-zoom" class="tabular">100%</span>
          <button class="btn btn-icon-sm" id="btn-zoom-in" title="Zoom In">+</button>
          <button class="btn btn-sm" id="btn-zoom-fit" style="height:22px;padding:0 6px;">Fit</button>
        </div>
      </div>
    </main>

    <!-- Right Panel: Inspector -->
    <aside id="right-panel">
      <div class="panel-header">
        <span id="inspector-title">Inspector</span>
        <span id="inspector-type" class="layer-badge">None</span>
      </div>
      <div class="panel-scroll" id="inspector-body"></div>
    </aside>

    <!-- Bottom Show Timeline -->
    <section id="timeline-panel">
      <div id="timeline-toolbar">
        <div class="bar-group">
          <button class="btn btn-sm primary" id="btn-show-play" title="Play / Pause Show (Space)">
            <svg class="ico" id="ico-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            <span id="lbl-play">Play Show</span>
          </button>
          <button class="btn btn-icon-sm" id="btn-cue-prev" title="Previous Cue (Left Arrow)">
            <svg class="ico" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button class="btn btn-icon-sm" id="btn-cue-next" title="Next Cue (Right Arrow)">
            <svg class="ico" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <span id="show-clock" class="tabular" style="padding:0 8px;color:var(--text-primary);">00:00.0 / 00:00.0</span>
        </div>

        <div class="bar-group">
          <button class="btn btn-sm active" id="btn-show-mode" title="Toggle Auto-Play vs Presenter Hold">Mode: Timed Auto-Play</button>
          <button class="btn btn-sm active" id="btn-show-loop" title="Loop Show">Loop: On</button>
          <div class="divider-v"></div>

      const SHADERS = [
        {
          id: 'rain',
          name: 'Rain on Glass',
          c1: '#93c5fd', c2: '#0f172a', c3: '#f59e0b',
          glsl: `
            float N13(float p){ vec3 p3=fract(vec3(p)*vec3(.1031,.11369,.13787)); p3+=dot(p3,p3.yzx+19.19); return fract((p3.x+p3.y)*p3.z); }
            vec2 DropLayer(vec2 uv, float t){
              vec2 UV = uv;
              uv.y += t * 0.72;
              vec2 a = vec2(6.0, 1.0);
              vec2 grid = a * 2.0;
              vec2 id = floor(uv * grid);
              float colShift = N13(id.x * 35.2);
              uv.y += colShift;
              id = floor(uv * grid);
              vec2 st = fract(uv * grid) - vec2(0.5, 0.0);
              float x = (N13(id.x * 13.7 + id.y * 91.3) - 0.5) * 0.72;
              x += sin(UV.y * 18.0 + sin(UV.y * 18.0)) * (0.45 - abs(x)) * 0.5;
              float ti = fract(t + N13(id.x * 7.1 + id.y * 53.9));
              float y = (smoothstep(0.0, 0.85, ti) * smoothstep(1.0, 0.85, ti) - 0.5) * 0.88 + 0.5;
              vec2 p = vec2(x, y);
              float d = length((st - p) * a.yx);
              float mainDrop = smoothstep(0.38, 0.02, d);
              float r = sqrt(smoothstep(1.0, y, st.y));
              float cd = abs(st.x - x);
              float trail = smoothstep(0.22 * r, 0.14 * r * r, cd) * smoothstep(-0.02, 0.02, st.y - y) * r * r;
              float y2 = fract(UV.y * 10.0) + (st.y - 0.5);
              float droplets = smoothstep(0.28, 0.02, length(st - vec2(x, y2))) * r * smoothstep(-0.02, 0.02, st.y - y);
              return vec2(mainDrop + droplets, trail);
            }

              vec2 suv = (uv - 0.5) * u_scale + 0.5;
              float rt = t * 0.35;
              vec2 d1 = DropLayer(suv * 1.15, rt);
              vec2 d2 = DropLayer(suv * 2.05 + 1.3, rt * 1.25);
              float m = smoothstep(0.22, 0.95, d1.x + d2.x * 0.75);
              float tr = max(d1.y, d2.y * 0.7);
              vec2 n = vec2(dFdx(m + tr * 0.4), dFdy(m + tr * 0.4)) * 18.0 * u_intensity;
              vec2 ruv = uv + n * 0.06;
              float b1 = smoothstep(0.32, 0.02, length(fract(ruv * 3.0 + vec2(0.1, 0.2)) - 0.5));
              float b2 = smoothstep(0.26, 0.02, length(fract(ruv * 5.0 - vec2(0.3, 0.1)) - 0.5));
              vec3 bg = mix(u_c2, u_c1 * 0.45, smoothstep(1.0, 0.0, ruv.y));
              bg += u_c3 * b1 * 0.55 + u_c1 * b2 * 0.45;
              float fog = (1.0 - clamp(m * 1.4 + tr * 1.2, 0.0, 1.0)) * 0.32;
              bg = mix(bg, mix(u_c2, u_c1, 0.35), fog);
              float spec = smoothstep(0.15, 0.85, m) * clamp(1.0 - length(n) * 0.2, 0.2, 1.0);
              bg += u_c1 * spec * 0.55;
              return vec4(bg, 1.0);
            }
          `
        },
        {
          id: 'fire',
          name: 'Volumetric Fire',
          c1: '#fb923c', c2: '#140502', c3: '#fef08a',
          glsl: `
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
            float noise(vec2 p){
              vec2 i = floor(p), f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
            }
            float fbm(vec2 p){
              float v = 0.0, a = 0.5;
              for(int i=0;i<5;i++){ v += a * noise(p); p *= 2.03; a *= 0.5; }
              return v;
            }
            vec4 renderEffect(vec2 uv, float t){
              vec2 p = vec2((uv.x - 0.5) * 3.2 * u_scale, (1.0 - uv.y) * 3.4 * u_scale);
              float q = fbm(p - vec2(0.0, t * 1.4));
              float r = fbm(p + vec2(q * 1.6, -t * 2.1));
              float shape = (1.0 - uv.y) * 1.25 - abs(uv.x - 0.5) * 0.65;
              float flame = smoothstep(0.25, 1.05, r * 1.15 + shape * 0.55) * u_intensity;
              vec3 col = mix(u_c2, u_c1, clamp(flame * 1.4, 0.0, 1.0));
              col = mix(col, u_c3, smoothstep(0.65, 1.25, flame));
              vec2 ep = uv * vec2(18.0, 10.0) + vec2(sin(t * 2.0 + uv.y * 8.0) * 0.4, t * 3.2);
              float ember = smoothstep(0.14, 0.0, length(fract(ep) - 0.5)) * step(0.84, hash(floor(ep)));
              col += u_c3 * ember * u_intensity;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'caustics',
          name: 'Ocean Caustics',
          c1: '#38bdf8', c2: '#041e32', c3: '#e0f2fe',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              vec2 p = (uv - 0.5) * 5.0 * u_scale;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.005;
              for(int n = 0; n < 4; n++){
                float ft = t * 0.65 * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(cos(ft - i.x) + sin(ft + i.y), sin(ft - i.y) + cos(ft + i.x));
                c += 1.0 / length(vec2(p.x / (sin(i.x + ft) / inten), p.y / (cos(i.y + ft) / inten)));
              }
              c /= 4.0;
              c = 1.17 - pow(c, 1.4);
              float web = pow(abs(c), 7.5) * u_intensity;
              vec3 col = mix(u_c2, u_c1, smoothstep(1.0, 0.0, uv.y) * 0.55);
              col += mix(u_c1, u_c3, 0.65) * clamp(web, 0.0, 1.4);
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'aurora',
          name: 'Aurora Borealis',
          c1: '#34d399', c2: '#060918', c3: '#818cf8',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              vec2 p = uv * vec2(3.5 * u_scale, 1.6);
              float w1 = sin(p.x * 2.1 + t * 0.7 + sin(p.x * 1.3 - t * 0.4) * 1.4);
              float w2 = cos(p.x * 3.4 - t * 0.55 + w1);
              float curtain = exp(-abs(uv.y - (0.48 + w1 * 0.14 + w2 * 0.06)) * (5.5 / max(0.3, u_intensity)));
              float rays = 0.65 + 0.35 * sin(uv.x * 42.0 * u_scale + w1 * 4.0);
              vec3 col = u_c2;
              col += mix(u_c1, u_c3, smoothstep(-0.6, 0.6, w2)) * curtain * rays * 1.25;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'nebula',
          name: 'Starfield Nebula',
          c1: '#8b5cf6', c2: '#05050b', c3: '#38bdf8',
          glsl: `
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float noise(vec2 p){
              vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
              return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
            }
            vec4 renderEffect(vec2 uv, float t){
              vec2 p = (uv - 0.5) * 3.2 * u_scale;
              float n = noise(p + t * 0.15) * 0.55 + noise(p * 2.3 - t * 0.2) * 0.3 + noise(p * 5.0) * 0.15;
              vec3 col = mix(u_c2, u_c1, smoothstep(0.3, 0.85, n) * u_intensity);
              col = mix(col, u_c3, smoothstep(0.55, 0.95, n) * 0.55);
              vec2 sp = uv * 28.0 * u_scale;
              vec2 sid = floor(sp);
              float rnd = hash(sid);
              float twinkle = 0.5 + 0.5 * sin(t * 3.5 + rnd * 40.0);
              float star = smoothstep(0.14, 0.01, length(fract(sp) - 0.5)) * step(0.86, rnd) * twinkle;
              col += vec3(1.0) * star;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'lightning',
          name: 'Storm Lightning',
          c1: '#c7d2fe', c2: '#070812', c3: '#6366f1',
          glsl: `
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float noise(vec2 p){
              vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
              return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
            }
            vec4 renderEffect(vec2 uv, float t){
              float pulse = pow(max(0.0, sin(t * 2.3) * sin(t * 5.7 + 1.1)), 6.0);
              float jag = (noise(vec2(uv.y * 12.0 * u_scale, floor(t * 6.0))) - 0.5) * 0.28;

              float bolt = 0.008 / (abs(uv.x - (0.5 + jag)) + 0.004);
              float glow = exp(-abs(uv.x - (0.5 + jag)) * 9.0);
              vec3 col = mix(u_c2, u_c3, glow * 0.45 * (0.3 + pulse));
              col += u_c1 * bolt * (0.25 + pulse * 1.4) * u_intensity;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'chrome',
          name: 'Liquid Chrome',
          c1: '#e4e4e7', c2: '#18181b', c3: '#818cf8',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              vec2 p = (uv - 0.5) * 4.2 * u_scale;
              for(int i = 1; i < 5; i++){
                float fi = float(i);
                p.x += 0.35 / fi * sin(fi * 2.2 * p.y + t * 0.9);

            }
          `

        {
          id: 'archgrid',
          name: 'Architectural Grid',
          c1: '#6366f1', c2: '#07070b', c3: '#e0e7ff',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              vec2 g = fract(uv * 8.0 * u_scale);

              float sweep = smoothstep(0.25, 0.0, abs(uv.y - fract(t * 0.35)));
              vec3 col = u_c2 + u_c1 * line * (0.45 + sweep * 0.85) * u_intensity;
              col += u_c3 * line * sweep * 0.6;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'dunes',
          name: 'Sand Dunes',
          c1: '#d97706', c2: '#1c1208', c3: '#fde68a',

          `
        },

          id: 'silk',

          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              float f = sin(uv.x * 5.0 * u_scale + t * 0.9 + cos(uv.y * 3.5 - t * 0.6) * 1.6);
              float sheen = pow(0.5 + 0.5 * f, 3.0) * u_intensity;

              }
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'scanline',
          name: 'Scanline Matrix',
          c1: '#10b981', c2: '#040a07', c3: '#6ee7b7',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              float scan = 0.65 + 0.35 * sin(uv.y * 160.0 * u_scale);
              float bar = smoothstep(0.18, 0.0, abs(uv.y - fract(-t * 0.45)));
              float cols = step(0.18, fract(uv.x * 24.0 * u_scale));
              vec3 col = u_c2 + u_c1 * scan * cols * (0.28 + bar * 0.95) * u_intensity;
              col += u_c3 * bar * 0.45;
              return vec4(col, 1.0);
            }
          `
        },
        {
          id: 'gradient',
          name: 'Solid / Linear Gradient',
          c1: '#6366f1', c2: '#0f172a', c3: '#ec4899',
          glsl: `
            vec4 renderEffect(vec2 uv, float t){
              float mixAmt = clamp(uv.y * u_scale + sin(t * 0.5) * 0.05, 0.0, 1.0);
              vec3 col = mix(u_c1, u_c2, mixAmt) * u_intensity;
              return vec4(col, 1.0);
            }
          `
        }
      ];

      /* =========================================================================
         2. APPLICATION STATE & DEFAULT WINDOW MAPPING SCENE
      ========================================================================= */
      const STORAGE_KEY = 'maptor_projects_v1';
      const ACTIVE_KEY = 'maptor_active_v1';
      const LIVE_KEY = 'maptor_live_snapshot_v1';

      let uidCounter = 1;
      function makeId(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${(uidCounter++).toString(36)}`;
      }

      function createDefaultLayer(type = 'quad', name = null, customPts = null) {
        const w = state ? state.width : 1920;
        const h = state ? state.height : 1080;
        const cx = w * 0.5;
        const cy = h * 0.5;
        const rw = Math.round(w * 0.28);
        const rh = Math.round(h * 0.42);

        let points = [];
        let isEllipse = false;
        let kind = 'surface';
        let sourceType = 'shader';

        if (customPts && customPts.length >= 3) {
          points = customPts.map(p => ({ x: p.x, y: p.y }));
        } else if (type === 'triangle') {
          points = [
            { x: cx, y: cy - rh * 0.6 },
            { x: cx + rw * 0.6, y: cy + rh * 0.5 },
            { x: cx - rw * 0.6, y: cy + rh * 0.5 }
          ];
        } else if (type === 'circle') {
          isEllipse = true;
          const r = Math.min(rw, rh) * 0.55;
          points = [
            { x: cx - r, y: cy - r },
            { x: cx + r, y: cy - r },
            { x: cx + r, y: cy + r },
            { x: cx - r, y: cy + r }
          ];
        } else {
          points = [
            { x: cx - rw * 0.5, y: cy - rh * 0.5 },
            { x: cx + rw * 0.5, y: cy - rh * 0.5 },
            { x: cx + rw * 0.5, y: cy + rh * 0.5 },
            { x: cx - rw * 0.5, y: cy + rh * 0.5 }
          ];
        }

        if (type === 'text') sourceType = 'text';
        if (type === 'mask') kind = 'mask';

        const defaultName = name || (
          type === 'mask' ? 'Blackout Mask' :
          type === 'text' ? 'Typography Layer' :
          type === 'triangle' ? 'Triangle Surface' :
          type === 'circle' ? 'Circle Surface' :
          type === 'polygon' ? 'Custom Polygon' : 'Quad Surface'
        );

        return {
          id: makeId('lyr'),
          name: defaultName,
          kind,
          shapeType: type,
          isEllipse,
          visible: true,
          locked: false,
          opacity: 1.0,
          blendMode: 'normal',
          points,
          meshSubdiv: 1,
          meshOffsets: [],
          sourceType,
          shaderId: 'rain',
          c1: '#93c5fd',
          c2: '#0f172a',
          c3: '#f59e0b',
          speed: 1.0,
          scale: 1.0,
          intensity: 1.15,
          fitMode: 'cover', // 'cover' | 'contain' | 'original' | 'warp'
          contentOffsetX: 0,
          contentOffsetY: 0,
          contentZoom: 1.0,
          contentRot: 0,
          mediaDataUrl: '',
          mediaType: '',
          mediaName: '',
          videoLoop: true,
          videoSpeed: 1.0,
          text: 'THESIS\nEXHIBITION',
          fontFamily: 'Inter',
          fontWeight: '700',
          fontSize: 96,
          letterSpacing: 4,
          lineHeight: 1.1,
          textAlign: 'center',
          textColor: '#ffffff',
          textOutline: 0,
          winPreset: 'none',
          winArch: 'flat',
          winArchH: 0,
          winCols: 1,
          winRows: 1,
          winBar: 0,
          winFrame: 0,
          winCorner: 0,
          winLattice: false,
          winInvert: false,
          winFeather: 2
        };
      }

      function cloneLayerState(l) {
        return JSON.parse(JSON.stringify(l));
      }

      function createInitialState() {
        const l1 = createDefaultLayer('quad', 'Left Arch Window');
        l1.points = [
          { x: 420, y: 210 },

        l1.winFrame = 24;
        l1.shaderId = 'rain';

        const l2 = createDefaultLayer('quad', 'Right Classic Window');
        l2.points = [

        ];

        const cue1 = {

        };

        cue2Layers[0].c1 = '#fb923c';
        cue2Layers[0].c2 = '#140502';
        cue2Layers[0].c3 = '#fef08a';
        cue2Layers[1].shaderId = 'caustics';
        cue2Layers[1].c1 = '#38bdf8';
        cue2Layers[1].c2 = '#041e32';
        cue2Layers[1].c3 = '#e0f2fe';

        const cue2 = {
          id: makeId('cue'),
          name: 'Cue 2: Fire & Water',

        return {

      let state = createInitialState();
      try {
        const saved = localStorage.getItem(ACTIVE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.layers)) {
            state = parsed;
          }
        }
      } catch (e) {}

      // Editor UI State
      const ui = {
        tool: 'box', // 'box' | 'warp' | 'pen'
        snap: true,
        showGrid: false,
        zoom: 1,
        zoomManual: false,
        penPoints: [],
        dragging: null,
        selectedVertex: -1,
        isPlaying: false,
        autoAdvance: true,
        loopShow: true,
        cueElapsed: 0,
        transition: null, // { fromLayers, toLayers, elapsed, duration }
        lastFrameTime: performance.now(),
        clockSec: 0
      };

      /* =========================================================================
         3. RUNTIME MEDIA & TEXT TEXTURE CACHE
      ========================================================================= */
      const mediaCache = new Map(); // layerId -> { kind, el, key }
      const textCache = new Map();  // layerId -> { canvas, key }

      function getTextCanvas(layer) {
        const key = JSON.stringify([
          layer.text, layer.fontFamily, layer.fontWeight, layer.fontSize,
          layer.letterSpacing, layer.lineHeight, layer.textAlign,
          layer.textColor, layer.textOutline
        ]);
        const cached = textCache.get(layer.id);
        if (cached && cached.key === key) return cached.canvas;

        loadGoogleFont(layer.fontFamily);
        const cvs = cached ? cached.canvas : document.createElement('canvas');
        cvs.width = 1600;
        cvs.height = 1000;
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        const lines = String(layer.text || '').split('\n');
        const fontSize = Math.max(12, Number(layer.fontSize) || 80);
        const lineHeight = fontSize * (Number(layer.lineHeight) || 1.1);
        ctx.font = `${layer.fontWeight || '700'} ${fontSize}px "${layer.fontFamily || 'Inter'}", sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.textAlign = layer.textAlign || 'center';

        const totalH = lines.length * lineHeight;
        let startY = (cvs.height - totalH) * 0.5 + lineHeight * 0.5;
        let x = cvs.width * 0.5;
        if (layer.textAlign === 'left') x = 120;
        if (layer.textAlign === 'right') x = cvs.width - 120;

        lines.forEach((line, idx) => {
          const y = startY + idx * lineHeight;
          const spacing = Number(layer.letterSpacing) || 0;
          if (spacing === 0) {
            if (layer.textOutline > 0) {
              ctx.lineWidth = layer.textOutline * 2;
              ctx.strokeStyle = '#000000';
              ctx.lineJoin = 'round';
              ctx.strokeText(line, x, y);
            }
            ctx.fillStyle = layer.textColor || '#ffffff';
            ctx.fillText(line, x, y);
          } else {
            // Manual letter-spaced rendering
            const chars = Array.from(line);
            const widths = chars.map(ch => ctx.measureText(ch).width);
            const totalW = widths.reduce((a, b) => a + b, 0) + Math.max(0, chars.length - 1) * spacing;
            let cx = x;
            if (layer.textAlign === 'center') cx = x - totalW * 0.5;
            if (layer.textAlign === 'right') cx = x - totalW;
            ctx.textAlign = 'left';
            chars.forEach((ch, ci) => {
              if (layer.textOutline > 0) {
                ctx.lineWidth = layer.textOutline * 2;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(ch, cx, y);
              }
              ctx.fillStyle = layer.textColor || '#ffffff';
              ctx.fillText(ch, cx, y);
              cx += widths[ci] + spacing;
            });
            ctx.textAlign = layer.textAlign || 'center';
          }
        });

        textCache.set(layer.id, { canvas: cvs, key });
        return cvs;
      }

      function getMediaSource(layer) {
        if (layer.sourceType === 'text') {
          return { kind: 'canvas', el: getTextCanvas(layer), ready: true, w: 1600, h: 1000 };
        }
        if (layer.sourceType !== 'media' || !layer.mediaDataUrl) return null;

        const key = `${layer.mediaType}|${layer.mediaDataUrl.slice(0, 80)}|${layer.mediaDataUrl.length}`;
        let entry = mediaCache.get(layer.id);
        if (!entry || entry.key !== key) {
          if (entry && entry.el && entry.kind === 'video') {
            try { entry.el.pause(); entry.el.src = ''; } catch (e) {}
          }
          if (layer.mediaType === 'video') {
            const vid = document.createElement('video');
            vid.src = layer.mediaDataUrl;
            vid.muted = true;
            vid.loop = layer.videoLoop !== false;
            vid.playsInline = true;
            vid.crossOrigin = 'anonymous';
            vid.playbackRate = Number(layer.videoSpeed) || 1.0;
            vid.play().catch(() => {});
            entry = { kind: 'video', el: vid, key };
          } else {
            const img = new Image();
            img.src = layer.mediaDataUrl;
            entry = { kind: 'image', el: img, key };
          }
          mediaCache.set(layer.id, entry);
        }

        if (entry.kind === 'video') {
          entry.el.loop = layer.videoLoop !== false;
          entry.el.playbackRate = Number(layer.videoSpeed) || 1.0;
          if (entry.el.paused && entry.el.readyState >= 2) {
            entry.el.play().catch(() => {});
          }
          return {
            kind: 'video',
            el: entry.el,
            ready: entry.el.readyState >= 2,
            w: entry.el.videoWidth || 1920,
            h: entry.el.videoHeight || 1080
          };
        } else {
          return {
            kind: 'image',
            el: entry.el,
            ready: entry.el.complete && entry.el.naturalWidth > 0,
            w: entry.el.naturalWidth || 1920,
            h: entry.el.naturalHeight || 1080
          };
        }
      }

      /* =========================================================================
         4. WEBGL2 PROJECTION & SHADER COMPOSITOR ENGINE
      ========================================================================= */
      function createProjectionRenderer(canvas) {
        const gl = canvas.getContext('webgl2', { alpha: false, antialias: true, preserveDrawingBuffer: true });
        if (!gl) return null;

        const VS_SRC = `#version 300 es
          precision highp float;
          layout(location = 0) in vec2 a_pos;
          layout(location = 1) in vec2 a_uv;
          uniform vec2 u_res;
          out vec2 v_uv;
          out vec2 v_screen;
          void main() {
            v_uv = a_uv;
            v_screen = a_pos;
            vec2 clip = (a_pos / u_res) * 2.0 - 1.0;
            gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
          }
        `;

        function buildFragmentSource(effectBody) {
          return `#version 300 es
            precision highp float;
            in vec2 v_uv;
            in vec2 v_screen;
            out vec4 outColor;

            uniform sampler2D u_tex;
            uniform int u_sourceMode; // 0=shader, 1=texture, 2=mask
            uniform int u_fitMode;    // 0=warp, 1=cover, 2=contain, 3=original
            uniform vec2 u_res;
            uniform vec2 u_texSize;
            uniform vec4 u_bounds;    // minX, minY, maxX, maxY
            uniform vec2 u_contentOffset;
            uniform float u_contentZoom;
            uniform float u_contentRot;

            uniform float u_time;
            uniform float u_scale;
            uniform float u_intensity;
            uniform float u_opacity;
            uniform vec3 u_c1;
            uniform vec3 u_c2;
            uniform vec3 u_c3;

            // Window & Architectural Mask Uniforms
            uniform int u_isEllipse;
            uniform int u_winArch;    // 0=flat, 1=round, 2=pointed, 3=triangle
            uniform float u_winArchH; // 0..0.6
            uniform int u_winMode;    // 0=grid, 1=palladian, 2=rose
            uniform float u_winCols;
            uniform float u_winRows;
            uniform float u_winBar;   // normalized thickness
            uniform float u_winFrame; // normalized frame border
            uniform float u_winCorner;// normalized radius
            uniform int u_winLattice;
            uniform int u_winInvert;
            uniform float u_winFeather;

            ${effectBody}

            vec2 computeContentUV() {
              vec2 uv = v_uv;
              if (u_fitMode != 0) {
                vec2 bMin = u_bounds.xy;
                vec2 bSize = max(vec2(1.0), u_bounds.zw - u_bounds.xy);
                uv = (v_screen - bMin) / bSize;
                float boxAsp = bSize.x / bSize.y;
                float texAsp = max(0.01, u_texSize.x / max(1.0, u_texSize.y));
                vec2 centered = uv - 0.5;
                if (u_fitMode == 1) { // cover
                  if (boxAsp > texAsp) centered.y *= texAsp / boxAsp;
                  else centered.x *= boxAsp / texAsp;
                } else if (u_fitMode == 2) { // contain
                  if (boxAsp > texAsp) centered.x *= boxAsp / texAsp;
                  else centered.y *= texAsp / boxAsp;
                } else if (u_fitMode == 3) { // original 1:1
                  centered = (v_screen - (bMin + bSize * 0.5)) / max(vec2(1.0), u_texSize);
                }
                uv = centered + 0.5;
              }
              // Apply user zoom, rotation, and pan offset
              vec2 p = (uv - 0.5) / max(0.05, u_contentZoom);
              float c = cos(u_contentRot), s = sin(u_contentRot);
              p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
              return p + 0.5 - u_contentOffset;
            }

            float evaluateArchitecturalMask(vec2 uv) {
              float feather = max(0.002, u_winFeather);

              // Outer boundary SDF (negative inside, positive outside)
              float outerDist = -1.0;
              if (u_isEllipse == 1) {
                outerDist = length((uv - 0.5) * 2.0) - 1.0;
              } else if (u_winArch == 1 && u_winArchH > 0.01 && uv.y < u_winArchH) {
                vec2 ap = vec2((uv.x - 0.5) * 2.0, (u_winArchH - uv.y) / u_winArchH);
                outerDist = length(ap) - 1.0;
              } else if (u_winArch == 2 && u_winArchH > 0.01 && uv.y < u_winArchH) {
                float ny = (u_winArchH - uv.y) / u_winArchH;
                float halfW = sqrt(max(0.0, 1.0 - ny * ny));
                outerDist = abs((uv.x - 0.5) * 2.0) - halfW;
              } else if (u_winArch == 3 && u_winArchH > 0.01 && uv.y < u_winArchH) {
                float halfW = uv.y / u_winArchH;
                outerDist = abs((uv.x - 0.5) * 2.0) - halfW;
              } else if (u_winCorner > 0.002) {
                vec2 q = abs(uv - 0.5) - (0.5 - u_winCorner);
                outerDist = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - u_winCorner;
              } else {
                vec2 d = abs(uv - 0.5) - 0.5;
                outerDist = max(d.x, d.y);
              }

              float outerAlpha = 1.0 - smoothstep(-feather, feather, outerDist);

              // Frame & Mullions (1.0 = solid frame/bar blocking light, 0.0 = open pane)
              float barMask = 0.0;
              if (u_winFrame > 0.001) {
                float inFrame = smoothstep(-u_winFrame - feather, -u_winFrame + feather, outerDist);
                barMask = max(barMask, inFrame);
              }

              float halfBar = u_winBar * 0.5;
              if (halfBar > 0.0005) {
                if (u_winMode == 2) {
                  // Rose wheel spokes + inner ring
                  vec2 p = uv - 0.5;
                  float r = length(p) * 2.0;
                  float a = atan(p.y, p.x);
                  float seg = 6.2831853 / max(3.0, u_winCols);
                  float spokeD = abs(mod(a + seg * 0.5, seg) - seg * 0.5) * r;
                  barMask = max(barMask, 1.0 - smoothstep(halfBar, halfBar + feather, spokeD));
                  barMask = max(barMask, 1.0 - smoothstep(halfBar, halfBar + feather, abs(r - 0.48)));
                } else if (u_winMode == 1) {
                  // Palladian triple columns + transom
                  float c1 = 1.0 - smoothstep(halfBar, halfBar + feather, abs(uv.x - 0.26));
                  float c2 = 1.0 - smoothstep(halfBar, halfBar + feather, abs(uv.x - 0.74));
                  float tr = 1.0 - smoothstep(halfBar, halfBar + feather, abs(uv.y - max(0.32, u_winArchH)));
                  barMask = max(barMask, max(max(c1, c2), tr));
                } else {
                  if (u_winCols > 1.0) {
                    float gx = abs(fract(uv.x * u_winCols + 0.5) - 0.5) / u_winCols;
                    if (uv.x > 0.02 && uv.x < 0.98) {
                      barMask = max(barMask, 1.0 - smoothstep(halfBar, halfBar + feather, gx));
                    }
                  }
                  if (u_winRows > 1.0) {
                    float gy = abs(fract(uv.y * u_winRows + 0.5) - 0.5) / u_winRows;
                    if (uv.y > 0.02 && uv.y < 0.98) {
                      barMask = max(barMask, 1.0 - smoothstep(halfBar, halfBar + feather, gy));
                    }
                  }
                }

                if (u_winLattice == 1) {
                  vec2 luv = vec2(uv.x + uv.y, uv.x - uv.y) * max(2.0, u_winCols);
                  float lx = abs(fract(luv.x + 0.5) - 0.5) / max(2.0, u_winCols);
                  float ly = abs(fract(luv.y + 0.5) - 0.5) / max(2.0, u_winCols);
                  float ld = min(lx, ly);
                  barMask = max(barMask, 1.0 - smoothstep(halfBar * 0.85, halfBar * 0.85 + feather, ld));
                }
              }

              float paneOpen = (u_winInvert == 1) ? barMask : (1.0 - barMask);
              return outerAlpha * clamp(paneOpen, 0.0, 1.0);
            }

            void main() {
              float maskAlpha = evaluateArchitecturalMask(v_uv);
              if (maskAlpha <= 0.001) discard;

              if (u_sourceMode == 2) {
                // Standalone blackout cutout mask
                outColor = vec4(0.0, 0.0, 0.0, maskAlpha * u_opacity);
                return;
              }

              vec2 cuv = computeContentUV();
              vec4 col = vec4(0.0);
              if (u_sourceMode == 1) {
                if (u_fitMode == 2 || u_fitMode == 3) {
                  if (cuv.x < 0.0 || cuv.x > 1.0 || cuv.y < 0.0 || cuv.y > 1.0) discard;
                }
                col = texture(u_tex, cuv);
              } else {
                col = renderEffect(cuv, u_time);
              }

              outColor = vec4(col.rgb, col.a * maskAlpha * u_opacity);
            }
          `;
        }

        function compileProgram(fragSrc) {
          const vs = gl.createShader(gl.VERTEX_SHADER);
          gl.shaderSource(vs, VS_SRC);
          gl.compileShader(vs);
          if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            console.warn('VS error:', gl.getShaderInfoLog(vs));
            return null;
          }
          const fs = gl.createShader(gl.FRAGMENT_SHADER);
          gl.shaderSource(fs, fragSrc);
          gl.compileShader(fs);
          if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            console.warn('FS error:', gl.getShaderInfoLog(fs));
            return null;
          }
          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            console.warn('Link error:', gl.getProgramInfoLog(prog));
            return null;
          }
          return prog;
        }

        const programs = new Map();
        SHADERS.forEach(s => {
          const prog = compileProgram(buildFragmentSource(s.glsl));
          if (prog) programs.set(s.id, prog);
        });

        const posBuf = gl.createBuffer();
        const uvBuf = gl.createBuffer();
        const textures = new Map();

        function getOrUploadTexture(layerId, source) {
          let tex = textures.get(layerId);
          if (!tex) {
            tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            textures.set(layerId, tex);
          }
          gl.bindTexture(gl.TEXTURE_2D, tex);
          try {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source.el);
          } catch (e) {}
          return tex;
        }

        function hexToRgb(hex) {
          const h = (hex || '#ffffff').replace('#', '');
          const v = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16) || 0;
          return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255];
        }

        function buildGeometry(layer) {
          const pts = layer.points;
          if (!pts || pts.length < 3) return null;

          // 4-point quad with optional mesh grid subdivisions
          if (pts.length === 4) {
            const sub = Math.max(1, Math.min(8, Number(layer.meshSubdiv) || 1));
            const pos = [];
            const uv = [];

            const getGridPt = (gx, gy) => {
              const u = gx / sub;
              const v = gy / sub;
              const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
              const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
              const base = { x: top.x + (bot.x - top.x) * v, y: top.y + (bot.y - top.y) * v };
              const off = (layer.meshOffsets || [])[gy * (sub + 1) + gx];
              if (off) {
                base.x += off.x;
                base.y += off.y;
              }
              return { p: base, u, v };
            };

            for (let gy = 0; gy < sub; gy++) {
              for (let gx = 0; gx < sub; gx++) {
                const a = getGridPt(gx, gy);
                const b = getGridPt(gx + 1, gy);
                const c = getGridPt(gx + 1, gy + 1);
                const d = getGridPt(gx, gy + 1);
                pos.push(a.p.x, a.p.y, b.p.x, b.p.y, c.p.x, c.p.y);
                pos.push(a.p.x, a.p.y, c.p.x, c.p.y, d.p.x, d.p.y);
                uv.push(a.u, a.v, b.u, b.v, c.u, c.v);
                uv.push(a.u, a.v, c.u, c.v, d.u, d.v);
              }
            }
            return { pos: new Float32Array(pos), uv: new Float32Array(uv), count: pos.length / 2 };
          }

          // Triangle or N-gon fan triangulation with bounding-box UVs
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          pts.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
          });
          const bw = Math.max(1, maxX - minX);
          const bh = Math.max(1, maxY - minY);
          const pos = [];
          const uv = [];
          for (let i = 1; i < pts.length - 1; i++) {
            const tri = [pts[0], pts[i], pts[i + 1]];
            tri.forEach(p => {
              pos.push(p.x, p.y);
              uv.push((p.x - minX) / bw, (p.y - minY) / bh);
            });
          }
          return { pos: new Float32Array(pos), uv: new Float32Array(uv), count: pos.length / 2 };
        }

        function renderScene(width, height, layers, timeSec, getSourceFn) {
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
          gl.viewport(0, 0, width, height);
          gl.clearColor(0.0, 0.0, 0.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);

          layers.forEach(layer => {
            if (!layer.visible || layer.opacity <= 0.001) return;
            const geom = buildGeometry(layer);
            if (!geom) return;

            const prog = programs.get(layer.shaderId) || programs.get('rain');
            if (!prog) return;
            gl.useProgram(prog);

            // Blend mode
            if (layer.blendMode === 'add') {
              gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            } else if (layer.blendMode === 'screen') {
              gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
            } else {
              gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            }

            // Bounds
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            layer.points.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.y < minY) minY = p.y;
              if (p.x > maxX) maxX = p.x;
              if (p.y > maxY) maxY = p.y;
            });
            const boxW = Math.max(1, maxX - minX);
            const boxH = Math.max(1, maxY - minY);
            const avgDim = (boxW + boxH) * 0.5;

            let sourceMode = 0;
            let texW = width, texH = height;
            if (layer.kind === 'mask') {
              sourceMode = 2;
            } else if (layer.sourceType === 'media' || layer.sourceType === 'text') {
              const src = getSourceFn(layer);
              if (src && src.ready) {
                sourceMode = 1;
                texW = src.w;
                texH = src.h;
                gl.activeTexture(gl.TEXTURE0);
                getOrUploadTexture(layer.id, src);
                gl.uniform1i(gl.getUniformLocation(prog, 'u_tex'), 0);
              }
            }

            const fitMap = { warp: 0, cover: 1, contain: 2, original: 3 };
            const archMap = { flat: 0, round: 1, pointed: 2, triangle: 3 };
            const modeMap = { grid: 0, palladian: 1, rose: 2 };

            gl.uniform2f(gl.getUniformLocation(prog, 'u_res'), width, height);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_sourceMode'), sourceMode);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_fitMode'), fitMap[layer.fitMode] ?? 1);
            gl.uniform2f(gl.getUniformLocation(prog, 'u_texSize'), texW, texH);
            gl.uniform4f(gl.getUniformLocation(prog, 'u_bounds'), minX, minY, maxX, maxY);
            gl.uniform2f(gl.getUniformLocation(prog, 'u_contentOffset'), (layer.contentOffsetX || 0) * 0.01, (layer.contentOffsetY || 0) * 0.01);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_contentZoom'), Number(layer.contentZoom) || 1.0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_contentRot'), ((Number(layer.contentRot) || 0) * Math.PI) / 180);

            gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), timeSec * (Number(layer.speed) || 1.0));
            gl.uniform1f(gl.getUniformLocation(prog, 'u_scale'), Number(layer.scale) || 1.0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_intensity'), Number(layer.intensity) || 1.0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_opacity'), Number(layer.opacity) ?? 1.0);

            const c1 = hexToRgb(layer.c1);
            const c2 = hexToRgb(layer.c2);
            const c3 = hexToRgb(layer.c3);
            gl.uniform3f(gl.getUniformLocation(prog, 'u_c1'), c1[0], c1[1], c1[2]);
            gl.uniform3f(gl.getUniformLocation(prog, 'u_c2'), c2[0], c2[1], c2[2]);
            gl.uniform3f(gl.getUniformLocation(prog, 'u_c3'), c3[0], c3[1], c3[2]);

            gl.uniform1i(gl.getUniformLocation(prog, 'u_isEllipse'), layer.isEllipse ? 1 : 0);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_winArch'), archMap[layer.winArch] ?? 0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winArchH'), (Number(layer.winArchH) || 0) * 0.01);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_winMode'), modeMap[layer.winMode] ?? 0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winCols'), Math.max(1, Number(layer.winCols) || 1));
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winRows'), Math.max(1, Number(layer.winRows) || 1));
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winBar'), (Number(layer.winBar) || 0) / avgDim);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winFrame'), (Number(layer.winFrame) || 0) / avgDim);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winCorner'), (Number(layer.winCorner) || 0) / avgDim);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_winLattice'), layer.winLattice ? 1 : 0);
            gl.uniform1i(gl.getUniformLocation(prog, 'u_winInvert'), layer.winInvert ? 1 : 0);
            gl.uniform1f(gl.getUniformLocation(prog, 'u_winFeather'), Math.max(1, Number(layer.winFeather) || 1) / avgDim);

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferData(gl.ARRAY_BUFFER, geom.pos, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
            gl.bufferData(gl.ARRAY_BUFFER, geom.uv, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);

            gl.drawArrays(gl.TRIANGLES, 0, geom.count);
          });
        }

        return { renderScene };
      }

      /* =========================================================================
         5. LIVE PROJECTOR WINDOW SYNC (BROADCASTCHANNEL + POSTMESSAGE + STORAGE)
      ========================================================================= */
      let projectorWin = null;
      const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('maptor_live') : null;

      function buildProjectorPopupHTML() {
        const shaderListJson = JSON.stringify(SHADERS);
        return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Maptor — Live Projector Output</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100vw;height:100vh;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:none}
  body:hover{cursor:default}
  canvas{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  #bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;opacity:0;transition:opacity .2s}
  body:hover #bar{opacity:1}
  button{background:rgba(24,24,30,.85);color:#fff;border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:6px;font:500 12px system-ui,sans-serif;cursor:pointer}
  button:hover{background:#6366f1}
</style>
</head>
<body>
<canvas id="proj-gl" width="1920" height="1080"></canvas>
<div id="bar">
  <button id="btn-grid">Grid (G)</button>
  <button id="btn-fs">Fullscreen (F)</button>
</div>
<script>
(() => {
  const SHADERS = ${shaderListJson};
  const LIVE_KEY = 'maptor_live_snapshot_v1';
  const canvas = document.getElementById('proj-gl');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: true });
  let showGrid = false;
  let liveState = { width: 1920, height: 1080, layers: [], showGrid: false };
  const loadedFonts = new Set();
  const mediaCache = new Map();
  const textCache = new Map();

  function loadFont(f) {
    if (!f || loadedFonts.has(f)) return;
    loadedFonts.add(f);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f) + ':wght@300;400;500;600;700;800;900&display=swap';
    document.head.appendChild(l);
  }

  function getTextCanvas(layer) {
    const key = JSON.stringify([layer.text, layer.fontFamily, layer.fontWeight, layer.fontSize, layer.letterSpacing, layer.lineHeight, layer.textAlign, layer.textColor, layer.textOutline]);
    const c = textCache.get(layer.id);
    if (c && c.key === key) return c.canvas;
    loadFont(layer.fontFamily);
    const cvs = c ? c.canvas : document.createElement('canvas');
    cvs.width = 1600; cvs.height = 1000;
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, 1600, 1000);
    const lines = String(layer.text || '').split('\\n');
    const fs = Math.max(12, Number(layer.fontSize) || 80);
    const lh = fs * (Number(layer.lineHeight) || 1.1);
    ctx.font = (layer.fontWeight || '700') + ' ' + fs + 'px "' + (layer.fontFamily || 'Inter') + '", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = layer.textAlign || 'center';
    let y0 = (1000 - lines.length * lh) * 0.5 + lh * 0.5;
    let x = layer.textAlign === 'left' ? 120 : layer.textAlign === 'right' ? 1480 : 800;
    lines.forEach((line, idx) => {
      const y = y0 + idx * lh;
      if (layer.textOutline > 0) {
        ctx.lineWidth = layer.textOutline * 2;
        ctx.strokeStyle = '#000';
        ctx.strokeText(line, x, y);
      }
      ctx.fillStyle = layer.textColor || '#fff';
      ctx.fillText(line, x, y);
    });
    textCache.set(layer.id, { canvas: cvs, key });
    return cvs;
  }

  function getSource(layer) {
    if (layer.sourceType === 'text') return { el: getTextCanvas(layer), ready: true, w: 1600, h: 1000 };
    if (layer.sourceType !== 'media' || !layer.mediaDataUrl) return null;
    const key = layer.mediaType + '|' + layer.mediaDataUrl.slice(0, 80) + '|' + layer.mediaDataUrl.length;
    let e = mediaCache.get(layer.id);
    if (!e || e.key !== key) {
      if (layer.mediaType === 'video') {
        const v = document.createElement('video');
        v.src = layer.mediaDataUrl; v.muted = true; v.loop = true; v.playsInline = true;
        v.play().catch(() => {});
        e = { kind: 'video', el: v, key };
      } else {
        const im = new Image(); im.src = layer.mediaDataUrl;
        e = { kind: 'image', el: im, key };
      }
      mediaCache.set(layer.id, e);
    }
    if (e.kind === 'video') {
      if (e.el.paused && e.el.readyState >= 2) e.el.play().catch(() => {});
      return { el: e.el, ready: e.el.readyState >= 2, w: e.el.videoWidth || 1920, h: e.el.videoHeight || 1080 };
    }
    return { el: e.el, ready: e.el.complete && e.el.naturalWidth > 0, w: e.el.naturalWidth || 1920, h: e.el.naturalHeight || 1080 };
  }

  const VS = \`#version 300 es
    precision highp float;
    layout(location=0) in vec2 a_pos;
    layout(location=1) in vec2 a_uv;
    uniform vec2 u_res;
    out vec2 v_uv; out vec2 v_screen;
    void main(){ v_uv=a_uv; v_screen=a_pos; vec2 c=(a_pos/u_res)*2.0-1.0; gl_Position=vec4(c.x,-c.y,0.0,1.0); }\`;

  function buildFS(body) {
    return \`#version 300 es
      precision highp float;
      in vec2 v_uv; in vec2 v_screen; out vec4 outColor;
      uniform sampler2D u_tex; uniform int u_sourceMode; uniform int u_fitMode;
      uniform vec2 u_res; uniform vec2 u_texSize; uniform vec4 u_bounds;
      uniform vec2 u_contentOffset; uniform float u_contentZoom; uniform float u_contentRot;
      uniform float u_time; uniform float u_scale; uniform float u_intensity; uniform float u_opacity;
      uniform vec3 u_c1; uniform vec3 u_c2; uniform vec3 u_c3;
      uniform int u_isEllipse; uniform int u_winArch; uniform float u_winArchH; uniform int u_winMode;
      uniform float u_winCols; uniform float u_winRows; uniform float u_winBar; uniform float u_winFrame;
      uniform float u_winCorner; uniform int u_winLattice; uniform int u_winInvert; uniform float u_winFeather;
      \${body}
      vec2 computeContentUV(){
        vec2 uv = v_uv;
        if(u_fitMode != 0){
          vec2 bMin = u_bounds.xy, bSize = max(vec2(1.0), u_bounds.zw - u_bounds.xy);
          uv = (v_screen - bMin) / bSize;
          float boxAsp = bSize.x / bSize.y, texAsp = max(0.01, u_texSize.x / max(1.0, u_texSize.y));
          vec2 cen = uv - 0.5;
          if(u_fitMode == 1){ if(boxAsp > texAsp) cen.y *= texAsp/boxAsp; else cen.x *= boxAsp/texAsp; }
          else if(u_fitMode == 2){ if(boxAsp > texAsp) cen.x *= boxAsp/texAsp; else cen.y *= texAsp/boxAsp; }
          else if(u_fitMode == 3){ cen = (v_screen - (bMin + bSize*0.5)) / max(vec2(1.0), u_texSize); }
          uv = cen + 0.5;
        }
        vec2 p = (uv - 0.5) / max(0.05, u_contentZoom);
        float c = cos(u_contentRot), s = sin(u_contentRot);
        return vec2(p.x*c - p.y*s, p.x*s + p.y*c) + 0.5 - u_contentOffset;
      }
      float evalMask(vec2 uv){
        float f = max(0.002, u_winFeather);
        float od = -1.0;
        if(u_isEllipse == 1) od = length((uv - 0.5)*2.0) - 1.0;
        else if(u_winArch == 1 && u_winArchH > 0.01 && uv.y < u_winArchH) od = length(vec2((uv.x-0.5)*2.0, (u_winArchH-uv.y)/u_winArchH)) - 1.0;
        else if(u_winArch == 2 && u_winArchH > 0.01 && uv.y < u_winArchH){ float ny=(u_winArchH-uv.y)/u_winArchH; od = abs((uv.x-0.5)*2.0) - sqrt(max(0.0, 1.0-ny*ny)); }
        else if(u_winArch == 3 && u_winArchH > 0.01 && uv.y < u_winArchH) od = abs((uv.x-0.5)*2.0) - (uv.y/u_winArchH);
        else if(u_winCorner > 0.002){ vec2 q = abs(uv-0.5)-(0.5-u_winCorner); od = length(max(q,0.0))+min(max(q.x,q.y),0.0)-u_winCorner; }
        else { vec2 d = abs(uv-0.5)-0.5; od = max(d.x, d.y); }
        float oa = 1.0 - smoothstep(-f, f, od);
        float bm = 0.0;
        if(u_winFrame > 0.001) bm = max(bm, smoothstep(-u_winFrame-f, -u_winFrame+f, od));
        float hb = u_winBar * 0.5;
        if(hb > 0.0005){
          if(u_winMode == 2){
            vec2 p = uv-0.5; float r = length(p)*2.0; float a = atan(p.y, p.x); float seg = 6.2831853/max(3.0, u_winCols);
            bm = max(bm, 1.0 - smoothstep(hb, hb+f, abs(mod(a+seg*0.5, seg)-seg*0.5)*r));
            bm = max(bm, 1.0 - smoothstep(hb, hb+f, abs(r-0.48)));
          } else if(u_winMode == 1){
            bm = max(bm, max(max(1.0-smoothstep(hb,hb+f,abs(uv.x-0.26)), 1.0-smoothstep(hb,hb+f,abs(uv.x-0.74))), 1.0-smoothstep(hb,hb+f,abs(uv.y-max(0.32,u_winArchH)))));
          } else {
            if(u_winCols > 1.0 && uv.x > 0.02 && uv.x < 0.98) bm = max(bm, 1.0-smoothstep(hb,hb+f,abs(fract(uv.x*u_winCols+0.5)-0.5)/u_winCols));
            if(u_winRows > 1.0 && uv.y > 0.02 && uv.y < 0.98) bm = max(bm, 1.0-smoothstep(hb,hb+f,abs(fract(uv.y*u_winRows+0.5)-0.5)/u_winRows));
          }
          if(u_winLattice == 1){
            vec2 luv = vec2(uv.x+uv.y, uv.x-uv.y)*max(2.0, u_winCols);
            float ld = min(abs(fract(luv.x+0.5)-0.5), abs(fract(luv.y+0.5)-0.5))/max(2.0, u_winCols);
            bm = max(bm, 1.0-smoothstep(hb*0.85, hb*0.85+f, ld));
          }
        }
        return oa * clamp((u_winInvert == 1) ? bm : (1.0 - bm), 0.0, 1.0);
      }
      void main(){
        float ma = evalMask(v_uv);
        if(ma <= 0.001) discard;
        if(u_sourceMode == 2){ outColor = vec4(0.0,0.0,0.0, ma*u_opacity); return; }
        vec2 cuv = computeContentUV();
        vec4 col = (u_sourceMode == 1) ? texture(u_tex, cuv) : renderEffect(cuv, u_time);
        if(u_sourceMode == 1 && (u_fitMode == 2 || u_fitMode == 3) && (cuv.x < 0.0 || cuv.x > 1.0 || cuv.y < 0.0 || cuv.y > 1.0)) discard;
        outColor = vec4(col.rgb, col.a * ma * u_opacity);
      }\`;
  }

  const progs = new Map();
  SHADERS.forEach(s => {
    const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, buildFS(s.glsl)); gl.compileShader(fs);
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (gl.getProgramParameter(p, gl.LINK_STATUS)) progs.set(s.id, p);
  });

  const posBuf = gl.createBuffer(), uvBuf = gl.createBuffer(), texMap = new Map();
  function hexRgb(h) { const v = parseInt((h||'#fff').replace('#',''), 16)||0; return [(v>>16&255)/255, (v>>8&255)/255, (v&255)/255]; }

  function applySnapshot(snap) {
    if (!snap) return;
    liveState = snap;
    if (typeof snap.showGrid === 'boolean') showGrid = snap.showGrid;
  }

  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('maptor_live') : null;
  if (bc) bc.onmessage = (e) => applySnapshot(e.data);
  window.addEventListener('message', (e) => applySnapshot(e.data));
  window.addEventListener('storage', (e) => {
    if (e.key === LIVE_KEY && e.newValue) {
      try { applySnapshot(JSON.parse(e.newValue)); } catch (err) {}
    }
  });
  try {
    const init = localStorage.getItem(LIVE_KEY);
    if (init) applySnapshot(JSON.parse(init));
  } catch (e) {}

  document.getElementById('btn-fs').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  };
  document.getElementById('btn-grid').onclick = () => { showGrid = !showGrid; };
  document.addEventListener('dblclick', () => document.getElementById('btn-fs').click());
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'f') document.getElementById('btn-fs').click();
    if (e.key.toLowerCase() === 'g') showGrid = !showGrid;
  });

  const t0 = performance.now();
  function loop(now) {
    const tSec = (now - t0) * 0.001;
    const W = liveState.width || 1920, H = liveState.height || 1080;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);

    (liveState.layers || []).forEach(layer => {
      if (!layer.visible || layer.opacity <= 0.001 || !layer.points || layer.points.length < 3) return;
      const prog = progs.get(layer.shaderId) || progs.get('rain');
      if (!prog) return;
      gl.useProgram(prog);
      gl.blendFunc(layer.blendMode === 'add' ? gl.SRC_ALPHA : gl.SRC_ALPHA, layer.blendMode === 'add' ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);

      const pts = layer.points;
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      pts.forEach(p => { if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; });
      const avgDim = ((maxX-minX) + (maxY-minY)) * 0.5 || 1;

      const pos = [], uv = [];
      if (pts.length === 4) {
        const sub = Math.max(1, Math.min(8, Number(layer.meshSubdiv) || 1));
        const gp = (gx, gy) => {
          const u = gx/sub, v = gy/sub;
          const top = { x: pts[0].x+(pts[1].x-pts[0].x)*u, y: pts[0].y+(pts[1].y-pts[0].y)*u };

      let lastBroadcastTime = 0;
      function syncLiveProjector(force = false) {
        const now = performance.now();
        if (!force && now - lastBroadcastTime < 32) return;
        lastBroadcastTime = now;

        const payload = {
          width: state.width,
          height: state.height,
          layers: getRenderedLayers(),
          showGrid: ui.showGrid
        };

        if (syncChannel) {

      /* =========================================================================
         6. SHOW TIMELINE INTERPOLATION & PERSISTENCE
      ========================================================================= */
      function lerp(a, b, t) { return a + (b - a) * t; }

      function lerpHexColor(hexA, hexB, t) {
        const a = parseInt((hexA || '#000000').replace('#', ''), 16) || 0;
        const b = parseInt((hexB || '#000000').replace('#', ''), 16) || 0;
        const r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t));
        const g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
        const bl = Math.round(lerp(a & 255, b & 255, t));
        return '#' + [r, g, bl].map(v => v.toString(16).padStart(2, '0')).join('');
      }

      function getRenderedLayers() {
        if (!ui.transition) return state.layers;
        const { fromLayers, toLayers, elapsed, duration } = ui.transition;
        const rawT = duration <= 0.001 ? 1 : Math.min(1, Math.max(0, elapsed / duration));
        const t = rawT * rawT * (3 - 2 * rawT); // smoothstep

        return toLayers.map(target => {
          const prev = fromLayers.find(f => f.id === target.id);
          if (!prev) {
            const copy = cloneLayerState(target);
            copy.opacity = (target.opacity ?? 1) * t;
            return copy;
          }
          const blended = cloneLayerState(target);
          blended.opacity = lerp(prev.opacity ?? 1, target.opacity ?? 1, t);
          blended.scale = lerp(prev.scale ?? 1, target.scale ?? 1, t);
          blended.intensity = lerp(prev.intensity ?? 1, target.intensity ?? 1, t);
          blended.contentZoom = lerp(prev.contentZoom ?? 1, target.contentZoom ?? 1, t);
          blended.contentOffsetX = lerp(prev.contentOffsetX ?? 0, target.contentOffsetX ?? 0, t);
          blended.contentOffsetY = lerp(prev.contentOffsetY ?? 0, target.contentOffsetY ?? 0, t);
          blended.c1 = lerpHexColor(prev.c1, target.c1, t);
          blended.c2 = lerpHexColor(prev.c2, target.c2, t);
          blended.c3 = lerpHexColor(prev.c3, target.c3, t);
          if (prev.points.length === target.points.length) {
            blended.points = target.points.map((pt, i) => ({
              x: lerp(prev.points[i].x, pt.x, t),
              y: lerp(prev.points[i].y, pt.y, t)
            }));
          }
          return blended;
        });
      }

      function triggerCue(index, smooth = true) {
        if (!state.cues.length) return;
        const idx = ((index % state.cues.length) + state.cues.length) % state.cues.length;
        const cue = state.cues[idx];
        const prevLayers = getRenderedLayers().map(cloneLayerState);
        state.activeCueIndex = idx;
        ui.cueElapsed = 0;

        if (smooth && cue.fade > 0.05) {
          ui.transition = {
            fromLayers: prevLayers,
            toLayers: cue.layers.map(cloneLayerState),
            elapsed: 0,
            duration: cue.fade
          };
        } else {
          ui.transition = null;
        }
        state.layers = cue.layers.map(cloneLayerState);
        if (!state.layers.some(l => l.id === state.selectedLayerId)) {

        }
        renderLayerList();
        renderInspector();
        renderTimeline();
        syncLiveProjector(true);

      function saveActiveProject() {
