        document.getElementById('btn-zoom-in').onclick = function () { ui.zoomManual = true; ui.zoom = Math.min(3.5, ui.zoom * 1.15); resizeCanvas(); };
        document.getElementById('btn-zoom-out').onclick = function () { ui.zoomManual = true; ui.zoom = Math.max(0.15, ui.zoom / 1.15); resizeCanvas(); };
        document.getElementById('btn-zoom-fit').onclick = function () { ui.zoomManual = false; resizeCanvas(); };
        document.getElementById('btn-projector').onclick = openProjectorWindow;

        document.getElementById('btn-mob-left').onclick = function () {
          document.getElementById('left-panel').classList.toggle('open');
          document.getElementById('right-panel').classList.remove('open');
        };
        document.getElementById('btn-mob-right').onclick = function () {
          document.getElementById('right-panel').classList.toggle('open');
          document.getElementById('left-panel').classList.remove('open');
        };

        /* Reference Photo Overlay */
        const refImg = document.getElementById('ref-photo-img');
        const refCtrl = document.getElementById('ref-controls');
        document.getElementById('btn-ref-upload').onclick = function () { document.getElementById('file-ref').click(); };
        document.getElementById('file-ref').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          refImg.src = URL.createObjectURL(f);
          refImg.style.display = 'block';
          refCtrl.style.display = 'flex';
          showToast('Stage reference photo loaded');
          e.target.value = '';
        });
        document.getElementById('ref-opacity').addEventListener('input', function (e) {
          refImg.style.opacity = e.target.value;
        });
        document.getElementById('btn-ref-clear').onclick = function () {
          refImg.src = '';
          refImg.style.display = 'none';
          refCtrl.style.display = 'none';
        };

        function loadMediaFileIntoSelected(file) {
          if (!file || (!file.type.startsWith('video/') && !file.type.startsWith('image/'))) return;
          let sel = getSelectedLayer();
          if (!sel) {
            sel = createLayer('quad', file.name.replace(/\.[^.]+$/, ''));
            state.layers.push(sel);
            state.selectedLayerId = sel.id;
          }
          const reader = new FileReader();
          reader.onload = function () {
            pushHistory();
            sel.kind = 'surface';
            sel.sourceType = 'media';
            sel.mediaType = file.type.startsWith('video/') ? 'video' : 'image';
            sel.mediaName = file.name;
            sel.mediaDataUrl = String(reader.result || '');
            mediaCache.delete(sel.id);
            renderLayers();
            renderInspector();
            saveProjectState();
            syncProjector(true);
            showToast('Loaded ' + file.name);
          };
          reader.readAsDataURL(file);
        }

        document.getElementById('file-media').addEventListener('change', function (e) {
          if (e.target.files && e.target.files[0]) loadMediaFileIntoSelected(e.target.files[0]);
          e.target.value = '';
        });

        ['dragover', 'drop'].forEach(function (evName) {
          document.body.addEventListener(evName, function (e) {
            e.preventDefault();
            if (evName === 'drop' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
              loadMediaFileIntoSelected(e.dataTransfer.files[0]);
            }
          });
        });

        function togglePlay() {
          ui.isPlaying = !ui.isPlaying;
          document.getElementById('lbl-play').textContent = ui.isPlaying ? 'Pause' : 'Play Show';
        }
        document.getElementById('btn-play').onclick = togglePlay;
        document.getElementById('btn-prev-cue').onclick = function () { activateCue(state.activeCueIndex - 1, true); };
        document.getElementById('btn-next-cue').onclick = function () { activateCue(state.activeCueIndex + 1, true); };
        document.getElementById('btn-seq-mode').onclick = function () {
          ui.autoAdvance = !ui.autoAdvance;
          document.getElementById('btn-seq-mode').textContent = ui.autoAdvance ? 'Auto-Advance' : 'Manual Hold';
        };
        document.getElementById('btn-loop').onclick = function () {
          ui.loopShow = !ui.loopShow;
          const b = document.getElementById('btn-loop');
          b.textContent = 'Loop: ' + (ui.loopShow ? 'On' : 'Off');
          b.classList.toggle('active', ui.loopShow);
        };
        document.getElementById('btn-capture-cue').onclick = function () {
          pushHistory();
          const c = {
            id: uid('cue'),
            name: 'Cue ' + (state.cues.length + 1),
            duration: 10,
            fade: 1.5,
            layers: state.layers.map(cloneObj)
          };
          state.cues.push(c);
          state.activeCueIndex = state.cues.length - 1;
          ui.cueElapsed = 0;
          renderTimeline();
          saveProjectState();
          showToast('Captured ' + c.name);
        };
        document.getElementById('btn-update-cue').onclick = function () {
          const c = state.cues[state.activeCueIndex];
          if (!c) return;
          pushHistory();
          c.layers = state.layers.map(cloneObj);
          renderTimeline();
          saveProjectState();
          showToast('Updated ' + c.name);
        };

        function loadSavedList() {
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }
        function renderProjectsModal() {
          document.getElementById('inp-proj-name').value = state.projectName || 'Thesis Show';
          const box = document.getElementById('proj-list');
          const list = loadSavedList();
          if (!list.length) {
            box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">No saved local projects yet.</div>';
            return;
          }
          box.innerHTML = '';
          list.forEach(function (p, idx) {
            const row = document.createElement('div');
            row.className = 'layer-row';
            row.style.background = 'var(--bg-control)';
            row.innerHTML = '<span class="layer-title">' + (p.projectName || 'Untitled') + '</span><span class="mono" style="color:var(--text-muted);">' + p.width + '×' + p.height + '</span><button class="btn btn-sm primary" data-ld="' + idx + '">Load</button><button class="btn btn-sm danger" data-rm="' + idx + '">✕</button>';
            row.querySelector('[data-ld]').onclick = function () {
              pushHistory();
              state = cloneObj(p);
              ui.transition = null;
              ui.cueElapsed = 0;
              fullUIRefresh();
              saveProjectState();
              document.getElementById('projects-modal').classList.remove('open');
              showToast('Loaded ' + state.projectName);
            };
            row.querySelector('[data-rm]').onclick = function () {
              list.splice(idx, 1);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
              renderProjectsModal();
            };
            box.appendChild(row);
          });
        }

        document.getElementById('btn-projects').onclick = function () {
          renderProjectsModal();
          document.getElementById('projects-modal').classList.add('open');
        };
        document.getElementById('btn-close-projects').onclick = function () {
          document.getElementById('projects-modal').classList.remove('open');
        };
        document.getElementById('btn-save-proj').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'Thesis Show';
          const list = loadSavedList();
          const idx = list.findIndex(function (p) { return p.projectName === state.projectName; });
          if (idx >= 0) list[idx] = cloneObj(state);
          else list.unshift(cloneObj(state));
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            saveProjectState();
            renderProjectsModal();
            showToast('Saved "' + state.projectName + '"');
          } catch (err) {
            showToast('Project too large for browser storage — use Export .pmap');
          }
        };
        document.getElementById('btn-new-proj').onclick = function () {
          pushHistory();
          const q = createLayer('quad', 'Main Surface');
          state = {
            projectName: 'New Projection Show',
            width: 1920,
            height: 1080,
            layers: [q],
            selectedLayerId: q.id,
            cues: [{ id: uid('cue'), name: 'Cue 1', duration: 10, fade: 1.0, layers: [cloneObj(q)] }],
            activeCueIndex: 0
          };
          fullUIRefresh();
          saveProjectState();
          document.getElementById('projects-modal').classList.remove('open');
          showToast('Started new blank show');
        };
        document.getElementById('btn-export-pmap').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'maptor_show';
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.pmap';
          a.click();
          showToast('Exported .pmap file');
        };
        document.getElementById('btn-import-pmap').onclick = function () { document.getElementById('file-pmap').click(); };
        document.getElementById('file-pmap').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = function () {
            try {
              const p = JSON.parse(String(r.result || '{}'));
              if (p && Array.isArray(p.layers)) {
                pushHistory();
                state = p;
                ui.transition = null;
                fullUIRefresh();
                saveProjectState();
                document.getElementById('projects-modal').classList.remove('open');
                showToast('Imported .pmap show');
              }
            } catch (err) { showToast('Invalid .pmap file'); }
          };
          r.readAsText(f);
          e.target.value = '';
        });
        document.getElementById('btn-export-png').onclick = function () {
          renderer.render(state.width, state.height, getActiveLayers(), ui.clockSec);
          const a = document.createElement('a');
          a.href = glCanvas.toDataURL('image/png');
          a.download = (state.projectName || 'maptor').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.png';
          a.click();
          showToast('Exported PNG snapshot');
        };

        window.addEventListener('keydown', function (e) {
          const tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
          }
          if (e.code === 'Space') {
            e.preventDefault();
            if (!ui.autoAdvance && ui.isPlaying) activateCue(state.activeCueIndex + 1, true);
            else togglePlay();
          } else if (e.key.toLowerCase() === 'n') {
            activateCue(state.activeCueIndex + 1, true);
          } else if (e.key.toLowerCase() === 'v') {
            setTool('box');
          } else if (e.key.toLowerCase() === 'w') {
            setTool('warp');
          } else if (e.key.toLowerCase() === 'p') {
            setTool('pen');
          } else if (e.key.toLowerCase() === 'x') {
            document.getElementById('btn-xray').click();
          } else if (e.key.toLowerCase() === 's') {
            document.getElementById('pop-snap').click();
          } else if (e.key.toLowerCase() === 'g') {
            document.getElementById('pop-grid').click();
          } else if (e.key === 'Enter' && ui.tool === 'pen') {
            commitPenPolygon();
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            if (ui.tool === 'pen' && ui.penPoints.length) {
              ui.penPoints.pop();
              return;
            }
            const sel = getSelectedLayer();
            if (sel && !sel.locked) {
              e.preventDefault();
              pushHistory();
              if (ui.tool === 'warp' && ui.activeVertex >= 0 && sel.points.length > 3) {
                sel.points.splice(ui.activeVertex, 1);
                sel.meshSubdiv = 1;
                sel.meshOffsets = [];
                ui.activeVertex = -1;
                renderInspector();
                saveProjectState();
                showToast('Removed vertex', true);
              } else {
                const idx = state.layers.findIndex(function (l) { return l.id === sel.id; });
                if (idx !== -1) {
                  state.layers.splice(idx, 1);
                  state.selectedLayerId = state.layers.length ? state.layers[Math.min(idx, state.layers.length - 1)].id : null;
                  ui.activeVertex = -1;
                  renderLayers();
                  renderInspector();
                  saveProjectState();
                  showToast('Deleted "' + sel.name + '"', true);
                }
              }
            }
          } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) {
            const sel = getSelectedLayer();
            if (sel && !sel.locked) {
              e.preventDefault();
              const step = e.shiftKey ? 10 : 1;
              const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
              const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
              sel.points = sel.points.map(function (p) { return { x: p.x + dx, y: p.y + dy }; });
              renderInspector();
              saveProjectState();
            }
          }
        });

        function tick(now) {
          requestAnimationFrame(tick);
          if (ui.ecoMode && now - ui.lastFrameRender < 31) return;
          ui.lastFrameRender = now;

          const dt = Math.min(0.1, (now - ui.lastTime) * 0.001);
          ui.lastTime = now;
          ui.clockSec += dt;

          if (ui.transition) {
            ui.transition.elapsed += dt;
            ui.projectorDirty = true;
            if (ui.transition.elapsed >= ui.transition.duration) ui.transition = null;
          }

          if (ui.isPlaying && state.cues.length > 0) {
            const cur = state.cues[state.activeCueIndex];
            ui.cueElapsed += dt;
            if (cur && ui.cueElapsed >= cur.duration) {
              if (ui.autoAdvance) {
                const next = state.activeCueIndex + 1;
                if (next < state.cues.length) activateCue(next, true);
                else if (ui.loopShow) activateCue(0, true);
                else {
                  ui.cueElapsed = cur.duration;
                  ui.isPlaying = false;
                  document.getElementById('lbl-play').textContent = 'Play Show';
                }
              } else {
                ui.cueElapsed = cur.duration;
              }
            }
            updateClockDisplay();
          }

          const activeLayers = getActiveLayers();
          renderer.render(state.width, state.height, activeLayers, ui.clockSec);
          drawOverlay();
          syncProjector(false);
        }

        fullUIRefresh();
        syncProjector(true);
        requestAnimationFrame(tick);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
