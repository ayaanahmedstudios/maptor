      /* =========================================================================
         7. STAGE VIEWPORT FIT, BOX TRANSFORM, WARP, AND PEN INTERACTION
      ========================================================================= */
      const stageWrap = document.getElementById('stage-wrap');
      const stageViewport = document.getElementById('stage-viewport');
      const glCanvas = document.getElementById('gl-canvas');
      const overlayCanvas = document.getElementById('overlay-canvas');
      const overlayCtx = overlayCanvas.getContext('2d');
      const renderer = createProjectionRenderer(glCanvas);

      function updateStageLayout() {
        const rect = stageWrap.getBoundingClientRect();
        const pad = 44;
        const availW = Math.max(120, rect.width - pad);
        const availH = Math.max(120, rect.height - pad);
        const fitScale = Math.min(availW / state.width, availH / state.height);
        if (!ui.zoomManual) ui.zoom = fitScale;

        const dispW = Math.round(state.width * ui.zoom);
        const dispH = Math.round(state.height * ui.zoom);
        stageViewport.style.width = `${dispW}px`;
        stageViewport.style.height = `${dispH}px`;
        overlayCanvas.width = state.width;
        overlayCanvas.height = state.height;

        document.getElementById('hud-res').textContent = `${state.width}×${state.height}`;
        document.getElementById('hud-zoom').textContent = `${Math.round((ui.zoom / fitScale) * 100)}%`;
      }

      function screenToStage(clientX, clientY) {
        const r = stageViewport.getBoundingClientRect();
        return {
          x: ((clientX - r.left) / Math.max(1, r.width)) * state.width,
          y: ((clientY - r.top) / Math.max(1, r.height)) * state.height
        };
      }

      function getSelectedLayer() {
        return state.layers.find(l => l.id === state.selectedLayerId) || null;
      }

      function getLayerBounds(layer) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        layer.points.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        });
        return {
          minX, minY, maxX, maxY,
          w: Math.max(1, maxX - minX),
          h: Math.max(1, maxY - minY),
          cx: (minX + maxX) * 0.5,
          cy: (minY + maxY) * 0.5
        };
      }

      function pointInPolygon(pt, vs) {
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
          const xi = vs[i].x, yi = vs[i].y;
          const xj = vs[j].x, yj = vs[j].y;
          const intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-6) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      // Delta-based magnetic snap (zero cumulative drift)
      function applyDeltaSnap(basePoints, rawDx, rawDy, layerId) {
        if (!ui.snap) return { dx: rawDx, dy: rawDy, guides: [] };
        const thresh = 10;
        const gridStep = 40;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        basePoints.forEach(p => {
          const nx = p.x + rawDx, ny = p.y + rawDy;
          if (nx < minX) minX = nx;
          if (ny < minY) minY = ny;
          if (nx > maxX) maxX = nx;
          if (ny > maxY) maxY = ny;
        });
        const cx = (minX + maxX) * 0.5;
        const cy = (minY + maxY) * 0.5;

        const targetsX = [0, state.width * 0.5, state.width, Math.round(minX / gridStep) * gridStep];
        const targetsY = [0, state.height * 0.5, state.height, Math.round(minY / gridStep) * gridStep];
        state.layers.forEach(other => {
          if (other.id === layerId || !other.visible) return;
          const b = getLayerBounds(other);
          targetsX.push(b.minX, b.cx, b.maxX);
          targetsY.push(b.minY, b.cy, b.maxY);
        });

        let bestDx = rawDx, bestDistX = thresh;
        const guides = [];
        [minX, cx, maxX].forEach(cand => {
          targetsX.forEach(tx => {
            const diff = tx - cand;
            if (Math.abs(diff) < bestDistX) {
              bestDistX = Math.abs(diff);
              bestDx = rawDx + diff;
            }
          });
        });
        if (bestDistX < thresh) guides.push({ axis: 'x', pos: minX + (bestDx - rawDx) });

        let bestDy = rawDy, bestDistY = thresh;
        [minY, cy, maxY].forEach(cand => {
          targetsY.forEach(ty => {
            const diff = ty - cand;
            if (Math.abs(diff) < bestDistY) {
              bestDistY = Math.abs(diff);
              bestDy = rawDy + diff;
            }
          });
        });
        if (bestDistY < thresh) guides.push({ axis: 'y', pos: minY + (bestDy - rawDy) });

        return { dx: bestDx, dy: bestDy, guides };
      }

      let activeSnapGuides = [];

      function getBoxHandles(b) {
        return [
          { id: 'nw', x: b.minX, y: b.minY },
          { id: 'n',  x: b.cx,   y: b.minY },
          { id: 'ne', x: b.maxX, y: b.minY },
          { id: 'e',  x: b.maxX, y: b.cy },
          { id: 'se', x: b.maxX, y: b.maxY },
          { id: 's',  x: b.cx,   y: b.maxY },
          { id: 'sw', x: b.minX, y: b.maxY },
          { id: 'w',  x: b.minX, y: b.cy },
          { id: 'rot', x: b.cx,  y: b.minY - 34 }
        ];
      }

      function distToSegment(p, v, w) {
        const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
      }

      overlayCanvas.addEventListener('pointerdown', (e) => {
        const pt = screenToStage(e.clientX, e.clientY);
        const hitR = 16 / Math.max(0.35, ui.zoom);

        // Pen tool mode
        if (ui.tool === 'pen') {
          if (ui.penPoints.length >= 3 && Math.hypot(pt.x - ui.penPoints[0].x, pt.y - ui.penPoints[0].y) < hitR * 1.4) {
            finishPenPolygon();
            return;
          }
          ui.penPoints.push({ x: Math.round(pt.x), y: Math.round(pt.y) });
          return;
        }

        const sel = getSelectedLayer();
        if (sel && !sel.locked && sel.visible) {
          if (ui.tool === 'box') {
            const b = getLayerBounds(sel);
            const handles = getBoxHandles(b);
            for (const h of handles) {
              if (Math.hypot(pt.x - h.x, pt.y - h.y) <= hitR) {
                overlayCanvas.setPointerCapture(e.pointerId);
                ui.dragging = {
                  mode: h.id === 'rot' ? 'rotate' : 'resize',
                  handle: h.id,
                  startPt: pt,
                  origPoints: sel.points.map(p => ({ ...p })),
                  origBounds: b
                };
                return;
              }
            }
          } else if (ui.tool === 'warp') {
            // Check mesh subdivision nodes first
            const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
            if (sel.points.length === 4 && sub > 1) {
              const pts = sel.points;
              for (let gy = 0; gy <= sub; gy++) {
                for (let gx = 0; gx <= sub; gx++) {
                  if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                  const u = gx / sub, v = gy / sub;
                  const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                  const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                  const idx = gy * (sub + 1) + gx;
                  if (!sel.meshOffsets) sel.meshOffsets = [];
                  if (!sel.meshOffsets[idx]) sel.meshOffsets[idx] = { x: 0, y: 0 };
                  const mx = top.x + (bot.x - top.x) * v + sel.meshOffsets[idx].x;
                  const my = top.y + (bot.y - top.y) * v + sel.meshOffsets[idx].y;
                  if (Math.hypot(pt.x - mx, pt.y - my) <= hitR) {
                    overlayCanvas.setPointerCapture(e.pointerId);
                    ui.dragging = {
                      mode: 'mesh',
                      meshIdx: idx,
                      startPt: pt,
                      origOffset: { ...sel.meshOffsets[idx] }

            }

            for (let i = 0; i < sel.points.length; i++) {

                  vIdx: i,

                  origPt: { ...sel.points[i] }

            renderInspector();
            if (!l.locked) {
              overlayCanvas.setPointerCapture(e.pointerId);
              ui.dragging = {
                mode: 'move',
                startPt: pt,
                origPoints: l.points.map(p => ({ ...p }))
              };
            }
            return;
          }
        }

        state.selectedLayerId = null;
        renderLayerList();
        renderInspector();
      });

      overlayCanvas.addEventListener('pointermove', (e) => {
        if (!ui.dragging) return;
        const sel = getSelectedLayer();
        if (!sel) return;
        const pt = screenToStage(e.clientX, e.clientY);
        const dx = pt.x - ui.dragging.startPt.x;
        const dy = pt.y - ui.dragging.startPt.y;
        activeSnapGuides = [];

        if (ui.dragging.mode === 'move') {
          const snapped = applyDeltaSnap(ui.dragging.origPoints, dx, dy, sel.id);
          activeSnapGuides = snapped.guides;
          sel.points = ui.dragging.origPoints.map(p => ({
            x: Math.round(p.x + snapped.dx),
            y: Math.round(p.y + snapped.dy)
          }));
        } else if (ui.dragging.mode === 'vertex') {
          let nx = ui.dragging.origPt.x + dx;
          let ny = ui.dragging.origPt.y + dy;
          if (ui.snap) {
            const snapped = applyDeltaSnap([ui.dragging.origPt], dx, dy, sel.id);
            nx = ui.dragging.origPt.x + snapped.dx;
            ny = ui.dragging.origPt.y + snapped.dy;
            activeSnapGuides = snapped.guides;
          }
          sel.points[ui.dragging.vIdx] = { x: Math.round(nx), y: Math.round(ny) };
        } else if (ui.dragging.mode === 'mesh') {
          sel.meshOffsets[ui.dragging.meshIdx] = {
            x: Math.round(ui.dragging.origOffset.x + dx),
            y: Math.round(ui.dragging.origOffset.y + dy)
          };
        } else if (ui.dragging.mode === 'rotate') {
          const b = ui.dragging.origBounds;
          const a0 = Math.atan2(ui.dragging.startPt.y - b.cy, ui.dragging.startPt.x - b.cx);
          const a1 = Math.atan2(pt.y - b.cy, pt.x - b.cx);
          let da = a1 - a0;

          });
        } else if (ui.dragging.mode === 'resize') {
          const b = ui.dragging.origBounds;
          const h = ui.dragging.handle;
          let nMinX = b.minX, nMaxX = b.maxX, nMinY = b.minY, nMaxY = b.maxY;
          if (h.includes('w')) nMinX = Math.min(b.maxX - 16, b.minX + dx);
          if (h.includes('e')) nMaxX = Math.max(b.minX + 16, b.maxX + dx);
          if (h.includes('n')) nMinY = Math.min(b.maxY - 16, b.minY + dy);
          if (h.includes('s')) nMaxY = Math.max(b.minY + 16, b.maxY + dy);

          if (e.altKey) {
            const dMinX = nMinX - b.minX, dMaxX = nMaxX - b.maxX;
            const dMinY = nMinY - b.minY, dMaxY = nMaxY - b.maxY;
            nMinX = b.minX + dMinX - dMaxX;
            nMaxX = b.maxX + dMaxX - dMinX;
            nMinY = b.minY + dMinY - dMaxY;
            nMaxY = b.maxY + dMaxY - dMinY;
          }
          if (e.shiftKey) {
            const asp = b.w / b.h;
            const curW = nMaxX - nMinX, curH = nMaxY - nMinY;
            if (curW / curH > asp) {
              const targetW = curH * asp;
              if (h.includes('w')) nMinX = nMaxX - targetW; else nMaxX = nMinX + targetW;
            } else {
              const targetH = curW / asp;
              if (h.includes('n')) nMinY = nMaxY - targetH; else nMaxY = nMinY + targetH;
            }
          }

          sel.points = ui.dragging.origPoints.map(p => {
            const ux = (p.x - b.minX) / b.w;
            const uy = (p.y - b.minY) / b.h;
            return {
              x: Math.round(nMinX + ux * (nMaxX - nMinX)),
              y: Math.round(nMinY + uy * (nMaxY - nMinY))
            };
          });
        }

        syncLiveProjector(false);
      });

      overlayCanvas.addEventListener('pointerup', () => {
        if (ui.dragging) {
          ui.dragging = null;
          activeSnapGuides = [];
          renderInspector();
          saveActiveProject();
        }
      });

      // Double-click edge in Warp mode to insert a new polygon vertex
      overlayCanvas.addEventListener('dblclick', (e) => {
        if (ui.tool === 'pen') {
          finishPenPolygon();
          return;
        }
        if (ui.tool !== 'warp') return;
        const sel = getSelectedLayer();
        if (!sel || sel.locked || sel.isEllipse) return;
        const pt = screenToStage(e.clientX, e.clientY);
        const hitR = 16 / Math.max(0.35, ui.zoom);
        for (let i = 0; i < sel.points.length; i++) {
          const a = sel.points[i];
          const b = sel.points[(i + 1) % sel.points.length];
          if (distToSegment(pt, a, b) <= hitR) {
            sel.points.splice(i + 1, 0, { x: Math.round(pt.x), y: Math.round(pt.y) });
            sel.meshSubdiv = 1;
            sel.meshOffsets = [];
            renderInspector();
            saveActiveProject();
            showToast('Vertex added to surface');
            return;
          }
        }
      });

      // Right-click vertex in Warp mode to remove polygon vertex
      overlayCanvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (ui.tool !== 'warp') return;
        const sel = getSelectedLayer();
        if (!sel || sel.locked || sel.points.length <= 3) return;
        const pt = screenToStage(e.clientX, e.clientY);
        const hitR = 16 / Math.max(0.35, ui.zoom);
        for (let i = 0; i < sel.points.length; i++) {
          if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
            sel.points.splice(i, 1);
            sel.meshSubdiv = 1;
            sel.meshOffsets = [];
            renderInspector();
            saveActiveProject();
            showToast('Vertex removed');
            return;
          }
        }
      });

      function finishPenPolygon() {
        if (ui.penPoints.length >= 3) {
          const layer = createDefaultLayer('polygon', 'Custom Polygon', ui.penPoints);
          state.layers.push(layer);
          state.selectedLayerId = layer.id;
          showToast('Polygon created');
        }
        ui.penPoints = [];
        setTool('warp');
        renderLayerList();
        renderInspector();
        saveActiveProject();
      }

      /* =========================================================================
         8. 2D STAGE OVERLAY RENDERER (HANDLES, GUIDES, GRID, PEN PREVIEW)
      ========================================================================= */
      function drawStageOverlay() {
        const W = state.width, H = state.height;
        overlayCtx.clearRect(0, 0, W, H);
        const invZ = 1 / Math.max(0.25, ui.zoom);

        // Calibration Test Grid
        if (ui.showGrid) {
          overlayCtx.save();
          overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          overlayCtx.lineWidth = 1.5 * invZ;
          const step = 120;
          for (let x = 0; x <= W; x += step) {
            overlayCtx.beginPath(); overlayCtx.moveTo(x, 0); overlayCtx.lineTo(x, H); overlayCtx.stroke();
          }
          for (let y = 0; y <= H; y += step) {
            overlayCtx.beginPath(); overlayCtx.moveTo(0, y); overlayCtx.lineTo(W, y); overlayCtx.stroke();
          }
          overlayCtx.strokeStyle = '#6366f1';
          overlayCtx.lineWidth = 2.5 * invZ;
          overlayCtx.beginPath();
          overlayCtx.moveTo(W * 0.5, 0); overlayCtx.lineTo(W * 0.5, H);
          overlayCtx.moveTo(0, H * 0.5); overlayCtx.lineTo(W, H * 0.5);
          overlayCtx.stroke();
          overlayCtx.beginPath();
          overlayCtx.arc(W * 0.5, H * 0.5, Math.min(W, H) * 0.35, 0, Math.PI * 2);
          overlayCtx.stroke();
          overlayCtx.restore();
        }

        // Magnetic Snap Guides
        activeSnapGuides.forEach(g => {
          overlayCtx.save();
          overlayCtx.strokeStyle = '#f43f5e';
          overlayCtx.lineWidth = 1.5 * invZ;
          overlayCtx.setLineDash([6 * invZ, 4 * invZ]);
          overlayCtx.beginPath();
          if (g.axis === 'x') { overlayCtx.moveTo(g.pos, 0); overlayCtx.lineTo(g.pos, H); }
          else { overlayCtx.moveTo(0, g.pos); overlayCtx.lineTo(W, g.pos); }
          overlayCtx.stroke();
          overlayCtx.restore();
        });

        // Subtle outlines for unselected layers
        state.layers.forEach(l => {
          if (!l.visible || l.id === state.selectedLayerId) return;
          overlayCtx.save();
          overlayCtx.strokeStyle = l.kind === 'mask' ? 'rgba(239, 68, 68, 0.35)' : 'rgba(255, 255, 255, 0.16)';
          overlayCtx.lineWidth = 1.2 * invZ;
          overlayCtx.beginPath();
          l.points.forEach((p, idx) => idx === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y));
          overlayCtx.closePath();
          overlayCtx.stroke();
          overlayCtx.restore();
        });

        // Active Selection Handles
        const sel = getSelectedLayer();
        if (sel && sel.visible) {
          const strokeCol = sel.kind === 'mask' ? '#ef4444' : '#6366f1';
          overlayCtx.save();
          overlayCtx.strokeStyle = strokeCol;
          overlayCtx.lineWidth = 2 * invZ;

          // Surface perimeter
          overlayCtx.beginPath();
          sel.points.forEach((p, idx) => idx === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y));
          overlayCtx.closePath();
          overlayCtx.stroke();

          if (!sel.locked) {
            if (ui.tool === 'box') {
              const b = getLayerBounds(sel);
              overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.85)';
              overlayCtx.setLineDash([5 * invZ, 4 * invZ]);
              overlayCtx.strokeRect(b.minX, b.minY, b.w, b.h);
              overlayCtx.setLineDash([]);

              // Rotation stem
              overlayCtx.beginPath();
              overlayCtx.moveTo(b.cx, b.minY);
              overlayCtx.lineTo(b.cx, b.minY - 34);
              overlayCtx.stroke();

              const handles = getBoxHandles(b);
              const hs = 5.5 * invZ;
              handles.forEach(h => {
                overlayCtx.fillStyle = '#ffffff';
                overlayCtx.strokeStyle = strokeCol;
                overlayCtx.lineWidth = 2 * invZ;
                overlayCtx.beginPath();
                if (h.id === 'rot') {
                  overlayCtx.arc(h.x, h.y, hs * 1.15, 0, Math.PI * 2);
                } else {
                  overlayCtx.rect(h.x - hs, h.y - hs, hs * 2, hs * 2);
                }
                overlayCtx.fill();
                overlayCtx.stroke();
              });
            } else if (ui.tool === 'warp') {
              // Draw Mesh Grid if subdivided
              const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
              if (sel.points.length === 4 && sub > 1) {
                const pts = sel.points;
                const gp = (gx, gy) => {
                  const u = gx / sub, v = gy / sub;
                  const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                  const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                  const off = (sel.meshOffsets || [])[gy * (sub + 1) + gx] || { x: 0, y: 0 };
                  return { x: top.x + (bot.x - top.x) * v + off.x, y: top.y + (bot.y - top.y) * v + off.y };
                };
                overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
                overlayCtx.lineWidth = 1.2 * invZ;
                for (let gy = 0; gy <= sub; gy++) {
                  overlayCtx.beginPath();
                  for (let gx = 0; gx <= sub; gx++) {
                    const p = gp(gx, gy);
                    gx === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y);
                  }
                  overlayCtx.stroke();
                }
                for (let gx = 0; gx <= sub; gx++) {
                  overlayCtx.beginPath();
                  for (let gy = 0; gy <= sub; gy++) {
                    const p = gp(gx, gy);
                    gy === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y);
                  }
                  overlayCtx.stroke();
                }
                // Interior mesh handles
                for (let gy = 0; gy <= sub; gy++) {
                  for (let gx = 0; gx <= sub; gx++) {
                    if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                    const p = gp(gx, gy);
                    overlayCtx.fillStyle = '#818cf8';
                    overlayCtx.beginPath();
                    overlayCtx.arc(p.x, p.y, 4 * invZ, 0, Math.PI * 2);
                    overlayCtx.fill();
                  }
                }
              }

              // Primary corner pins
              sel.points.forEach((p, idx) => {
                const r = 7 * invZ;
                overlayCtx.fillStyle = idx === ui.selectedVertex ? '#f59e0b' : '#ffffff';
                overlayCtx.strokeStyle = strokeCol;
                overlayCtx.lineWidth = 2.4 * invZ;
                overlayCtx.beginPath();
                overlayCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                overlayCtx.fill();
                overlayCtx.stroke();

                overlayCtx.fillStyle = '#ffffff';
                overlayCtx.font = `600 ${Math.round(11 * invZ)}px sans-serif`;
                overlayCtx.fillText(`P${idx + 1}`, p.x + 10 * invZ, p.y - 8 * invZ);
              });
            }
          }
          overlayCtx.restore();
        }

        // Pen Tool In-Progress Preview
        if (ui.tool === 'pen' && ui.penPoints.length > 0) {
          overlayCtx.save();
          overlayCtx.strokeStyle = '#10b981';
          overlayCtx.lineWidth = 2 * invZ;
          overlayCtx.beginPath();
          ui.penPoints.forEach((p, idx) => idx === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y));
          overlayCtx.stroke();
          ui.penPoints.forEach((p, idx) => {
            overlayCtx.fillStyle = idx === 0 ? '#10b981' : '#ffffff';
            overlayCtx.beginPath();
            overlayCtx.arc(p.x, p.y, 6 * invZ, 0, Math.PI * 2);
            overlayCtx.fill();
          });
          overlayCtx.restore();
        }
      }

      /* =========================================================================
         9. UI RENDERERS: LEFT LAYERS, RIGHT INSPECTOR, BOTTOM TIMELINE
      ========================================================================= */
      function renderLayerList() {
        const list = document.getElementById('layer-list');
        document.getElementById('layer-count').textContent = String(state.layers.length);
        list.innerHTML = '';

        if (!state.layers.length) {
          list.innerHTML = `<div style="padding:18px 8px;text-align:center;color:var(--text-muted);font-size:12px;">No surfaces yet.<br/>Use + Quad, + Circle, or + Mask above.</div>`;
          return;
        }

        // Render top-to-bottom (last in array is topmost)
        for (let i = state.layers.length - 1; i >= 0; i--) {
          const l = state.layers[i];
          const el = document.createElement('div');
          el.className = 'layer-item' + (l.id === state.selectedLayerId ? ' selected' : '');
          el.innerHTML = `
            <span class="layer-badge" style="${l.kind === 'mask' ? 'color:#fca5a5;background:rgba(239,68,68,0.16);' : ''}">${l.kind === 'mask' ? 'Mask' : l.shapeType}</span>
            <span class="layer-name" title="${l.name}">${l.name}</span>
            <div class="layer-actions">
              <button class="btn btn-icon-sm" data-act="up" title="Bring Forward">↑</button>
              <button class="btn btn-icon-sm" data-act="down" title="Send Backward">↓</button>
              <button class="btn btn-icon-sm" data-act="vis" title="Toggle Visibility">${l.visible ? '◉' : '○'}</button>
              <button class="btn btn-icon-sm" data-act="dup" title="Duplicate">⧉</button>
              <button class="btn btn-icon-sm danger" data-act="del" title="Delete">✕</button>
            </div>
          `;
          el.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) {
              state.selectedLayerId = l.id;
              renderLayerList();
              renderInspector();
              return;
            }
            e.stopPropagation();
            const act = btn.dataset.act;
            if (act === 'vis') {
              l.visible = !l.visible;
            } else if (act === 'dup') {
              const copy = cloneLayerState(l);
              copy.id = makeId('lyr');
              copy.name = l.name + ' Copy';
              copy.points = copy.points.map(p => ({ x: p.x + 28, y: p.y + 28 }));
              state.layers.splice(i + 1, 0, copy);
              state.selectedLayerId = copy.id;
            } else if (act === 'del') {
              state.layers.splice(i, 1);
              if (state.selectedLayerId === l.id) {
                state.selectedLayerId = state.layers[state.layers.length - 1]?.id || null;
              }
            } else if (act === 'up' && i < state.layers.length - 1) {
              [state.layers[i], state.layers[i + 1]] = [state.layers[i + 1], state.layers[i]];
            } else if (act === 'down' && i > 0) {
              [state.layers[i], state.layers[i - 1]] = [state.layers[i - 1], state.layers[i]];
            }
            renderLayerList();
            renderInspector();
            saveActiveProject();
          });
          list.appendChild(el);
        }
      }

              <div class="ctrl-row">

                <input type="range" id="insp-fsize" min="24" max="240" step="2" value="${sel.fontSize}" />
                <span class="ctrl-val">${sel.fontSize}px</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Spacing</span>
                <input type="range" id="insp-fspace" min="-4" max="40" step="1" value="${sel.letterSpacing}" />
                <span class="ctrl-val">${sel.letterSpacing}px</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Outline</span>
                <input type="range" id="insp-foutline" min="0" max="16" step="1" value="${sel.textOutline}" />
                <span class="ctrl-val">${sel.textOutline}px</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Text Color</span>
                <input type="color" id="insp-tcolor" value="${sel.textColor}" />
              </div>
            ` : ''}

            <!-- Content Fit & Framing -->
            <div style="border-top:1px solid var(--border-hairline);padding-top:8px;margin-top:8px;">
              <div class="ctrl-row">
                <span class="ctrl-label">Content Fit</span>
                <select id="insp-fit" class="inp" style="width:162px;">
                  <option value="cover" ${sel.fitMode === 'cover' ? 'selected' : ''}>Container Crop (Cover)</option>
                  <option value="contain" ${sel.fitMode === 'contain' ? 'selected' : ''}>Container Fit (Contain)</option>
                  <option value="original" ${sel.fitMode === 'original' ? 'selected' : ''}>Original 1:1 Scale</option>
                  <option value="warp" ${sel.fitMode === 'warp' ? 'selected' : ''}>Perspective Skew (Warp)</option>
                </select>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Zoom</span>
                <input type="range" id="insp-czoom" min="0.1" max="4" step="0.05" value="${sel.contentZoom}" />
                <span class="ctrl-val">${Math.round(sel.contentZoom * 100)}%</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Offset X</span>
                <input type="range" id="insp-cox" min="-100" max="100" step="1" value="${sel.contentOffsetX}" />
                <span class="ctrl-val">${sel.contentOffsetX}%</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Offset Y</span>
                <input type="range" id="insp-coy" min="-100" max="100" step="1" value="${sel.contentOffsetY}" />
                <span class="ctrl-val">${sel.contentOffsetY}%</span>
              </div>
              <div class="ctrl-row">
                <span class="ctrl-label">Rotation</span>
                <input type="range" id="insp-crot" min="-180" max="180" step="1" value="${sel.contentRot}" />
                <span class="ctrl-val">${sel.contentRot}°</span>
              </div>
            </div>
          </div>
          ` : ''}

          <!-- Architectural Window & Mask Customizer -->
          <div class="sec-card">
            <div class="sec-title">
              <span>Window & Mask Geometry</span>
              <button class="btn btn-sm ${sel.winInvert ? 'active' : ''}" id="insp-win-invert" title="Project onto bars/frame instead of glass panes">Invert Mask</button>
            </div>
            <div class="ctrl-row">
              <select id="insp-win-preset" class="inp">
                ${WINDOW_PRESETS.map(p => `<option value="${p.id}" ${sel.winPreset === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
              </select>
            </div>
            <div class="grid-2" style="margin-bottom:8px;">
              <div>
                <span style="font-size:10.5px;color:var(--text-muted);">Arch Style</span>
                <select id="insp-win-arch" class="inp">
                  <option value="flat" ${sel.winArch === 'flat' ? 'selected' : ''}>Flat Top</option>
                  <option value="round" ${sel.winArch === 'round' ? 'selected' : ''}>Round Arch</option>
                  <option value="pointed" ${sel.winArch === 'pointed' ? 'selected' : ''}>Pointed Gothic</option>
                  <option value="triangle" ${sel.winArch === 'triangle' ? 'selected' : ''}>Triangular</option>
                </select>
              </div>
              <div>
                <span style="font-size:10.5px;color:var(--text-muted);">Arch Height</span>
                <input type="number" id="insp-win-archh" class="inp tabular" min="0" max="65" value="${sel.winArchH}" />
              </div>
              <div>
                <span style="font-size:10.5px;color:var(--text-muted);">Columns (1–12)</span>
                <input type="number" id="insp-win-cols" class="inp tabular" min="1" max="12" value="${sel.winCols}" />
              </div>
              <div>
                <span style="font-size:10.5px;color:var(--text-muted);">Rows (1–12)</span>
                <input type="number" id="insp-win-rows" class="inp tabular" min="1" max="12" value="${sel.winRows}" />
              </div>
            </div>
            <div class="ctrl-row">
              <span class="ctrl-label">Bar Width</span>
              <input type="range" id="insp-win-bar" min="0" max="60" step="1" value="${sel.winBar}" />
              <span class="ctrl-val">${sel.winBar}px</span>
            </div>
            <div class="ctrl-row">
              <span class="ctrl-label">Outer Frame</span>
              <input type="range" id="insp-win-frame" min="0" max="100" step="1" value="${sel.winFrame}" />
              <span class="ctrl-val">${sel.winFrame}px</span>
            </div>
            <div class="ctrl-row">
              <span class="ctrl-label">Corner Radius</span>
              <input type="range" id="insp-win-corner" min="0" max="160" step="2" value="${sel.winCorner}" />
              <span class="ctrl-val">${sel.winCorner}px</span>
            </div>
            <div class="ctrl-row">
              <span class="ctrl-label">Edge Feather</span>
              <input type="range" id="insp-win-feather" min="1" max="60" step="1" value="${sel.winFeather}" />
              <span class="ctrl-val">${sel.winFeather}px</span>
            </div>
            <div class="ctrl-row">
              <button class="btn btn-sm ${sel.winLattice ? 'active' : ''}" id="insp-win-lattice" style="width:100%;">Diagonal Leaded Lattice: ${sel.winLattice ? 'On' : 'Off'}</button>
            </div>
          </div>
        `;

        bindInspectorEvents(sel);
      }

      function bindInspectorEvents(sel) {
        const bind = (id, ev, fn) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener(ev, fn);
        };
        const bindSlider = (id, key, fmt, rerender = false) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('input', () => {
            sel[key] = parseFloat(el.value);
            const valEl = el.parentElement.querySelector('.ctrl-val');
            if (valEl) valEl.textContent = fmt(sel[key]);
            if (rerender) renderInspector();
            saveActiveProject();
          });
        };

        bind('insp-lock', 'click', () => {
          sel.locked = !sel.locked;
          renderInspector();
          saveActiveProject();
        });
        bind('insp-name', 'input', (e) => {
          sel.name = e.target.value;
          document.getElementById('inspector-title').textContent = sel.name;
          renderLayerList();
          saveActiveProject();
        });

        // Direct numeric X/Y/W/H
        const updateRectNumeric = () => {
          const b = getLayerBounds(sel);
          const nx = parseFloat(document.getElementById('insp-x').value) || 0;
          const ny = parseFloat(document.getElementById('insp-y').value) || 0;
          const nw = Math.max(12, parseFloat(document.getElementById('insp-w').value) || b.w);
          const nh = Math.max(12, parseFloat(document.getElementById('insp-h').value) || b.h);
          sel.points = sel.points.map(p => ({
            x: Math.round(nx + ((p.x - b.minX) / b.w) * nw),
            y: Math.round(ny + ((p.y - b.minY) / b.h) * nh)
          }));
          saveActiveProject();
        };
        ['insp-x', 'insp-y', 'insp-w', 'insp-h'].forEach(id => bind(id, 'change', updateRectNumeric));

        bindSlider('insp-opacity', 'opacity', v => `${Math.round(v * 100)}%`);
        bind('insp-subdiv', 'change', (e) => {
          sel.meshSubdiv = parseInt(e.target.value, 10) || 1;
          sel.meshOffsets = [];
          saveActiveProject();
        });
        bind('insp-reset-rect', 'click', () => {
          const b = getLayerBounds(sel);
          sel.points = [
            { x: Math.round(b.minX), y: Math.round(b.minY) },
            { x: Math.round(b.maxX), y: Math.round(b.minY) },
            { x: Math.round(b.maxX), y: Math.round(b.maxY) },
            { x: Math.round(b.minX), y: Math.round(b.maxY) }
          ];
          sel.meshOffsets = [];
          renderInspector();
          saveActiveProject();
        });
        bind('insp-center-stage', 'click', () => {
          const b = getLayerBounds(sel);
          const dx = state.width * 0.5 - b.cx;
          const dy = state.height * 0.5 - b.cy;
          sel.points = sel.points.map(p => ({ x: Math.round(p.x + dx), y: Math.round(p.y + dy) }));
          renderInspector();
          saveActiveProject();
        });

        bind('insp-blend', 'change', (e) => { sel.blendMode = e.target.value; saveActiveProject(); });
        document.querySelectorAll('[data-src]').forEach(btn => {
          btn.addEventListener('click', () => {
            sel.sourceType = btn.dataset.src;
            renderInspector();
            saveActiveProject();
          });
        });

        // Shader controls
        bind('insp-shader', 'change', (e) => {
          sel.shaderId = e.target.value;
          const preset = SHADERS.find(s => s.id === sel.shaderId);
          if (preset) {
            sel.c1 = preset.c1;
            sel.c2 = preset.c2;
            sel.c3 = preset.c3;
          }
          renderInspector();
          saveActiveProject();
        });
        bind('insp-c1', 'input', (e) => { sel.c1 = e.target.value; saveActiveProject(); });
        bind('insp-c2', 'input', (e) => { sel.c2 = e.target.value; saveActiveProject(); });
        bind('insp-c3', 'input', (e) => { sel.c3 = e.target.value; saveActiveProject(); });
        bindSlider('insp-speed', 'speed', v => `${v.toFixed(2)}×`);
        bindSlider('insp-scale', 'scale', v => v.toFixed(2));
        bindSlider('insp-intensity', 'intensity', v => v.toFixed(2));

        // Media controls
        bind('insp-upload-media', 'click', () => {
          document.getElementById('file-media-upload').click();
        });
        bindSlider('insp-vspeed', 'videoSpeed', v => `${v.toFixed(2)}×`);
        bind('insp-vloop', 'click', () => {
          sel.videoLoop = sel.videoLoop === false ? true : false;
          renderInspector();
          saveActiveProject();
        });
        bind('insp-vrestart', 'click', () => {
          const entry = mediaCache.get(sel.id);
          if (entry && entry.kind === 'video') {
            entry.el.currentTime = 0;
            entry.el.play().catch(() => {});
          }
        });

        // Text controls
        bind('insp-text', 'input', (e) => { sel.text = e.target.value; saveActiveProject(); });
        bind('insp-font', 'change', (e) => {
          sel.fontFamily = e.target.value.trim() || 'Inter';
          loadGoogleFont(sel.fontFamily);
          saveActiveProject();
        });
        bind('insp-fweight', 'change', (e) => { sel.fontWeight = e.target.value; saveActiveProject(); });
        bind('insp-talign', 'change', (e) => { sel.textAlign = e.target.value; saveActiveProject(); });
        bindSlider('insp-fsize', 'fontSize', v => `${v}px`);
        bindSlider('insp-fspace', 'letterSpacing', v => `${v}px`);
        bindSlider('insp-foutline', 'textOutline', v => `${v}px`);
        bind('insp-tcolor', 'input', (e) => { sel.textColor = e.target.value; saveActiveProject(); });

        // Content fit & reframing
        bind('insp-fit', 'change', (e) => { sel.fitMode = e.target.value; saveActiveProject(); });
        bindSlider('insp-czoom', 'contentZoom', v => `${Math.round(v * 100)}%`);
        bindSlider('insp-cox', 'contentOffsetX', v => `${v}%`);
        bindSlider('insp-coy', 'contentOffsetY', v => `${v}%`);
        bindSlider('insp-crot', 'contentRot', v => `${v}°`);

        // Window & Mask controls
        bind('insp-win-invert', 'click', () => {
          sel.winInvert = !sel.winInvert;
          renderInspector();
          saveActiveProject();
        });
        bind('insp-win-preset', 'change', (e) => {
          const p = WINDOW_PRESETS.find(item => item.id === e.target.value);
          if (p) {
            sel.winPreset = p.id;
            sel.winArch = p.arch;
            sel.winArchH = p.archH;
            sel.winCols = p.cols;
            sel.winRows = p.rows;
            sel.winBar = p.bar;
            sel.winFrame = p.frame;
            sel.winLattice = p.lattice;
            sel.winMode = p.mode;
          }
          renderInspector();
          saveActiveProject();
        });
        bind('insp-win-arch', 'change', (e) => { sel.winArch = e.target.value; saveActiveProject(); });
        bind('insp-win-archh', 'input', (e) => { sel.winArchH = Math.max(0, Math.min(65, parseFloat(e.target.value) || 0)); saveActiveProject(); });
        bind('insp-win-cols', 'input', (e) => { sel.winCols = Math.max(1, Math.min(12, parseInt(e.target.value, 10) || 1)); saveActiveProject(); });
        bind('insp-win-rows', 'input', (e) => { sel.winRows = Math.max(1, Math.min(12, parseInt(e.target.value, 10) || 1)); saveActiveProject(); });
        bindSlider('insp-win-bar', 'winBar', v => `${v}px`);
        bindSlider('insp-win-frame', 'winFrame', v => `${v}px`);
        bindSlider('insp-win-corner', 'winCorner', v => `${v}px`);
        bindSlider('insp-win-feather', 'winFeather', v => `${v}px`);
        bind('insp-win-lattice', 'click', () => {
          sel.winLattice = !sel.winLattice;
          renderInspector();
          saveActiveProject();
        });
      }

      function renderTimeline() {
        const track = document.getElementById('cue-track-wrap');
        track.innerHTML = '';

        state.cues.forEach((cue, idx) => {
          const active = idx === state.activeCueIndex;
          const widthPx = Math.max(142, Math.min(340, cue.duration * 16));
          const clip = document.createElement('div');
          clip.className = 'cue-clip' + (active ? ' active' : '');
          clip.style.width = `${widthPx}px`;

          const pct = active ? Math.min(100, (ui.cueElapsed / Math.max(0.1, cue.duration)) * 100) : 0;

          clip.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
              <input type="text" value="${cue.name.replace(/"/g, '&quot;')}" data-cue-name="${idx}" style="background:transparent;border:none;font-size:12px;font-weight:600;width:100%;min-width:0;" />
              <button class="btn btn-icon-sm danger" data-cue-del="${idx}" title="Delete Cue">✕</button>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:11px;color:var(--text-secondary);">
              <label style="display:inline-flex;align-items:center;gap:3px;">
                <span>Dur</span>
                <input type="number" class="tabular" data-cue-dur="${idx}" min="0.5" max="300" step="0.5" value="${cue.duration}" style="width:44px;height:20px;background:var(--bg-control);border:1px solid var(--border-hairline);border-radius:4px;padding:0 4px;font-size:11px;" />s
              </label>
              <label style="display:inline-flex;align-items:center;gap:3px;">
                <span>Fade</span>
                <input type="number" class="tabular" data-cue-fade="${idx}" min="0" max="15" step="0.1" value="${cue.fade}" style="width:42px;height:20px;background:var(--bg-control);border:1px solid var(--border-hairline);border-radius:4px;padding:0 4px;font-size:11px;" />s
              </label>
            </div>
            <div class="cue-progress" style="width:${pct}%;"></div>
          `;

          clip.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.closest('button')) return;
            triggerCue(idx, true);
          });

          const nameInp = clip.querySelector('[data-cue-name]');
          nameInp.addEventListener('input', () => {
            cue.name = nameInp.value;
            saveActiveProject();
          });

          const durInp = clip.querySelector('[data-cue-dur]');
          durInp.addEventListener('change', () => {
            cue.duration = Math.max(0.5, parseFloat(durInp.value) || 5);
            renderTimeline();
            saveActiveProject();
          });

          const fadeInp = clip.querySelector('[data-cue-fade]');
          fadeInp.addEventListener('change', () => {
            cue.fade = Math.max(0, parseFloat(fadeInp.value) || 0);
            saveActiveProject();
          });

          const delBtn = clip.querySelector('[data-cue-del]');
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.cues.length <= 1) {
              showToast('At least one cue must remain');
              return;
            }
            state.cues.splice(idx, 1);
            if (state.activeCueIndex >= state.cues.length) state.activeCueIndex = state.cues.length - 1;
            renderTimeline();
            saveActiveProject();
          });

          track.appendChild(clip);
        });

        updateShowClock();
      }

      function fmtTime(sec) {
        const s = Math.max(0, sec);
        const mins = Math.floor(s / 60);
        const rem = (s % 60).toFixed(1).padStart(4, '0');
        return `${String(mins).padStart(2, '0')}:${rem}`;
      }

      function updateShowClock() {
        const totalDur = state.cues.reduce((acc, c) => acc + (Number(c.duration) || 0), 0);
        let elapsedTotal = ui.cueElapsed;
        for (let i = 0; i < state.activeCueIndex; i++) {
          elapsedTotal += Number(state.cues[i]?.duration) || 0;
        }
        document.getElementById('show-clock').textContent = `${fmtTime(elapsedTotal)} / ${fmtTime(totalDur)}`;
        const activeClip = document.querySelector('.cue-clip.active .cue-progress');
        const curCue = state.cues[state.activeCueIndex];
        if (activeClip && curCue) {
          activeClip.style.width = `${Math.min(100, (ui.cueElapsed / Math.max(0.1, curCue.duration)) * 100)}%`;
        }
      }

      /* =========================================================================
         10. TOOLBAR, MEDIA UPLOAD, PROJECTS MODAL, AND KEYBOARD SHORTCUTS
      ========================================================================= */
      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function setTool(tool) {
        ui.tool = tool;
        if (tool !== 'pen') ui.penPoints = [];
        document.getElementById('tool-box').classList.toggle('active', tool === 'box');
        document.getElementById('tool-warp').classList.toggle('active', tool === 'warp');
        document.getElementById('tool-pen').classList.toggle('active', tool === 'pen');
        const labels = {
          box: 'Box Transform (Drag corners/edges to scale, top handle to rotate)',
          warp: 'Perspective Warp (Drag pins, double-click edge to add vertex)',
          pen: 'Pen Tool (Click points on stage, click first point or Enter to close)'
        };
        document.getElementById('hud-mode').textContent = labels[tool] || tool;
      }

      document.getElementById('tool-box').onclick = () => setTool('box');
      document.getElementById('tool-warp').onclick = () => setTool('warp');
      document.getElementById('tool-pen').onclick = () => {
        ui.penPoints = [];
        setTool('pen');
      };

      function addNewShape(type) {
        const layer = createDefaultLayer(type);
        state.layers.push(layer);
        state.selectedLayerId = layer.id;
        renderLayerList();
        renderInspector();
        saveActiveProject();
        showToast(`Added ${layer.name}`);
      }

      document.getElementById('add-quad').onclick = () => addNewShape('quad');
      document.getElementById('add-triangle').onclick = () => addNewShape('triangle');
      document.getElementById('add-circle').onclick = () => addNewShape('circle');
      document.getElementById('add-text').onclick = () => addNewShape('text');
      document.getElementById('add-mask').onclick = () => addNewShape('mask');

      document.getElementById('btn-snap').onclick = () => {
        ui.snap = !ui.snap;
        document.getElementById('btn-snap').classList.toggle('active', ui.snap);
        showToast(`Magnetic Snap: ${ui.snap ? 'On' : 'Off'}`);
      };

      document.getElementById('btn-grid').onclick = () => {
        ui.showGrid = !ui.showGrid;
        document.getElementById('btn-grid').classList.toggle('active', ui.showGrid);
        syncLiveProjector(true);
      };

      document.getElementById('sel-resolution').onchange = (e) => {
        const val = e.target.value;
        if (val === 'custom') {
          const w = parseInt(prompt('Output Width (px):', String(state.width)) || '', 10);
          const h = parseInt(prompt('Output Height (px):', String(state.height)) || '', 10);
          if (w >= 320 && h >= 240) {
            state.width = w;
            state.height = h;
          }
        } else {
          const [w, h] = val.split('x').map(Number);
          if (w && h) {
            state.width = w;
            state.height = h;
          }
        }
        ui.zoomManual = false;
        updateStageLayout();
        saveActiveProject();
      };

      document.getElementById('btn-zoom-in').onclick = () => {
        ui.zoomManual = true;
        ui.zoom = Math.min(3, ui.zoom * 1.15);
        updateStageLayout();
      };
      document.getElementById('btn-zoom-out').onclick = () => {
        ui.zoomManual = true;
        ui.zoom = Math.max(0.15, ui.zoom / 1.15);
        updateStageLayout();
      };
      document.getElementById('btn-zoom-fit').onclick = () => {
        ui.zoomManual = false;
        updateStageLayout();
      };

      document.getElementById('btn-projector').onclick = openProjectorWindow;

      // Mobile drawers
      document.getElementById('btn-toggle-left').onclick = () => {
        document.getElementById('left-panel').classList.toggle('mobile-open');
        document.getElementById('right-panel').classList.remove('mobile-open');
      };
      document.getElementById('btn-toggle-right').onclick = () => {
        document.getElementById('right-panel').classList.toggle('mobile-open');
        document.getElementById('left-panel').classList.remove('mobile-open');
      };

      // Media File Input
      document.getElementById('file-media-upload').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        const sel = getSelectedLayer();
        if (!file || !sel) return;
        const reader = new FileReader();
        reader.onload = () => {
          sel.sourceType = 'media';
          sel.mediaType = file.type.startsWith('video/') ? 'video' : 'image';
          sel.mediaName = file.name;
          sel.mediaDataUrl = String(reader.result || '');
          mediaCache.delete(sel.id);
          renderInspector();
          saveActiveProject();
          syncLiveProjector(true);
          showToast(`Loaded ${file.name}`);
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      // Timeline Controls
      function togglePlayShow() {
        ui.isPlaying = !ui.isPlaying;
        document.getElementById('lbl-play').textContent = ui.isPlaying ? 'Pause' : 'Play Show';
      }
      document.getElementById('btn-show-play').onclick = togglePlayShow;
      document.getElementById('btn-cue-prev').onclick = () => triggerCue(state.activeCueIndex - 1, true);
      document.getElementById('btn-cue-next').onclick = () => triggerCue(state.activeCueIndex + 1, true);

      document.getElementById('btn-show-mode').onclick = () => {
        ui.autoAdvance = !ui.autoAdvance;
        document.getElementById('btn-show-mode').textContent = ui.autoAdvance ? 'Mode: Timed Auto-Play' : 'Mode: Presenter Hold';
      };

      document.getElementById('btn-show-loop').onclick = () => {
        ui.loopShow = !ui.loopShow;
        const btn = document.getElementById('btn-show-loop');
        btn.textContent = `Loop: ${ui.loopShow ? 'On' : 'Off'}`;
        btn.classList.toggle('active', ui.loopShow);
      };

      document.getElementById('btn-cue-add').onclick = () => {
        const cue = {
          id: makeId('cue'),
          name: `Cue ${state.cues.length + 1}`,
          duration: 10,
          fade: 1.5,
          layers: state.layers.map(cloneLayerState)
        };
        state.cues.push(cue);
        state.activeCueIndex = state.cues.length - 1;
        ui.cueElapsed = 0;
        renderTimeline();
        saveActiveProject();
        showToast(`Captured ${cue.name}`);
      };

      document.getElementById('btn-cue-update').onclick = () => {
        const cue = state.cues[state.activeCueIndex];
        if (!cue) return;
        cue.layers = state.layers.map(cloneLayerState);
        renderTimeline();
        saveActiveProject();
        showToast(`Updated ${cue.name}`);
      };

      // Projects Modal
      function getSavedProjects() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
          return [];
        }
      }

      function renderProjectsList() {
        const list = document.getElementById('saved-projects-list');
        document.getElementById('inp-project-name').value = state.projectName || 'Untitled Show';
        const items = getSavedProjects();
        if (!items.length) {
          list.innerHTML = `<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:12px;">No saved local projects yet.</div>`;
          return;
        }
        list.innerHTML = '';
        items.forEach((proj, idx) => {
          const row = document.createElement('div');
          row.className = 'layer-item';
          row.style.background = 'var(--bg-control)';
          row.innerHTML = `
            <span class="layer-name">${proj.projectName || 'Untitled'}</span>
            <span class="tabular" style="color:var(--text-muted);">${proj.width}×${proj.height}</span>
            <button class="btn btn-sm primary" data-load="${idx}">Load</button>
            <button class="btn btn-sm danger" data-del="${idx}">✕</button>
          `;
          row.querySelector('[data-load]').onclick = () => {
            state = JSON.parse(JSON.stringify(proj));
            ui.transition = null;
            ui.cueElapsed = 0;
            updateStageLayout();
            renderLayerList();
            renderInspector();
            renderTimeline();
            saveActiveProject();
            document.getElementById('projects-modal').classList.remove('open');
            showToast(`Loaded ${state.projectName}`);
          };
          row.querySelector('[data-del]').onclick = () => {
            items.splice(idx, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            renderProjectsList();
          };
          list.appendChild(row);
        });
      }

      document.getElementById('btn-projects').onclick = () => {
        renderProjectsList();
        document.getElementById('projects-modal').classList.add('open');
      };
      document.getElementById('btn-close-modal').onclick = () => {
        document.getElementById('projects-modal').classList.remove('open');
      };
      document.getElementById('btn-save-local').onclick = () => {
        state.projectName = document.getElementById('inp-project-name').value.trim() || 'Untitled Show';
        const items = getSavedProjects();
        const existingIdx = items.findIndex(p => p.projectName === state.projectName);
        const snap = JSON.parse(JSON.stringify(state));
        if (existingIdx >= 0) items[existingIdx] = snap;
        else items.unshift(snap);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        saveActiveProject();
        renderProjectsList();
        showToast(`Saved "${state.projectName}"`);
      };
      document.getElementById('btn-new-project').onclick = () => {
        const blankLayer = createDefaultLayer('quad', 'Main Surface');
        state = {
          projectName: 'New Projection Show',
          width: 1920,
          height: 1080,
          layers: [blankLayer],
          selectedLayerId: blankLayer.id,
          cues: [{
            id: makeId('cue'),
            name: 'Cue 1',
            duration: 10,
            fade: 1.0,
            layers: [cloneLayerState(blankLayer)]
          }],
          activeCueIndex: 0
        };
        updateStageLayout();
        renderLayerList();
        renderInspector();
        renderTimeline();
        saveActiveProject();
        document.getElementById('projects-modal').classList.remove('open');
        showToast('Created new blank project');
      };
      document.getElementById('btn-export-maptor').onclick = () => {
        state.projectName = document.getElementById('inp-project-name').value.trim() || 'maptor_show';
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_')}.maptor`;
        a.click();
        showToast('Exported .maptor file');
      };
      document.getElementById('btn-import-maptor').onclick = () => {
        document.getElementById('file-import-maptor').click();
      };
      document.getElementById('file-import-maptor').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || '{}'));
            if (parsed && Array.isArray(parsed.layers)) {
              state = parsed;
              ui.transition = null;
              updateStageLayout();
              renderLayerList();
              renderInspector();
              renderTimeline();
              saveActiveProject();
              document.getElementById('projects-modal').classList.remove('open');
              showToast('Imported .maptor project');
            }
          } catch (err) {
            showToast('Invalid .maptor file');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
      document.getElementById('btn-export-png').onclick = () => {
        if (renderer) renderer.renderScene(state.width, state.height, getRenderedLayers(), ui.clockSec, getMediaSource);
        const a = document.createElement('a');
        a.href = glCanvas.toDataURL('image/png');
        a.download = `${(state.projectName || 'maptor').toLowerCase().replace(/[^a-z0-9]+/g, '_')}.png`;
        a.click();
        showToast('Exported PNG snapshot');
      };

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.code === 'Space') {
          e.preventDefault();
          if (!ui.autoAdvance && ui.isPlaying) {
            triggerCue(state.activeCueIndex + 1, true);
          } else {
            togglePlayShow();
          }
        } else if (e.key.toLowerCase() === 'v') {
          setTool('box');
        } else if (e.key.toLowerCase() === 'w') {
          setTool('warp');
        } else if (e.key.toLowerCase() === 'p') {
          setTool('pen');
        } else if (e.key.toLowerCase() === 's') {
          document.getElementById('btn-snap').click();
        } else if (e.key.toLowerCase() === 'g') {
          document.getElementById('btn-grid').click();
        } else if (e.key === 'Enter' && ui.tool === 'pen') {
          finishPenPolygon();
        } else if (e.key === 'Escape' && ui.tool === 'pen') {
          ui.penPoints = [];
          setTool('box');
        } else if (e.key === 'ArrowRight' && !e.shiftKey && !getSelectedLayer()) {
          triggerCue(state.activeCueIndex + 1, true);
        } else if (e.key === 'ArrowLeft' && !e.shiftKey && !getSelectedLayer()) {
          triggerCue(state.activeCueIndex - 1, true);
        } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          const sel = getSelectedLayer();
          if (sel && !sel.locked) {
            e.preventDefault();
            const step = e.shiftKey ? 10 : 1;
            const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
            const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
            sel.points = sel.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
            renderInspector();
            saveActiveProject();
          }
        }
      });

      /* =========================================================================
         11. MAIN ANIMATION LOOP & BOOTSTRAP
      ========================================================================= */
      function mainLoop(now) {
        const dt = Math.min(0.1, (now - ui.lastFrameTime) * 0.001);
        ui.lastFrameTime = now;
        ui.clockSec += dt;

        if (ui.transition) {
          ui.transition.elapsed += dt;
          if (ui.transition.elapsed >= ui.transition.duration) {
            ui.transition = null;
          }
        }

        if (ui.isPlaying && state.cues.length > 0) {
          const curCue = state.cues[state.activeCueIndex];
          ui.cueElapsed += dt;
          if (curCue && ui.cueElapsed >= curCue.duration) {
            if (ui.autoAdvance) {
              const nextIdx = state.activeCueIndex + 1;
              if (nextIdx < state.cues.length) {
                triggerCue(nextIdx, true);
              } else if (ui.loopShow) {
                triggerCue(0, true);
              } else {
                ui.cueElapsed = curCue.duration;
                ui.isPlaying = false;
                document.getElementById('lbl-play').textContent = 'Play Show';
              }
            } else {
              ui.cueElapsed = curCue.duration;
            }
          }
          updateShowClock();
        }

        const activeLayers = getRenderedLayers();
        if (renderer) {
          renderer.renderScene(state.width, state.height, activeLayers, ui.clockSec, getMediaSource);
        }
        drawStageOverlay();
        syncLiveProjector(false);

        requestAnimationFrame(mainLoop);
      }

      window.addEventListener('resize', updateStageLayout);

      // Initialize UI and start render loop cleanly
      updateStageLayout();
      renderLayerList();
      renderInspector();
      renderTimeline();
      syncLiveProjector(true);
      requestAnimationFrame(mainLoop);
    })();
  </script>
</body>
</html>
