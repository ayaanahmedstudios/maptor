<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maptor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath d='M128 24 220 76v104l-92 52-92-52V76Z' fill='none' stroke='%236366f1' stroke-width='20' stroke-linejoin='round'/%3E%3Cpath d='M36 76l92 52 92-52M128 128v104' fill='none' stroke='%236366f1' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='128' cy='128' r='18' fill='%236366f1'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #08080a;
      --bg-panel: rgba(17, 17, 21, 0.94);
      --bg-card: rgba(26, 26, 32, 0.78);
      --bg-control: #222229;
      --bg-control-hover: #2c2c35;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f4f6;
      --text-dim: #9ca3af;
      --text-muted: #6b7280;
      --accent: #6366f1;
      --accent-hover: #5558e6;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --danger: #ef4444;
      --success: #10b981;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      color: var(--text);
      font-family: var(--font);
      font-size: 12.5px;
      line-height: 1.4;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .num { font-variant-numeric: tabular-nums; }
    svg.ico { width: 15px; height: 15px; flex-shrink: 0; stroke-width: 1.8; }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #topbar {
      height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0e0e12;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 30;
    }

    .row { display: flex; align-items: center; gap: 6px; }
    .sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }

    button, select, input, textarea {
      font-family: var(--font);
      color: var(--text);
      outline: none;
    }

    .ibtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }
    .ibtn.sq { width: 28px; padding: 0; }
    .ibtn:hover:not(:disabled) { background: var(--bg-control); color: var(--text); }
    .ibtn:disabled { opacity: 0.32; cursor: not-allowed; }
    .ibtn.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
      color: #c7d2fe;
    }
    .ibtn.solid {
      background: var(--bg-control);
      border-color: var(--border);
      color: var(--text);
    }
    .ibtn.solid:hover { background: var(--bg-control-hover); border-color: var(--border-strong); }
    .ibtn.primary {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 0 12px;
    }
    .ibtn.primary:hover { background: var(--accent-hover); }

    #workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .drawer {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex-shrink: 0;
      z-index: 20;
    }
    #left-drawer { width: 244px; border-right: 1px solid var(--border); }
    #right-drawer { width: 312px; border-left: 1px solid var(--border); }
    .drawer.collapsed { width: 0 !important; overflow: hidden; border: none; }

    .splitter {
      width: 4px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      z-index: 25;
    }
    .splitter:hover, .splitter.dragging { background: var(--accent); }

    .drawer-head {
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 5px; }
    .scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }

    .lyr-card {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 8px 0 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .lyr-card:hover { background: var(--bg-card); }
    .lyr-card.selected {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
    }
    .lyr-card.drag-over { border-top: 2px solid var(--accent); }

    .lyr-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lyr-title {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lyr-ops {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.65;
    }
    .lyr-card:hover .lyr-ops, .lyr-card.selected .lyr-ops { opacity: 1; }
    .mini-ico {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .mini-ico:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .mini-ico.del:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

    #stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #070709;
      background-image: radial-gradient(rgba(255, 255, 255, 0.065) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
      touch-action: none;
    }

    #viewport {
      position: relative;
      background: #000;
      border-radius: 4px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(255, 255, 255, 0.13);
      flex-shrink: 0;
    }
    #gl-canvas, #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }

    #floating-dock {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 12px;
      background: rgba(20, 20, 26, 0.92);
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      z-index: 18;
      max-width: 95%;
    }
    .dock-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .dock-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
    .dock-btn.active {
      background: var(--accent);
      color: #fff;
    }

    #stage-top-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(17, 17, 21, 0.85);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-dim);
      pointer-events: none;
      white-space: nowrap;
      z-index: 14;
    }

    #zoom-pill {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px 6px;
      border-radius: 8px;
      background: rgba(17, 17, 21, 0.85);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-dim);
      z-index: 14;
    }

    .insp-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 12, 16, 0.6);
      flex-shrink: 0;
    }
    .itab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .itab:hover { color: var(--text-dim); background: rgba(255,255,255,0.04); }
    .itab.active {
      background: var(--bg-control);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .sec {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 10px;
    }
    .sec-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .srow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }
    .srow:last-child { margin-bottom: 0; }
    .slabel { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
    .sval { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text); min-width: 36px; text-align: right; }

    .inp {
      width: 100%;
      height: 29px;
      padding: 0 9px;
      background: var(--bg-control);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      color: var(--text);
    }
    textarea.inp { height: auto; padding: 7px 9px; resize: vertical; }
    .inp:focus { border-color: var(--accent); }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.14);
      border-radius: 99px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--accent);
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 20px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 2px;
      background: #0b0b0e;
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .seg button {
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 11.5px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
    }
    .seg button.active { background: var(--bg-control-hover); color: var(--text); }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .sh-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .sh-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg-control);
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      font-size: 11.5px;
      color: var(--text-dim);
    }
    .sh-card:hover { background: var(--bg-control-hover); color: var(--text); }
    .sh-card.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.55);
      color: #e0e7ff;
    }
    .sh-orb { width: 18px; height: 18px; border-radius: 6px; flex-shrink: 0; }

    .win-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .win-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 7px 4px;
      border-radius: 8px;
      background: var(--bg-control);
      border: 1px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
    }
    .win-card:hover { background: var(--bg-control-hover); color: var(--text); }
    .win-card.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.55);
      color: #e0e7ff;
    }
    .win-card span { font-size: 10.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #timeline {
      height: 186px;
      background: #0d0d11;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 25;
    }
    #timeline.collapsed { height: 36px !important; overflow: hidden; }

    #tl-bar {
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #111116;
      flex-shrink: 0;
    }

    #tl-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      overflow: hidden;
    }

    #tl-heads {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: #0f0f13;
    }
    .tl-corner {
      height: 24px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .tl-thead {
      height: 34px;
      padding: 0 10px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .tl-thead:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .tl-thead.selected { background: rgba(99, 102, 241, 0.12); color: #c7d2fe; }

    #tl-scroll {
      position: relative;
      overflow-x: auto;
      overflow-y: auto;
      background: #08080b;
    }
    #tl-area { position: relative; min-height: 100%; }

    #tl-ruler {
      position: sticky;
      top: 0;
      height: 24px;
      background: #121217;
      border-bottom: 1px solid var(--border-strong);
      cursor: ew-resize;
      z-index: 10;
    }
    .rtick {
      position: absolute;
      top: 0; bottom: 0;
      border-left: 1px solid rgba(255,255,255,0.12);
      padding-left: 4px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      line-height: 23px;
      pointer-events: none;
    }

    .tl-lane {
      position: relative;
      height: 34px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .tl-lane.selected { background: rgba(99, 102, 241, 0.04); }

    .tl-clip {
      position: absolute;
      top: 4px;
      height: 26px;
      border-radius: 6px;
      background: #1e2338;
      border: 1px solid rgba(99, 102, 241, 0.5);
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 500;
      color: #e0e7ff;
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
    }
    .tl-clip:active { cursor: grabbing; }
    .tl-clip.selected {
      background: #283052;
      border-color: #818cf8;
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.45);
    }
    .tl-clip.mask {
      background: #2c181d;
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }
    .trim-l, .trim-r { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
    .trim-l { left: 0; }
    .trim-r { right: 0; }
    .trim-l:hover, .trim-r:hover { background: rgba(255,255,255,0.28); }

    #playhead {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #f43f5e;
      pointer-events: none;
      z-index: 15;
    }
    #playhead::before {
      content: '';
      position: absolute;
      top: 0; left: -5px;
      width: 12px; height: 11px;
      background: #f43f5e;
      clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      background: #131318;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toast {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: rgba(22, 22, 28, 0.96);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    @media (max-width: 820px) {
      #left-drawer, #right-drawer {
        position: absolute;
        top: 0; bottom: 0;
        width: min(300px, 84vw) !important;
        box-shadow: 0 0 40px rgba(0,0,0,0.85);
      }
      #left-drawer { left: 0; }
      #right-drawer { right: 0; }
      .splitter { display: none; }
      #tl-body { grid-template-columns: 118px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="row">
        <button class="ibtn sq solid active" id="btn-toggle-layers" title="Toggle Layers Panel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </button>

        <div class="sep"></div>

        <button class="ibtn solid" id="add-quad" title="Add Rectangle Surface">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          <span>Surface</span>
        </button>
        <button class="ibtn solid" id="add-arch" title="Add Architectural Window">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 20V11a7 7 0 0 1 14 0v9H5Z"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Window</span>
        </button>
        <button class="ibtn solid" id="add-text" title="Add Typography Card">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span>Text</span>
        </button>
        <button class="ibtn solid" id="add-mask" title="Add Blackout Mask">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>
          <span>Mask</span>
        </button>
      </div>

      <div class="row">

        const STORAGE_KEY = 'maptor_projects_v6';

        let state = null;

        function createLayer(type, customName, customPts) {
          const W = state ? state.width : 1920;
          const H = state ? state.height : 1080;
          const cx = W * 0.5, cy = H * 0.5;
          const rw = Math.round(W * 0.28), rh = Math.round(H * 0.44);

            : [
                { x: Math.round(cx - rw * 0.5), y: Math.round(cy - rh * 0.5) },
                { x: Math.round(cx + rw * 0.5), y: Math.round(cy - rh * 0.5) },
                { x: Math.round(cx + rw * 0.5), y: Math.round(cy + rh * 0.5) },
                { x: Math.round(cx - rw * 0.5), y: Math.round(cy + rh * 0.5) }

          const isText = type === 'text';
          const isMask = type === 'mask';

            id: uid('lyr'),
            name: customName || (isMask ? 'Blackout Mask' : isText ? 'Typography' : isArch ? 'Cathedral Window' : type === 'polygon' ? 'Polygon' : 'Surface'),

        function buildDefaultScene() {
          const arch = createLayer('arch', 'Cathedral Window');
          arch.points = [{ x: 340, y: 170 }, { x: 860, y: 185 }, { x: 860, y: 895 }, { x: 340, y: 910 }];
          arch.shaderId = 'rain';
          const c1 = createClip(arch, 0, 15, 'Rain Glass');
          const c2 = createClip(arch, 15, 15, 'Aurora');
          c2.props.shaderId = 'aurora';

        state = buildDefaultScene();
        try {
          const raw = localStorage.getItem(ACTIVE_KEY);

        const history = { undo: [], redo: [] };
        function pushHistory() {
          history.undo.push(JSON.stringify(state));
          if (history.undo.length > 25) history.undo.shift();
          history.redo = [];
          updateHistoryButtons();
        }
        function undo() {
          if (!history.undo.length) return;
          history.redo.push(JSON.stringify(state));
          state = JSON.parse(history.undo.pop());
          updateHistoryButtons();
          fullUIRefresh();
          scheduleSave();
          showToast('Undid');
        }
        function redo() {
          if (!history.redo.length) return;
          history.undo.push(JSON.stringify(state));
          state = JSON.parse(history.redo.pop());
          updateHistoryButtons();
          fullUIRefresh();
          scheduleSave();
          showToast('Redid');

        function updateHistoryButtons() {

        const ui = {

        };

        function getActiveClipAt(layer, t) {
          if (!layer.clips || !layer.clips.length) return null;
          for (let i = 0; i < layer.clips.length; i++) {
            const c = layer.clips[i];
            if (t >= c.start && t <= c.start + c.duration) return c;
          }
          return null;
        }

        function syncLayerToActiveClip(layer) {
          if (!layer || !layer.clips || !layer.clips.length) return;
          let clip = layer.clips.find(function (c) { return c.id === state.selectedClipId; });
          if (!clip) clip = getActiveClipAt(layer, ui.playheadSec) || layer.clips[0];
          if (!clip) return;
          Object.keys(clip.props).forEach(function (k) {
            if (layer[k] !== undefined) clip.props[k] = cloneObj(layer[k]);
          });
        }

        function applyClipToLayer(layer, clip, t) {
          if (!clip || !clip.props) return;
          Object.keys(clip.props).forEach(function (k) {
            layer[k] = cloneObj(clip.props[k]);
          });
          if (typeof t === 'number') {
            const localT = t - clip.start;
            let env = 1.0;
            if (clip.fadeIn > 0.01 && localT < clip.fadeIn) env = Math.max(0, localT / clip.fadeIn);
            if (clip.fadeOut > 0.01 && localT > clip.duration - clip.fadeOut) {
              env = Math.min(env, Math.max(0, (clip.duration - localT) / clip.fadeOut));
            }
            layer._clipOpacity = (clip.props.opacity != null ? clip.props.opacity : 1) * env;
          } else {
            layer._clipOpacity = clip.props.opacity != null ? clip.props.opacity : 1;
          }
        }

        function getEvaluatedLayers() {
          const t = ui.playheadSec;
          const out = [];
          for (let i = 0; i < state.layers.length; i++) {
            const l = state.layers[i];
            if (!l.visible) continue;
            const clip = getActiveClipAt(l, t);
            if (clip) {
              if (ui.isPlaying) {
                applyClipToLayer(l, clip, t);
              } else {
                const localT = t - clip.start;
                let env = 1.0;
                if (clip.fadeIn > 0.01 && localT < clip.fadeIn) env = Math.max(0, localT / clip.fadeIn);
                if (clip.fadeOut > 0.01 && localT > clip.duration - clip.fadeOut) {
                  env = Math.min(env, Math.max(0, (clip.duration - localT) / clip.fadeOut));
                }
                l._clipOpacity = (l.opacity != null ? l.opacity : 1) * env;
              }
              out.push(l);
            } else if (!ui.isPlaying) {
              l._clipOpacity = l.opacity != null ? l.opacity : 1;
              out.push(l);
            }
          }
          return out;
        }

        const mediaCache = new Map();
        const textCache = new Map();
        const meshCache = new Map();

        function getTypographyCanvas(layer) {
          const key = [
            layer.text, layer.fontFamily, layer.fontWeight, layer.fontSize,
            layer.letterSpacing, layer.lineHeight, layer.textAlign,
            layer.textColor, layer.textBg, layer.textShadow
          ].join('|');
          const cached = textCache.get(layer.id);
          if (cached && cached.key === key) return cached.canvas;

          ensureGoogleFont(layer.fontFamily);
          const cvs = cached ? cached.canvas : document.createElement('canvas');
          cvs.width = 1280;
          cvs.height = 800;
          const ctx = cvs.getContext('2d');
          ctx.clearRect(0, 0, 1280, 800);

          if (layer.textBg && layer.textBg !== 'transparent') {
            ctx.fillStyle = layer.textBg;
            ctx.fillRect(0, 0, 1280, 800);
          }

          const lines = String(layer.text || '').split('\n');
          const fs = Math.max(14, Number(layer.fontSize) || 96);
          const lh = fs * (Number(layer.lineHeight) || 1.1);
          ctx.font = (layer.fontWeight || '600') + ' ' + fs + 'px "' + (layer.fontFamily || 'Inter') + '", sans-serif';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = layer.textColor || '#ffffff';

          if (layer.textShadow > 0) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = Number(layer.textShadow) * 1.4;
            ctx.shadowOffsetY = Math.round(Number(layer.textShadow) * 0.3);
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          const startY = (800 - lines.length * lh) * 0.5 + lh * 0.5;
          const anchorX = layer.textAlign === 'left' ? 90 : layer.textAlign === 'right' ? 1190 : 640;
          const sp = Number(layer.letterSpacing) || 0;

          lines.forEach(function (line, idx) {
            const y = startY + idx * lh;
            if (sp === 0) {
              ctx.textAlign = layer.textAlign || 'center';
              ctx.fillText(line, anchorX, y);
            } else {
              const chars = Array.from(line);
              const widths = chars.map(function (ch) { return ctx.measureText(ch).width; });
              const totalW = widths.reduce(function (a, b) { return a + b; }, 0) + Math.max(0, chars.length - 1) * sp;
              let cx = anchorX;
              if (layer.textAlign === 'center') cx = anchorX - totalW * 0.5;
              if (layer.textAlign === 'right') cx = anchorX - totalW;
              ctx.textAlign = 'left';
              chars.forEach(function (ch, ci) {
                ctx.fillText(ch, cx, y);
                cx += widths[ci] + sp;
              });
            }
          });

          textCache.set(layer.id, { canvas: cvs, key: key });
          return cvs;
        }

        function getLayerSourceMedia(layer) {
          if (layer.sourceType === 'text') {
            return { el: getTypographyCanvas(layer), ready: true, w: 1280, h: 800, isStatic: true };
          }
          if (layer.sourceType !== 'media' || !layer.mediaDataUrl) return null;

          const key = layer.mediaType + '|' + layer.mediaDataUrl.length + '|' + layer.mediaDataUrl.slice(0, 48);
          let entry = mediaCache.get(layer.id);

        function syncProjector(writeStorage) {
          const hasWindow = projectorWin && !projectorWin.closed;
          if (!hasWindow && !bc) return;
          const payload = { width: state.width, height: state.height, layers: getEvaluatedLayers() };
          if (bc) { try { bc.postMessage(payload); } catch (e) {} }
          if (hasWindow) { try { projectorWin.postMessage(payload, '*'); } catch (e) {} }
          if (writeStorage) { try { localStorage.setItem(LIVE_KEY, JSON.stringify(payload)); } catch (e) {} }

        function openProjectorWindow() {
          if (projectorWin && !projectorWin.closed) {

          showToast('Projector Connected');

        function resizeCanvas() {
          const rect = stage.getBoundingClientRect();
          const pad = 74;
          const availW = Math.max(120, rect.width - pad);
          const availH = Math.max(120, rect.height - pad);
          const fitScale = Math.min(availW / state.width, availH / state.height);
          if (!ui.zoomManual) ui.zoom = fitScale;

          const dispW = Math.max(1, Math.round(state.width * ui.zoom));
          const dispH = Math.max(1, Math.round(state.height * ui.zoom));
          viewport.style.width = dispW + 'px';
          viewport.style.height = dispH + 'px';
          overlayCanvas.width = state.width;
          overlayCanvas.height = state.height;
          ui.overlayDirty = true;

          document.getElementById('hud-zoom').textContent = Math.round((ui.zoom / fitScale) * 100) + '%';
        }

        if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(stage);
        window.addEventListener('resize', resizeCanvas);

        function getSelectedLayer() {
          return state.layers.find(function (l) { return l.id === state.selectedLayerId; }) || null;
        }

        function deleteSelectedLayer() {
          const idx = state.layers.findIndex(function (l) { return l.id === state.selectedLayerId; });
          if (idx < 0) return;
          pushHistory();
          const removed = state.layers.splice(idx, 1)[0];
          state.selectedLayerId = state.layers.length ? state.layers[Math.min(idx, state.layers.length - 1)].id : null;
          const nextSel = getSelectedLayer();
          state.selectedClipId = nextSel && nextSel.clips && nextSel.clips[0] ? nextSel.clips[0].id : null;
          ui.activeVertex = -1;
          ui.overlayDirty = true;
          fullUIRefresh();
          scheduleSave();
          showToast('Deleted ' + removed.name, true);
        }

          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            y: ((clientY - r.top) / Math.max(1, r.height)) * state.height

          return inside;
        }

        function distToSegment(p, v, w) {
          const l2 = (v.x - w.x) * (v.x - w.x) + (v.y - w.y) * (v.y - w.y);
          if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
          let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
          t = Math.max(0, Math.min(1, t));
          return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function snapDelta(origPts, rawDx, rawDy) {
          if (!ui.snap) return { dx: rawDx, dy: rawDy };
          const step = 20;
          let minX = Infinity, minY = Infinity;
          origPts.forEach(function (p) { if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y; });
          return { dx: Math.round((minX + rawDx) / step) * step - minX, dy: Math.round((minY + rawDy) / step) * step - minY };
        }

        function getBoxHandles(b) {
          return [
            { id: 'nw', x: b.minX, y: b.minY, cur: 'nwse-resize' },
            { id: 'n', x: b.cx, y: b.minY, cur: 'ns-resize' },
            { id: 'ne', x: b.maxX, y: b.minY, cur: 'nesw-resize' },
            { id: 'e', x: b.maxX, y: b.cy, cur: 'ew-resize' },
            { id: 'se', x: b.maxX, y: b.maxY, cur: 'nwse-resize' },
            { id: 's', x: b.cx, y: b.maxY, cur: 'ns-resize' },
            { id: 'sw', x: b.minX, y: b.maxY, cur: 'nesw-resize' },
            { id: 'w', x: b.minX, y: b.cy, cur: 'ew-resize' },
            { id: 'rot', x: b.cx, y: b.minY - 36, cur: 'grab' }
          ];
        }

        function hitTestHover(pt) {
          const hitR = 16 / Math.max(0.3, ui.zoom);
          if (ui.tool === 'pen') {
            if (ui.penPoints.length >= 3 && Math.hypot(pt.x - ui.penPoints[0].x, pt.y - ui.penPoints[0].y) <= hitR * 1.35) {
              return { type: 'pen-close', cursor: 'pointer' };
            }
            return { type: 'pen-add', cursor: 'crosshair' };
          }

          const sel = getSelectedLayer();
          if (sel && !sel.locked && sel.visible) {
            if (ui.tool === 'box') {
              const b = getBounds(sel);
              const handles = getBoxHandles(b);
              for (let i = 0; i < handles.length; i++) {
                if (Math.hypot(pt.x - handles[i].x, pt.y - handles[i].y) <= hitR) {
                  return { type: 'box-handle', id: handles[i].id, cursor: handles[i].cur };
                }
              }
            } else if (ui.tool === 'warp') {
              for (let i = 0; i < sel.points.length; i++) {
                if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
                  return { type: 'warp-vertex', idx: i, cursor: 'grab' };
                }
              }
              for (let i = 0; i < sel.points.length; i++) {
                const a = sel.points[i], b = sel.points[(i + 1) % sel.points.length];
                if (distToSegment(pt, a, b) <= hitR * 0.7) {
                  return { type: 'warp-edge', edgeIdx: i, cursor: 'copy' };
                }
              }
            }
          }

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            if (!l.visible) continue;
            const b = getBounds(l);
            const inBox = pt.x >= b.minX - 6 && pt.x <= b.maxX + 6 && pt.y >= b.minY - 6 && pt.y <= b.maxY + 6;
            if (pointInPoly(pt, l.points) || (ui.tool === 'box' && inBox)) {
              return { type: 'layer-move', layerId: l.id, cursor: l.locked ? 'not-allowed' : 'move' };
            }
          }

          return { type: 'none', cursor: 'default' };
        }

        overlayCanvas.addEventListener('pointerdown', function (e) {
          if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
          }
          const pt = toStagePt(e.clientX, e.clientY);
          const hit = hitTestHover(pt);

          if (ui.tool === 'pen') {
            if (hit.type === 'pen-close') { commitPenPolygon(); return; }
            ui.penPoints.push({ x: Math.round(pt.x), y: Math.round(pt.y) });
            ui.overlayDirty = true;
            updateHint();
            return;
          }

          const sel = getSelectedLayer();
          if (hit.type === 'box-handle' && sel) {
            pushHistory();
            overlayCanvas.setPointerCapture(e.pointerId);
            overlayCanvas.style.cursor = hit.id === 'rot' ? 'grabbing' : hit.cursor;
            ui.dragging = { mode: hit.id === 'rot' ? 'rotate' : 'resize', handle: hit.id, startPt: pt, origPts: sel.points.map(function (p) { return { x: p.x, y: p.y }; }), origBounds: getBounds(sel) };
            return;
          }

          if (hit.type === 'warp-vertex' && sel) {
            pushHistory();
            ui.activeVertex = hit.idx;
            overlayCanvas.setPointerCapture(e.pointerId);
            overlayCanvas.style.cursor = 'grabbing';
            ui.dragging = { mode: 'vertex', vIdx: hit.idx, startPt: pt, origPt: { x: sel.points[hit.idx].x, y: sel.points[hit.idx].y } };
            ui.overlayDirty = true;
            renderInspector();
            return;
          }

          if (hit.type === 'warp-edge' && sel) {
            pushHistory();
            const insertAt = hit.edgeIdx + 1;
            sel.points.splice(insertAt, 0, { x: Math.round(pt.x), y: Math.round(pt.y) });
            ui.activeVertex = insertAt;
            meshCache.delete(sel.id);
            syncLayerToActiveClip(sel);
            syncProjector(true);
            ui.overlayDirty = true;
            renderInspector();
            showToast('Corner added');
            return;
          }

          if (hit.type === 'layer-move') {
            const l = state.layers.find(function (item) { return item.id === hit.layerId; });
            if (l) {
              state.selectedLayerId = l.id;
              ui.activeVertex = -1;
              const ac = getActiveClipAt(l, ui.playheadSec) || (l.clips && l.clips[0]);
              if (ac) state.selectedClipId = ac.id;
              renderLayers();
              renderInspector();
              renderTimeline();
              ui.overlayDirty = true;
              if (!l.locked) {
                pushHistory();
                overlayCanvas.setPointerCapture(e.pointerId);
                overlayCanvas.style.cursor = 'move';
                ui.dragging = { mode: 'move', startPt: pt, origPts: l.points.map(function (p) { return { x: p.x, y: p.y }; }) };
              }
              return;
            }
          }

          state.selectedLayerId = null;
          ui.activeVertex = -1;
          ui.overlayDirty = true;
          renderLayers();
          renderInspector();
          renderTimeline();
        });

        overlayCanvas.addEventListener('pointermove', function (e) {
          const pt = toStagePt(e.clientX, e.clientY);

          if (ui.tool === 'pen' && !ui.dragging) {
            ui.penCursorPt = pt;
            ui.overlayDirty = true;
          }

          if (!ui.dragging) {
            const hit = hitTestHover(pt);
            overlayCanvas.style.cursor = hit.cursor;
            const prevKey = ui.hoveredHandle ? (ui.hoveredHandle.type + ':' + (ui.hoveredHandle.id || ui.hoveredHandle.idx)) : '';
            const nextKey = hit ? (hit.type + ':' + (hit.id || hit.idx)) : '';
            if (prevKey !== nextKey) {
              ui.hoveredHandle = hit;
              ui.overlayDirty = true;
            }
            return;
          }

          const sel = getSelectedLayer();
          if (!sel) return;
          const dx = pt.x - ui.dragging.startPt.x;
          const dy = pt.y - ui.dragging.startPt.y;

          if (ui.dragging.mode === 'move') {
            const sn = snapDelta(ui.dragging.origPts, dx, dy);
            sel.points = ui.dragging.origPts.map(function (p) { return { x: Math.round(p.x + sn.dx), y: Math.round(p.y + sn.dy) }; });
          } else if (ui.dragging.mode === 'vertex') {
            const sn = snapDelta([ui.dragging.origPt], dx, dy);
            sel.points[ui.dragging.vIdx] = { x: Math.round(ui.dragging.origPt.x + sn.dx), y: Math.round(ui.dragging.origPt.y + sn.dy) };
          } else if (ui.dragging.mode === 'rotate') {
            const b = ui.dragging.origBounds;
            let da = Math.atan2(pt.y - b.cy, pt.x - b.cx) - Math.atan2(ui.dragging.startPt.y - b.cy, ui.dragging.startPt.x - b.cx);
            if (e.shiftKey) da = Math.round(da / (Math.PI / 12)) * (Math.PI / 12);
            const c = Math.cos(da), s = Math.sin(da);
            sel.points = ui.dragging.origPts.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
          } else if (ui.dragging.mode === 'resize') {
            const b = ui.dragging.origBounds, h = ui.dragging.handle;
            let nMinX = b.minX, nMaxX = b.maxX, nMinY = b.minY, nMaxY = b.maxY;
            if (h.indexOf('w') !== -1) nMinX = Math.min(b.maxX - 16, b.minX + dx);
            if (h.indexOf('e') !== -1) nMaxX = Math.max(b.minX + 16, b.maxX + dx);
            if (h.indexOf('n') !== -1) nMinY = Math.min(b.maxY - 16, b.minY + dy);
            if (h.indexOf('s') !== -1) nMaxY = Math.max(b.minY + 16, b.maxY + dy);
            sel.points = ui.dragging.origPts.map(function (p) {
              return {
                x: Math.round(nMinX + ((p.x - b.minX) / b.w) * (nMaxX - nMinX)),
                y: Math.round(nMinY + ((p.y - b.minY) / b.h) * (nMaxY - nMinY))
              };
            });
          }

          meshCache.delete(sel.id);
          ui.overlayDirty = true;
          syncLayerToActiveClip(sel);
          syncProjector(false);
        });

        overlayCanvas.addEventListener('pointerup', function (e) {
          if (ui.dragging) {
            ui.dragging = null;
            const hit = hitTestHover(toStagePt(e.clientX, e.clientY));
            overlayCanvas.style.cursor = hit.cursor;
            ui.overlayDirty = true;
            if (ui.inspTab === 'shape') renderInspector();
            scheduleSave();
          }
        });

        overlayCanvas.addEventListener('dblclick', function () {
          if (ui.tool === 'pen') commitPenPolygon();
        });

        function commitPenPolygon() {
          if (ui.penPoints.length >= 3) {
            pushHistory();
            const poly = createLayer('polygon', 'Polygon', ui.penPoints);
            state.layers.push(poly);
            state.selectedLayerId = poly.id;
            state.selectedClipId = poly.clips[0].id;
            showToast('Polygon created');
          }
          ui.penPoints = [];
          ui.penCursorPt = null;
          setTool('warp');
          fullUIRefresh();
          scheduleSave();
        }

        function drawOverlay() {
          if (!ui.overlayDirty) return;
          ui.overlayDirty = false;

          const W = state.width, H = state.height;
          overlayCtx.clearRect(0, 0, W, H);
          const invZ = 1 / Math.max(0.25, ui.zoom);

          if (ui.showGrid) {
            overlayCtx.save();
            overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            overlayCtx.lineWidth = 1 * invZ;
            for (let x = 0; x <= W; x += 120) { overlayCtx.beginPath(); overlayCtx.moveTo(x, 0); overlayCtx.lineTo(x, H); overlayCtx.stroke(); }
            for (let y = 0; y <= H; y += 120) { overlayCtx.beginPath(); overlayCtx.moveTo(0, y); overlayCtx.lineTo(W, y); overlayCtx.stroke(); }
            overlayCtx.strokeStyle = 'rgba(99, 102, 241, 0.42)';
            overlayCtx.lineWidth = 1.4 * invZ;
            overlayCtx.beginPath();
            overlayCtx.moveTo(W * 0.5, 0); overlayCtx.lineTo(W * 0.5, H);
            overlayCtx.moveTo(0, H * 0.5); overlayCtx.lineTo(W, H * 0.5);
            overlayCtx.stroke();
            overlayCtx.restore();
          }

          state.layers.forEach(function (l) {
            if (!l.visible || l.id === state.selectedLayerId) return;
            overlayCtx.save();
            overlayCtx.strokeStyle = l.kind === 'mask' ? 'rgba(239, 68, 68, 0.32)' : 'rgba(255, 255, 255, 0.14)';
            overlayCtx.lineWidth = 1.2 * invZ;
            overlayCtx.beginPath();
            l.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.closePath();
            overlayCtx.stroke();
            overlayCtx.restore();
          });

          const sel = getSelectedLayer();
          if (sel && sel.visible) {
            const col = sel.kind === 'mask' ? '#ef4444' : '#6366f1';
            overlayCtx.save();
            overlayCtx.strokeStyle = col;
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            sel.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.closePath();
            overlayCtx.stroke();

            if (!sel.locked) {
              if (ui.tool === 'box') {
                const b = getBounds(sel);
                overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.85)';
                overlayCtx.setLineDash([5 * invZ, 4 * invZ]);
                overlayCtx.strokeRect(b.minX, b.minY, b.w, b.h);
                overlayCtx.setLineDash([]);
                overlayCtx.beginPath(); overlayCtx.moveTo(b.cx, b.minY); overlayCtx.lineTo(b.cx, b.minY - 36); overlayCtx.stroke();
                const hs = 6 * invZ;
                getBoxHandles(b).forEach(function (h) {
                  const isHov = ui.hoveredHandle && ui.hoveredHandle.type === 'box-handle' && ui.hoveredHandle.id === h.id;
                  overlayCtx.fillStyle = isHov ? '#818cf8' : '#ffffff';
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 2 * invZ;
                  overlayCtx.beginPath();
                  const sc = isHov ? 1.3 : 1.0;
                  if (h.id === 'rot') overlayCtx.arc(h.x, h.y, hs * 1.15 * sc, 0, Math.PI * 2);
                  else overlayCtx.rect(h.x - hs * sc, h.y - hs * sc, hs * 2 * sc, hs * 2 * sc);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              } else if (ui.tool === 'warp') {
                sel.points.forEach(function (p, idx) {
                  const isHov = ui.hoveredHandle && ui.hoveredHandle.type === 'warp-vertex' && ui.hoveredHandle.idx === idx;
                  const rad = (isHov ? 9.5 : 7.5) * invZ;
                  overlayCtx.fillStyle = idx === ui.activeVertex ? '#f59e0b' : (isHov ? '#818cf8' : '#ffffff');
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 2.4 * invZ;
                  overlayCtx.beginPath();
                  overlayCtx.arc(p.x, p.y, rad, 0, Math.PI * 2);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              }
            }
            overlayCtx.restore();
          }

          if (ui.tool === 'pen' && ui.penPoints.length > 0) {
            overlayCtx.save();
            overlayCtx.strokeStyle = '#10b981';
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            ui.penPoints.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            if (ui.penCursorPt) overlayCtx.lineTo(ui.penCursorPt.x, ui.penCursorPt.y);
            overlayCtx.stroke();
            ui.penPoints.forEach(function (p, i) {
              overlayCtx.fillStyle = i === 0 ? '#10b981' : '#ffffff';
              overlayCtx.beginPath(); overlayCtx.arc(p.x, p.y, (i === 0 ? 7.5 : 5.5) * invZ, 0, Math.PI * 2); overlayCtx.fill();
            });
            overlayCtx.restore();
          }
        }

        function setupSplitter(splitId, drawerId, invert) {
          const sp = document.getElementById(splitId);
          const dr = document.getElementById(drawerId);
          if (!sp || !dr) return;
          sp.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            sp.setPointerCapture(e.pointerId);
            sp.classList.add('dragging');
            const startX = e.clientX;
            const startW = dr.getBoundingClientRect().width;
            dr.classList.remove('collapsed');

            const onMove = function (ev) {
              const dx = (ev.clientX - startX) * (invert ? -1 : 1);
              dr.style.width = Math.max(200, Math.min(480, startW + dx)) + 'px';
              resizeCanvas();
            };
            const onUp = function () {
              sp.classList.remove('dragging');
              sp.removeEventListener('pointermove', onMove);
              sp.removeEventListener('pointerup', onUp);
            };
            sp.addEventListener('pointermove', onMove);
            sp.addEventListener('pointerup', onUp);
          });
        }
        setupSplitter('split-left', 'left-drawer', false);
        setupSplitter('split-right', 'right-drawer', true);

        document.getElementById('btn-toggle-layers').onclick = function () {
          const dr = document.getElementById('left-drawer');
          dr.classList.toggle('collapsed');
          this.classList.toggle('active', !dr.classList.contains('collapsed'));
          resizeCanvas();
        };
        document.getElementById('btn-toggle-props').onclick = function () {
          const dr = document.getElementById('right-drawer');
          dr.classList.toggle('collapsed');
          this.classList.toggle('active', !dr.classList.contains('collapsed'));
          resizeCanvas();
        };
        document.getElementById('btn-collapse-tl').onclick = function () {
          const tl = document.getElementById('timeline');
          tl.classList.toggle('collapsed');
          this.style.transform = tl.classList.contains('collapsed') ? 'rotate(180deg)' : '';
          resizeCanvas();
        };

        let dragLayerIdx = -1;

        function renderLayers() {
          const list = document.getElementById('layer-list');
          document.getElementById('layer-count').textContent = String(state.layers.length);
          list.innerHTML = '';

          if (!state.layers.length) {
            list.innerHTML = '<div style="padding:28px 12px;text-align:center;color:var(--text-muted);font-size:12px;">Click <strong>Surface</strong> or <strong>Window</strong> above to begin</div>';
            return;
          }

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            const row = document.createElement('div');
            row.className = 'lyr-card' + (l.id === state.selectedLayerId ? ' selected' : '');
            row.draggable = true;
            const dotCol = l.kind === 'mask' ? '#ef4444' : (l.c1 || '#6366f1');

            const eyeSvg = l.visible
              ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
              : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

            row.innerHTML =
              '<span class="lyr-dot" style="background:' + dotCol + ';"></span>' +
              '<span class="lyr-title" title="' + l.name.replace(/"/g, '&quot;') + '" style="' + (!l.visible ? 'opacity:0.4;' : '') + '">' + l.name + '</span>' +
              '<div class="lyr-ops">' +
                '<button class="mini-ico" data-a="vis" title="Show / Hide">' + eyeSvg + '</button>' +
                '<button class="mini-ico" data-a="dup" title="Duplicate"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' +
                '<button class="mini-ico del" data-a="del" title="Delete (Backspace)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>' +
              '</div>';

            row.addEventListener('dragstart', function () { dragLayerIdx = i; });
            row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('drag-over'); });
            row.addEventListener('dragleave', function () { row.classList.remove('drag-over'); });
            row.addEventListener('drop', function (e) {
              e.preventDefault();
              row.classList.remove('drag-over');
              if (dragLayerIdx >= 0 && dragLayerIdx !== i) {
                pushHistory();
                const moved = state.layers.splice(dragLayerIdx, 1)[0];
                state.layers.splice(i, 0, moved);
                renderLayers();
                renderTimeline();
                scheduleSave();
              }
              dragLayerIdx = -1;
            });

            row.addEventListener('click', function (e) {
              const btn = e.target.closest('button');
              if (!btn) {
                state.selectedLayerId = l.id;
                ui.activeVertex = -1;
                const ac = getActiveClipAt(l, ui.playheadSec) || (l.clips && l.clips[0]);
                if (ac) { state.selectedClipId = ac.id; applyClipToLayer(l, ac); }
                ui.overlayDirty = true;
                renderLayers();
                renderInspector();
                renderTimeline();
                syncProjector(true);
                return;
              }
              e.stopPropagation();
              const act = btn.dataset.a;
              pushHistory();
              if (act === 'vis') {
                l.visible = !l.visible;
              } else if (act === 'dup') {
                const copy = cloneObj(l);
                copy.id = uid('lyr');
                copy.name = l.name + ' Copy';
                copy.points = copy.points.map(function (p) { return { x: p.x + 30, y: p.y + 30 }; });
                copy.clips = copy.clips.map(function (c) { c.id = uid('clip'); return c; });
                state.layers.splice(i + 1, 0, copy);
                state.selectedLayerId = copy.id;
              } else if (act === 'del') {
                state.layers.splice(i, 1);
                if (state.selectedLayerId === l.id) state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
                showToast('Deleted ' + l.name, true);
              }
              ui.overlayDirty = true;
              fullUIRefresh();
              scheduleSave();
            });

            list.appendChild(row);
          }
        }

        document.querySelectorAll('#insp-tabs .itab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            ui.inspTab = tab.dataset.tab;
            document.querySelectorAll('#insp-tabs .itab').forEach(function (t) { t.classList.toggle('active', t === tab); });
            renderInspector();
          });
        });

        function renderInspector() {
          const body = document.getElementById('inspector-body');
          const title = document.getElementById('insp-title');
          const sel = getSelectedLayer();

          if (!sel) {
            title.textContent = 'Inspector';
            body.innerHTML = '<div style="padding:36px 14px;text-align:center;color:var(--text-muted);font-size:12px;">Select a surface on stage to edit</div>';
            return;
          }

          title.textContent = sel.name;
          const b = getBounds(sel);
          const selClip = (sel.clips || []).find(function (c) { return c.id === state.selectedClipId; });

          if (ui.inspTab === 'style') {
            if (sel.kind === 'mask') {
              body.innerHTML =

                '</div>' +
