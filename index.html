<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maptor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #08080a;
      --bg-panel: #0e0e12;
      --bg-elevated: #141419;
      --bg-control: #1b1b22;
      --bg-control-hover: #24242e;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-hairline: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.20);
      --text-primary: #f4f4f6;
      --text-secondary: #a1a1aa;
      --text-muted: #6e6e78;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --danger: #ef4444;
      --success: #10b981;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --left-w: 268px;
      --right-w: 320px;
      --tl-h: 184px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.4;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    #app-shell {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr) var(--tl-h);
      grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-app);
    }

    #app-shell.hide-left { grid-template-columns: 0px minmax(0, 1fr) var(--right-w); }
    #app-shell.hide-right { grid-template-columns: var(--left-w) minmax(0, 1fr) 0px; }
    #app-shell.hide-left.hide-right { grid-template-columns: 0px minmax(0, 1fr) 0px; }
    #app-shell.hide-timeline { grid-template-rows: 44px minmax(0, 1fr) 0px; }

    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 40;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .v-sep {
      width: 1px;
      height: 16px;
      background: var(--border-hairline);
      margin: 0 2px;
    }

    .seg-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      background: var(--bg-app);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    button, select, input, textarea {
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 28px;
      padding: 0 9px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .btn:hover:not(:disabled) {
      background: var(--bg-control-hover);
      border-color: var(--border-hairline);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .seg-pill .btn {
      height: 24px;
      padding: 0 8px;
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-xs);
    }
    .seg-pill .btn:hover { color: var(--text-primary); }
    .seg-pill .btn.active,
    .btn.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
      color: #c7d2fe;
    }
    .btn.primary {
      background: var(--accent);
      border-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .btn.primary:hover { background: #5558e6; }
    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn.ghost:hover {
      background: var(--bg-control);
      color: var(--text-primary);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .btn-sm {
      height: 24px;
      padding: 0 7px;
      font-size: 11px;
    }
    .btn-ico {
      width: 28px;
      padding: 0;
    }
    .btn-ico-sm {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn-ico-sm:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    svg.ico {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    svg.ico-xs {
      width: 12px;
      height: 12px;
    }

    .dropdown {
      position: relative;
      display: inline-flex;
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      min-width: 196px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 80;
    }
    .dropdown-menu.right { left: auto; right: 0; }
    .dropdown.open .dropdown-menu { display: flex; }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 6px 8px;
      background: transparent;
      border: none;
      border-radius: var(--radius-xs);
      color: var(--text-primary);
      font-size: 11.5px;
      text-align: left;
      cursor: pointer;
    }
    .menu-item:hover { background: var(--bg-control-hover); }
    .menu-item .k { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
    .menu-sep { height: 1px; background: var(--border-subtle); margin: 3px 0; }

    #left-panel, #right-panel {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      z-index: 20;
    }
    #left-panel { border-right: 1px solid var(--border-subtle); }
    #right-panel { border-left: 1px solid var(--border-subtle); }

    .panel-tabs {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 4px;
      flex-shrink: 0;
    }
    .panel-tab {
      flex: 1;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-xs);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .panel-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
    .panel-tab.active {
      background: var(--bg-control);
      color: var(--text-primary);
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .layer-row:hover { background: var(--bg-elevated); border-color: var(--border-subtle); }
    .layer-row.selected {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
    }
    .layer-row.drag-over { border-top: 2px solid var(--accent); }
    .layer-name {
      flex: 1;
      min-width: 0;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .layer-actions {
      display: flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }

    .media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .media-card {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .media-card:hover { border-color: var(--accent); }
    .media-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #09090d;
      object-fit: cover;
      display: block;
    }
    .media-meta {
      padding: 5px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .media-title {
      font-size: 10.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .media-del {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .media-del:hover { color: #fca5a5; border-color: var(--danger); }

    #stage-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #060608;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
      touch-action: none;
    }

    #stage-viewport {
      position: relative;
      background: #000000;
      border: 1px solid var(--border-hairline);
      flex-shrink: 0;
    }

    #ref-photo-img, #gl-canvas, #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ref-photo-img {
      object-fit: cover;
      opacity: 0.42;
      pointer-events: none;
      display: none;
    }
    #overlay-canvas { pointer-events: auto; }

    #stage-hud {
      position: absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 15;
    }
    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: var(--radius-md);
      background: rgba(14, 14, 18, 0.92);
      border: 1px solid var(--border-hairline);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .sec-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 8px;
    }
    .sec-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    .lbl {
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10.5px;
      color: var(--text-primary);
      min-width: 36px;
      text-align: right;
    }

    .inp {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      color: var(--text-primary);
    }
    .inp:hover { border-color: var(--border-hairline); }
    .inp:focus { border-color: var(--accent); }
    textarea.inp {
      height: auto;
      padding: 6px 8px;
      resize: vertical;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: var(--bg-control-hover);
      border-radius: 2px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--text-primary);
      border: 1.5px solid var(--accent);
      cursor: ew-resize;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 20px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 2px;
      background: var(--bg-app);
      padding: 2px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      margin-bottom: 8px;
    }
    .seg button {
      height: 23px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-xs);
      cursor: pointer;
    }
    .seg button:hover { color: var(--text-primary); }
    .seg button.active {
      background: var(--bg-control-hover);
      color: var(--text-primary);
    }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }

    .shader-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      max-height: 176px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
    .shader-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      font-size: 11px;
    }
    .shader-card:hover { background: var(--bg-control-hover); border-color: var(--border-hairline); }
    .shader-card.active {
      border-color: rgba(99, 102, 241, 0.6);
      background: var(--accent-soft);
      color: #c7d2fe;
    }
    .shader-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .win-preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-height: 190px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
    .win-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px 3px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .win-card:hover { background: var(--bg-control-hover); border-color: var(--border-hairline); }
    .win-card.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.6);
      color: #c7d2fe;
    }
    .win-card span {
      font-size: 9.5px;
      text-align: center;
      line-height: 1.15;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #timeline-panel {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      z-index: 25;
    }

    #tl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    #tl-workspace {
      display: grid;
      grid-template-columns: 164px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #tl-headers {
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }
    .tl-ruler-corner {
      height: 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .tl-track-hdr {
      height: 34px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
      cursor: pointer;
    }
    .tl-track-hdr.selected {
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    #tl-scroll {
      position: relative;
      overflow: auto;
      background: #09090c;
    }

    #tl-canvas-inner {
      position: relative;
      min-height: 100%;
    }

    #tl-ruler {
      position: sticky;
      top: 0;
      height: 24px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      cursor: ew-resize;
      z-index: 10;
    }

    .cue-flag {
      position: absolute;
      top: 2px;
      height: 18px;
      padding: 0 6px;
      background: #f59e0b;
      color: #09090b;
      font-size: 10px;
      font-weight: 600;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      z-index: 12;
    }

    .tl-lane {
      position: relative;
      height: 34px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .tl-clip {
      position: absolute;
      top: 4px;
      height: 26px;
      background: rgba(99, 102, 241, 0.24);
      border: 1px solid rgba(99, 102, 241, 0.55);
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 7px;
      font-size: 10.5px;
      color: #e0e7ff;
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
    }
    .tl-clip.selected {
      background: rgba(99, 102, 241, 0.38);
      border-color: #a5b4fc;
    }
    .tl-clip-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: ew-resize;
    }
    .tl-clip-handle.l { left: 0; }
    .tl-clip-handle.r { right: 0; }
    .tl-clip-handle:hover { background: rgba(255, 255, 255, 0.35); }

    #tl-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: #ef4444;
      pointer-events: none;
      z-index: 20;
    }
    #tl-playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -4.5px;
      width: 10px;
      height: 10px;
      background: #ef4444;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

        const SHADERS = [

            c1: '#93c5fd', c2: '#090f1d', c3: '#f59e0b',
            glsl: [
              'float N13(float p){ vec3 p3=fract(vec3(p)*vec3(.1031,.11369,.13787)); p3+=dot(p3,p3.yzx+19.19); return fract((p3.x+p3.y)*p3.z); }',
              'vec2 DropLayer(vec2 uv, float t){',
              '  vec2 UV = uv; uv.y -= t * 0.72; vec2 a = vec2(6.0, 1.0); vec2 grid = a * 2.0;',
              '  vec2 id = floor(uv * grid); uv.y -= N13(id.x * 35.2); id = floor(uv * grid);',

              '  float x = (N13(id.x * 13.7 + id.y * 91.3) - 0.5) * 0.72;',

          let points = [];
          if (customPts && customPts.length >= 3) {
            points = customPts.map(function (p) { return { x: Math.round(p.x), y: Math.round(p.y) }; });
          } else {
            points = [
              { x: Math.round(cx - rw * 0.5), y: Math.round(cy - rh * 0.5) },
              { x: Math.round(cx + rw * 0.5), y: Math.round(cy - rh * 0.5) },
              { x: Math.round(cx + rw * 0.5), y: Math.round(cy + rh * 0.5) },
              { x: Math.round(cx - rw * 0.5), y: Math.round(cy + rh * 0.5) }

        const DB_NAME = 'MaptorMediaStore';
        const DB_STORE = 'files';
        let dbInstance = null;
        const blobUrlCache = new Map();

        function openMediaDB() {
          return new Promise(function (resolve) {
            if (dbInstance) return resolve(dbInstance);
            try {
              const req = indexedDB.open(DB_NAME, 1);
              req.onupgradeneeded = function (e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_STORE)) {
                  db.createObjectStore(DB_STORE, { keyPath: 'id' });
                }
              };
              req.onsuccess = function (e) {
                dbInstance = e.target.result;
                resolve(dbInstance);
              };
              req.onerror = function () { resolve(null); };
            } catch (e) { resolve(null); }
          });
        }

        async function saveFileToDB(id, file, meta) {
          const db = await openMediaDB();
          if (!db) return;
          try {
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put({ id: id, blob: file, meta: meta });
          } catch (e) {}
        }

        async function removeFileFromDB(id) {
          const db = await openMediaDB();
          if (!db) return;
          try {
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).delete(id);
          } catch (e) {}
        }

        async function hydrateMediaFromDB() {
          const db = await openMediaDB();
          if (!db) return;
          try {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).getAll();
            req.onsuccess = function () {
              const items = req.result || [];
              let changed = false;
              items.forEach(function (rec) {
                if (rec && rec.id && rec.blob) {
                  if (!blobUrlCache.has(rec.id)) {
                    blobUrlCache.set(rec.id, URL.createObjectURL(rec.blob));
                  }
                  if (rec.meta && !state.mediaBin.some(function (m) { return m.id === rec.id; })) {
                    state.mediaBin.push(rec.meta);
                    changed = true;
                  }
                }
              });
              if (changed || items.length) {
                renderLeftPanel();
                ui.projectorDirty = true;
              }
            };
          } catch (e) {}
        }

        function generateMediaThumbnail(file, objUrl) {
          return new Promise(function (resolve) {
            const cvs = document.createElement('canvas');
            cvs.width = 240;
            cvs.height = 135;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#0c0c12';
            ctx.fillRect(0, 0, 240, 135);

            if (file.type.startsWith('image/')) {
              const img = new Image();
              img.onload = function () {
                ctx.drawImage(img, 0, 0, 240, 135);
                resolve(cvs.toDataURL('image/jpeg', 0.72));
              };
              img.onerror = function () { resolve(''); };
              img.src = objUrl;
            } else {
              const vid = document.createElement('video');
              vid.muted = true;
              vid.playsInline = true;
              vid.preload = 'metadata';
              vid.onloadeddata = function () {
                vid.currentTime = Math.min(0.5, (vid.duration || 1) * 0.1);
              };
              vid.onseeked = function () {
                try { ctx.drawImage(vid, 0, 0, 240, 135); } catch (e) {}
                vid.src = '';
                resolve(cvs.toDataURL('image/jpeg', 0.72));
              };
              vid.onerror = function () { resolve(''); };
              vid.src = objUrl;
            }
          });
        }

        const mediaCache = new Map();
        const textCache = new Map();
        let webcamStream = null;
        let webcamVideo = null;

        async function startWebcamStream() {
          if (webcamStream && webcamVideo) return webcamVideo;
          try {
            webcamStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
            webcamVideo = document.createElement('video');
            webcamVideo.srcObject = webcamStream;
            webcamVideo.muted = true;
            webcamVideo.playsInline = true;
            await webcamVideo.play();
            ui.projectorDirty = true;
            syncProjector(true);
            return webcamVideo;
          } catch (e) {
            showToast('Camera access denied or unavailable');
            return null;
          }
        }

        function getTypographyCanvas(layer) {
          const key = JSON.stringify([
            layer.text, layer.fontFamily, layer.fontWeight, layer.fontSize,
            layer.letterSpacing, layer.lineHeight, layer.textAlign,
            layer.textColor, layer.textBg, layer.textShadow
          ]);
          const cached = textCache.get(layer.id);
          if (cached && cached.key === key) return cached.canvas;

          ensureGoogleFont(layer.fontFamily);
          const cvs = cached ? cached.canvas : document.createElement('canvas');
          cvs.width = 1600;
          cvs.height = 1000;
          const ctx = cvs.getContext('2d');
          ctx.clearRect(0, 0, 1600, 1000);

          if (layer.textBg && layer.textBg !== 'transparent') {
            ctx.fillStyle = layer.textBg;
            ctx.fillRect(0, 0, 1600, 1000);
          }

          const lines = String(layer.text || '').split('\n');
          const fs = Math.max(14, Number(layer.fontSize) || 96);
          const lh = fs * (Number(layer.lineHeight) || 1.1);
          ctx.font = (layer.fontWeight || '600') + ' ' + fs + 'px "' + (layer.fontFamily || 'Inter') + '", sans-serif';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = layer.textColor || '#ffffff';

          if (layer.textShadow > 0) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = Number(layer.textShadow) * 1.4;
            ctx.shadowOffsetY = Math.round(Number(layer.textShadow) * 0.3);
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          const startY = (1000 - lines.length * lh) * 0.5 + lh * 0.5;
          const anchorX = layer.textAlign === 'left' ? 120 : layer.textAlign === 'right' ? 1480 : 800;

          lines.forEach(function (line, idx) {
            const y = startY + idx * lh;
            const sp = Number(layer.letterSpacing) || 0;
            if (sp === 0) {
              ctx.textAlign = layer.textAlign || 'center';
              ctx.fillText(line, anchorX, y);
            } else {
              const chars = Array.from(line);
              const widths = chars.map(function (ch) { return ctx.measureText(ch).width; });
              const totalW = widths.reduce(function (a, b) { return a + b; }, 0) + Math.max(0, chars.length - 1) * sp;
              let cx = anchorX;
              if (layer.textAlign === 'center') cx = anchorX - totalW * 0.5;
              if (layer.textAlign === 'right') cx = anchorX - totalW;
              ctx.textAlign = 'left';
              chars.forEach(function (ch, ci) {
                ctx.fillText(ch, cx, y);
                cx += widths[ci] + sp;
              });
            }
          });

          textCache.set(layer.id, { canvas: cvs, key: key });
          return cvs;
        }

        function getLayerSourceMedia(layer) {
          if (layer.sourceType === 'text') {
            return { el: getTypographyCanvas(layer), ready: true, w: 1600, h: 1000 };
          }
          if (layer.sourceType === 'webcam') {
            if (!webcamVideo) {
              startWebcamStream();
              return null;
            }
            return {
              el: webcamVideo,
              ready: webcamVideo.readyState >= 2,
              w: webcamVideo.videoWidth || 1280,
              h: webcamVideo.videoHeight || 720
            };
          }
          if (layer.sourceType !== 'media' || !layer.mediaId) return null;

          const url = blobUrlCache.get(layer.mediaId);
          if (!url) return null;

        function buildLiveLayersSnapshot() {
          const t = ui.playheadSec;
          return state.layers.map(function (l) {
            const copy = cloneObj(l);
            if (copy.mediaId) {
              copy.mediaUrl = blobUrlCache.get(copy.mediaId) || '';
            }
            if (!Array.isArray(copy.clips) || !copy.clips.length) return copy;
            const activeClip = copy.clips.find(function (c) { return t >= c.start && t <= (c.start + c.duration); });
            if (!activeClip) {
              copy.visible = false;
              return copy;
            }
            let fadeMul = 1.0;
            const fi = Number(activeClip.fadeIn) || 0;
            const fo = Number(activeClip.fadeOut) || 0;
            if (fi > 0.01 && (t - activeClip.start) < fi) {
              fadeMul *= Math.max(0, (t - activeClip.start) / fi);
            }
            if (fo > 0.01 && ((activeClip.start + activeClip.duration) - t) < fo) {
              fadeMul *= Math.max(0, ((activeClip.start + activeClip.duration) - t) / fo);
            }
            copy.opacity = (copy.opacity != null ? copy.opacity : 1) * fadeMul;
            return copy;
          });
        }

        let lastSyncTs = 0;
        function syncProjector(force) {
          const now = performance.now();
          if (!force && !ui.projectorDirty && now - lastSyncTs < 250) return;
          if (!force && now - lastSyncTs < 32) return;
          lastSyncTs = now;
          ui.projectorDirty = false;
          const payload = {
            width: state.width,
            height: state.height,
            xray: ui.xray,
            layers: buildLiveLayersSnapshot()
          };
          if (bc) {
            try { bc.postMessage(payload); } catch (e) {}
          }
          if (projectorWin && !projectorWin.closed) {
            try { projectorWin.postMessage(payload, '*'); } catch (e) {}
          }
          try {
            localStorage.setItem(LIVE_KEY, JSON.stringify(payload));
          } catch (e) {}
        }

        if (bc) {
          bc.onmessage = function (e) {
            if (e.data && e.data.type === 'PROJECTOR_READY') syncProjector(true);
          };
        }
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'PROJECTOR_READY') syncProjector(true);
        });

        function openProjectorWindow() {
          if (projectorWin && !projectorWin.closed) {
            projectorWin.focus();
            syncProjector(true);
            return;
          }
          const url = createProjectorBlobURL();
          const sw = window.screen ? window.screen.availWidth : 1920;
          const sh = window.screen ? window.screen.availHeight : 1080;
          projectorWin = window.open(url, 'MaptorProjectorOutput', 'popup=yes,left=0,top=0,width=' + sw + ',height=' + sh + ',menubar=no,toolbar=no,location=no,status=no,scrollbars=no');
          if (!projectorWin) {
            showToast('Allow popups to open Projector Output');
            return;
          }
          setTimeout(function () { syncProjector(true); }, 120);
          setTimeout(function () { syncProjector(true); }, 450);
          showToast('Projector Output Opened');
        }

        const stageWrap = document.getElementById('stage-wrap');
        const stageViewport = document.getElementById('stage-viewport');
        const glCanvas = document.getElementById('gl-canvas');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const renderer = createFastRenderer(glCanvas);

        function resizeCanvas() {
          const rect = stageWrap.getBoundingClientRect();
          const pad = 36;
          const availW = Math.max(120, rect.width - pad);
          const availH = Math.max(120, rect.height - pad);
          const fitScale = Math.min(availW / state.width, availH / state.height);
          if (!ui.zoomManual) ui.zoom = fitScale;

          const dispW = Math.max(1, Math.round(state.width * ui.zoom));
          const dispH = Math.max(1, Math.round(state.height * ui.zoom));
          stageViewport.style.width = dispW + 'px';
          stageViewport.style.height = dispH + 'px';
          overlayCanvas.width = state.width;
          overlayCanvas.height = state.height;

          document.getElementById('hud-res').textContent = state.width + '×' + state.height;
          document.getElementById('hud-zoom').textContent = Math.round((ui.zoom / fitScale) * 100) + '%';
          ui.overlayDirty = true;
        }

        if ('ResizeObserver' in window) {
          new ResizeObserver(resizeCanvas).observe(stageWrap);
        }
        window.addEventListener('resize', resizeCanvas);

        function getSelectedLayer() {
          return state.layers.find(function (l) { return l.id === state.selectedLayerId; }) || null;
        }

        function getBounds(layer) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          layer.points.forEach(function (p) {
            if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
          });
          return {
            minX: minX, minY: minY, maxX: maxX, maxY: maxY,
            w: Math.max(1, maxX - minX),
            h: Math.max(1, maxY - minY),
            cx: (minX + maxX) * 0.5,
            cy: (minY + maxY) * 0.5
          };
        }

        function toStagePt(clientX, clientY) {
          const r = stageViewport.getBoundingClientRect();
          return {
            x: ((clientX - r.left) / Math.max(1, r.width)) * state.width,
            y: ((clientY - r.top) / Math.max(1, r.height)) * state.height
          };
        }

        function pointInPoly(pt, poly) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const hit = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-6) + xi);
            if (hit) inside = !inside;
          }
          return inside;
        }

        function distSeg(p, a, b) {
          const l2 = (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
          if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
          const t = Math.max(0, Math.min(1, ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2));
          return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
        }

        function snapPoint(x, y) {
          if (!ui.snap) return { x: x, y: y };
          const step = 10;
          let sx = Math.round(x / step) * step;
          let sy = Math.round(y / step) * step;
          if (Math.abs(x - state.width * 0.5) < 12) sx = state.width * 0.5;
          if (Math.abs(y - state.height * 0.5) < 12) sy = state.height * 0.5;
          return { x: sx, y: sy };
        }

        function snapDelta(origPts, rawDx, rawDy) {
          if (!ui.snap) return { dx: rawDx, dy: rawDy };
          const step = 10;
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          origPts.forEach(function (p) {
            if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
          });
          const cx = (minX + maxX) * 0.5 + rawDx;
          const cy = (minY + maxY) * 0.5 + rawDy;
          let dx = Math.round((minX + rawDx) / step) * step - minX;
          let dy = Math.round((minY + rawDy) / step) * step - minY;
          if (Math.abs(cx - state.width * 0.5) < 12) dx = state.width * 0.5 - (minX + maxX) * 0.5;
          if (Math.abs(cy - state.height * 0.5) < 12) dy = state.height * 0.5 - (minY + maxY) * 0.5;
          return { dx: dx, dy: dy };
        }

        function getBoxHandles(b) {
          return [
            { id: 'nw', x: b.minX, y: b.minY, cur: 'nwse-resize' },
            { id: 'n',  x: b.cx,   y: b.minY, cur: 'ns-resize' },
            { id: 'ne', x: b.maxX, y: b.minY, cur: 'nesw-resize' },
            { id: 'e',  x: b.maxX, y: b.cy,   cur: 'ew-resize' },
            { id: 'se', x: b.maxX, y: b.maxY, cur: 'nwse-resize' },
            { id: 's',  x: b.cx,   y: b.maxY, cur: 'ns-resize' },
            { id: 'sw', x: b.minX, y: b.maxY, cur: 'nesw-resize' },
            { id: 'w',  x: b.minX, y: b.cy,   cur: 'ew-resize' },
            { id: 'rot', x: b.cx,  y: b.minY - 30, cur: 'grab' }
          ];
        }

        function hitTestHandles(pt) {
          const hitR = 14 / Math.max(0.3, ui.zoom);
          if (ui.tool === 'pen') return { type: 'pen', cur: 'crosshair' };
          const sel = getSelectedLayer();
          if (sel && !sel.locked && sel.visible) {
            if (ui.tool === 'box') {
              const b = getBounds(sel);
              const handles = getBoxHandles(b);
              for (let i = 0; i < handles.length; i++) {
                if (Math.hypot(pt.x - handles[i].x, pt.y - handles[i].y) <= hitR) {
                  return { type: handles[i].id === 'rot' ? 'rotate' : 'resize', handle: handles[i].id, cur: handles[i].cur };
                }
              }
            } else if (ui.tool === 'warp') {
              for (let i = 0; i < sel.points.length; i++) {
                if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
                  return { type: 'vertex', idx: i, cur: 'move' };
                }
              }
              for (let i = 0; i < sel.points.length; i++) {
                const a = sel.points[i];
                const b = sel.points[(i + 1) % sel.points.length];
                const mx = (a.x + b.x) * 0.5;
                const my = (a.y + b.y) * 0.5;
                if (Math.hypot(pt.x - mx, pt.y - my) <= hitR) {
                  return { type: 'edge', edgeIdx: i, cur: 'pointer' };
                }
              }
              const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
              if (sel.points.length === 4 && sub > 1) {
                const pts = sel.points;
                for (let gy = 0; gy <= sub; gy++) {
                  for (let gx = 0; gx <= sub; gx++) {
                    if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                    const u = gx / sub, v = gy / sub;
                    const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                    const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                    const idx = gy * (sub + 1) + gx;
                    const off = (sel.meshOffsets || [])[idx] || { x: 0, y: 0 };
                    const mx = top.x + (bot.x - top.x) * v + off.x;
                    const my = top.y + (bot.y - top.y) * v + off.y;
                    if (Math.hypot(pt.x - mx, pt.y - my) <= hitR) {
                      return { type: 'mesh', idx: idx, cur: 'move' };
                    }
                  }
                }
              }
            }
          }
          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            if (!l.visible) continue;
            const b = getBounds(l);
            const inBox = pt.x >= b.minX - 6 && pt.x <= b.maxX + 6 && pt.y >= b.minY - 6 && pt.y <= b.maxY + 6;
            if (pointInPoly(pt, l.points) || (ui.tool === 'box' && inBox)) {
              return { type: 'layer', layer: l, cur: l.locked ? 'not-allowed' : 'move' };
            }
          }
          return { type: 'none', cur: 'default' };
        }

        overlayCanvas.addEventListener('pointerdown', function (e) {
          closeAllMenus();
          if (e.button === 2) return;
          const pt = toStagePt(e.clientX, e.clientY);
          const hitR = 14 / Math.max(0.3, ui.zoom);

          if (ui.tool === 'pen') {
            if (ui.penPoints.length >= 3 && Math.hypot(pt.x - ui.penPoints[0].x, pt.y - ui.penPoints[0].y) < hitR * 1.4) {
              commitPenPolygon();
              return;
            }
            const sp = snapPoint(pt.x, pt.y);
            ui.penPoints.push({ x: Math.round(sp.x), y: Math.round(sp.y) });
            ui.overlayDirty = true;
            return;
          }

          const hit = hitTestHandles(pt);
          const sel = getSelectedLayer();

          if (hit.type === 'resize' || hit.type === 'rotate') {
            pushHistory();
            overlayCanvas.setPointerCapture(e.pointerId);
            ui.dragging = {
              mode: hit.type,
              handle: hit.handle,
              startPt: pt,
              origPts: sel.points.map(function (p) { return { x: p.x, y: p.y }; }),
              origBounds: getBounds(sel)
            };
            return;
          }
          if (hit.type === 'vertex') {
            pushHistory();
            ui.activeVertex = hit.idx;
            overlayCanvas.setPointerCapture(e.pointerId);
            ui.dragging = { mode: 'vertex', vIdx: hit.idx, startPt: pt, origPt: { x: sel.points[hit.idx].x, y: sel.points[hit.idx].y } };
            ui.overlayDirty = true;
            renderInspector();
            return;
          }
          if (hit.type === 'edge') {
            pushHistory();
            overlayCanvas.setPointerCapture(e.pointerId);
            const i1 = hit.edgeIdx;
            const i2 = (hit.edgeIdx + 1) % sel.points.length;
            ui.dragging = {
              mode: 'edge',
              i1: i1,
              i2: i2,
              startPt: pt,
              p1: { x: sel.points[i1].x, y: sel.points[i1].y },
              p2: { x: sel.points[i2].x, y: sel.points[i2].y }
            };
            return;
          }
          if (hit.type === 'mesh') {
            pushHistory();
            overlayCanvas.setPointerCapture(e.pointerId);
            if (!sel.meshOffsets) sel.meshOffsets = [];
            if (!sel.meshOffsets[hit.idx]) sel.meshOffsets[hit.idx] = { x: 0, y: 0 };
            ui.dragging = { mode: 'mesh', idx: hit.idx, startPt: pt, origOff: { x: sel.meshOffsets[hit.idx].x, y: sel.meshOffsets[hit.idx].y } };
            return;
          }
          if (hit.type === 'layer') {
            const l = hit.layer;
            const isSameLayer = l.id === state.selectedLayerId;
            state.selectedLayerId = l.id;
            if (!isSameLayer) ui.activeVertex = -1;
            ui.overlayDirty = true;
            renderLeftPanel();
            renderInspector();
            renderTimeline();
            if (!l.locked) {
              pushHistory();
              overlayCanvas.setPointerCapture(e.pointerId);
              ui.dragging = {
                mode: 'move',
                startPt: pt,
                origPts: l.points.map(function (p) { return { x: p.x, y: p.y }; })
              };
            }
            return;
          }

          state.selectedLayerId = null;
          ui.activeVertex = -1;
          ui.overlayDirty = true;
          renderLeftPanel();
          renderInspector();
          renderTimeline();
        });

        overlayCanvas.addEventListener('pointermove', function (e) {
          const pt = toStagePt(e.clientX, e.clientY);
          if (!ui.dragging) {
            const hit = hitTestHandles(pt);
            overlayCanvas.style.cursor = hit.cur;
            const prevH = ui.hoverHandle;
            ui.hoverHandle = hit.type !== 'none' && hit.type !== 'layer' ? hit : null;
            if (Boolean(prevH) !== Boolean(ui.hoverHandle)) ui.overlayDirty = true;
            return;
          }
          const sel = getSelectedLayer();
          if (!sel) return;
          const dx = pt.x - ui.dragging.startPt.x;
          const dy = pt.y - ui.dragging.startPt.y;

          if (ui.dragging.mode === 'move') {
            const sn = snapDelta(ui.dragging.origPts, dx, dy);
            sel.points = ui.dragging.origPts.map(function (p) {
              return { x: Math.round(p.x + sn.dx), y: Math.round(p.y + sn.dy) };
            });
          } else if (ui.dragging.mode === 'vertex') {
            const sn = snapPoint(ui.dragging.origPt.x + dx, ui.dragging.origPt.y + dy);
            sel.points[ui.dragging.vIdx] = { x: Math.round(sn.x), y: Math.round(sn.y) };
          } else if (ui.dragging.mode === 'edge') {
            const sn = snapDelta([ui.dragging.p1, ui.dragging.p2], dx, dy);
            sel.points[ui.dragging.i1] = { x: Math.round(ui.dragging.p1.x + sn.dx), y: Math.round(ui.dragging.p1.y + sn.dy) };
            sel.points[ui.dragging.i2] = { x: Math.round(ui.dragging.p2.x + sn.dx), y: Math.round(ui.dragging.p2.y + sn.dy) };
          } else if (ui.dragging.mode === 'mesh') {
            sel.meshOffsets[ui.dragging.idx] = {
              x: Math.round(ui.dragging.origOff.x + dx),
              y: Math.round(ui.dragging.origOff.y + dy)
            };
          } else if (ui.dragging.mode === 'rotate') {
            const b = ui.dragging.origBounds;
            const a0 = Math.atan2(ui.dragging.startPt.y - b.cy, ui.dragging.startPt.x - b.cx);
            const a1 = Math.atan2(pt.y - b.cy, pt.x - b.cx);
            let da = a1 - a0;
            if (e.shiftKey) da = Math.round(da / (Math.PI / 12)) * (Math.PI / 12);
            const c = Math.cos(da), s = Math.sin(da);
            sel.points = ui.dragging.origPts.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
          } else if (ui.dragging.mode === 'resize') {
            const b = ui.dragging.origBounds;
            const h = ui.dragging.handle;
            let nMinX = b.minX, nMaxX = b.maxX, nMinY = b.minY, nMaxY = b.maxY;
            if (h.indexOf('w') !== -1) nMinX = Math.min(b.maxX - 16, b.minX + dx);
            if (h.indexOf('e') !== -1) nMaxX = Math.max(b.minX + 16, b.maxX + dx);
            if (h.indexOf('n') !== -1) nMinY = Math.min(b.maxY - 16, b.minY + dy);
            if (h.indexOf('s') !== -1) nMaxY = Math.max(b.minY + 16, b.maxY + dy);
            if (ui.snap) {
              if (h.indexOf('w') !== -1) nMinX = Math.round(nMinX / 10) * 10;
              if (h.indexOf('e') !== -1) nMaxX = Math.round(nMaxX / 10) * 10;
              if (h.indexOf('n') !== -1) nMinY = Math.round(nMinY / 10) * 10;
              if (h.indexOf('s') !== -1) nMaxY = Math.round(nMaxY / 10) * 10;
            }
            if (e.shiftKey) {
              const asp = b.w / b.h;
              const cw = nMaxX - nMinX, ch = nMaxY - nMinY;
              if (cw / ch > asp) {
                const tw = ch * asp;
                if (h.indexOf('w') !== -1) nMinX = nMaxX - tw; else nMaxX = nMinX + tw;
              } else {
                const th = cw / asp;
                if (h.indexOf('n') !== -1) nMinY = nMaxY - th; else nMaxY = nMinY + th;
              }
            }
            sel.points = ui.dragging.origPts.map(function (p) {
              const ux = (p.x - b.minX) / b.w;
              const uy = (p.y - b.minY) / b.h;
              return { x: Math.round(nMinX + ux * (nMaxX - nMinX)), y: Math.round(nMinY + uy * (nMaxY - nMinY)) };
            });
          }
          ui.overlayDirty = true;
          ui.projectorDirty = true;
          syncProjector(false);
        });

        overlayCanvas.addEventListener('pointerup', function () {
          if (ui.dragging) {
            ui.dragging = null;
            ui.overlayDirty = true;
            renderInspector();
            saveProjectState();
          }
        });

        overlayCanvas.addEventListener('dblclick', function (e) {
          if (ui.tool === 'pen') {
            commitPenPolygon();
            return;
          }
          if (ui.tool !== 'warp') return;
          const sel = getSelectedLayer();
          if (!sel || sel.locked) return;
          const pt = toStagePt(e.clientX, e.clientY);
          const hitR = 16 / Math.max(0.3, ui.zoom);
          for (let i = 0; i < sel.points.length; i++) {
            const a = sel.points[i];
            const b = sel.points[(i + 1) % sel.points.length];
            if (distSeg(pt, a, b) <= hitR) {
              pushHistory();
              sel.points.splice(i + 1, 0, { x: Math.round(pt.x), y: Math.round(pt.y) });
              sel.meshSubdiv = 1;
              sel.meshOffsets = [];
              ui.overlayDirty = true;
              ui.projectorDirty = true;
              renderInspector();
              saveProjectState();
              showToast('Inserted vertex');
              return;
            }
          }
        });

        overlayCanvas.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          const pt = toStagePt(e.clientX, e.clientY);
          const hit = hitTestHandles(pt);
          if (hit.type === 'layer') {
            state.selectedLayerId = hit.layer.id;
            renderLeftPanel();
            renderInspector();
          }
          const sel = getSelectedLayer();
          if (!sel) return;
          const menu = document.getElementById('stage-ctx-menu');
          menu.style.left = Math.min(window.innerWidth - 200, e.clientX) + 'px';
          menu.style.top = Math.min(window.innerHeight - 220, e.clientY) + 'px';
          menu.style.display = 'flex';
        });

        function commitPenPolygon() {
          if (ui.penPoints.length >= 3) {
            pushHistory();
            const poly = createLayer('polygon', 'Polygon Surface', ui.penPoints);
            state.layers.push(poly);
            state.selectedLayerId = poly.id;
            showToast('Polygon created');
          }
          ui.penPoints = [];
          setTool('warp');
          fullUIRefresh();
          saveProjectState();
        }

        function drawOverlay() {
          ui.overlayDirty = false;
          const W = state.width, H = state.height;
          overlayCtx.clearRect(0, 0, W, H);
          const invZ = 1 / Math.max(0.25, ui.zoom);

          if (ui.showGrid) {
            overlayCtx.save();
            overlayCtx.strokeStyle = 'rgba(99, 102, 241, 0.32)';
            overlayCtx.lineWidth = 1.1 * invZ;
            overlayCtx.beginPath();
            overlayCtx.moveTo(W * 0.5, 0); overlayCtx.lineTo(W * 0.5, H);
            overlayCtx.moveTo(0, H * 0.5); overlayCtx.lineTo(W, H * 0.5);
            overlayCtx.stroke();
            overlayCtx.restore();
          }

          state.layers.forEach(function (l) {
            if (!l.visible) return;
            const isSel = l.id === state.selectedLayerId;
            if (!isSel) {
              overlayCtx.save();
              overlayCtx.strokeStyle = l.kind === 'mask' ? 'rgba(239, 68, 68, 0.45)' : 'rgba(255, 255, 255, 0.18)';
              overlayCtx.lineWidth = 1.2 * invZ;
              overlayCtx.beginPath();
              l.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
              overlayCtx.closePath();
              overlayCtx.stroke();
              overlayCtx.restore();
            }
          });

          const sel = getSelectedLayer();
          if (sel && sel.visible) {
            const col = sel.kind === 'mask' ? '#ef4444' : '#6366f1';
            overlayCtx.save();
            overlayCtx.strokeStyle = col;
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            sel.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.closePath();
            overlayCtx.stroke();

            if (!sel.locked) {
              if (ui.tool === 'box') {
                const b = getBounds(sel);
                overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.85)';
                overlayCtx.setLineDash([5 * invZ, 4 * invZ]);
                overlayCtx.strokeRect(b.minX, b.minY, b.w, b.h);
                overlayCtx.setLineDash([]);
                overlayCtx.beginPath();
                overlayCtx.moveTo(b.cx, b.minY);
                overlayCtx.lineTo(b.cx, b.minY - 30);
                overlayCtx.stroke();

                const hs = 5 * invZ;
                getBoxHandles(b).forEach(function (h) {
                  overlayCtx.fillStyle = '#ffffff';
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 1.8 * invZ;
                  overlayCtx.beginPath();
                  if (h.id === 'rot') overlayCtx.arc(h.x, h.y, hs * 1.15, 0, Math.PI * 2);
                  else overlayCtx.rect(h.x - hs, h.y - hs, hs * 2, hs * 2);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              } else if (ui.tool === 'warp') {
                const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
                if (sel.points.length === 4 && sub > 1) {
                  const pts = sel.points;
                  const gp = function (gx, gy) {
                    const u = gx / sub, v = gy / sub;
                    const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                    const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                    const off = (sel.meshOffsets || [])[gy * (sub + 1) + gx] || { x: 0, y: 0 };
                    return { x: top.x + (bot.x - top.x) * v + off.x, y: top.y + (bot.y - top.y) * v + off.y };
                  };
                  overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
                  overlayCtx.lineWidth = 1 * invZ;
                  for (let gy = 0; gy <= sub; gy++) {
                    overlayCtx.beginPath();
                    for (let gx = 0; gx <= sub; gx++) { const p = gp(gx, gy); if (gx === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); }
                    overlayCtx.stroke();
                  }
                  for (let gx = 0; gx <= sub; gx++) {
                    overlayCtx.beginPath();
                    for (let gy = 0; gy <= sub; gy++) { const p = gp(gx, gy); if (gy === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); }
                    overlayCtx.stroke();
                  }
                  for (let gy = 0; gy <= sub; gy++) {
                    for (let gx = 0; gx <= sub; gx++) {
                      if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                      const p = gp(gx, gy);
                      overlayCtx.fillStyle = '#818cf8';
                      overlayCtx.beginPath(); overlayCtx.arc(p.x, p.y, 4 * invZ, 0, Math.PI * 2); overlayCtx.fill();
                    }
                  }
                }
                for (let i = 0; i < sel.points.length; i++) {
                  const a = sel.points[i];
                  const b = sel.points[(i + 1) % sel.points.length];
                  const mx = (a.x + b.x) * 0.5;
                  const my = (a.y + b.y) * 0.5;
                  overlayCtx.fillStyle = '#0f0f15';
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 1.6 * invZ;
                  const ms = 4 * invZ;
                  overlayCtx.fillRect(mx - ms, my - ms, ms * 2, ms * 2);
                  overlayCtx.strokeRect(mx - ms, my - ms, ms * 2, ms * 2);
                }
                sel.points.forEach(function (p, idx) {
                  const isAct = idx === ui.activeVertex;
                  overlayCtx.fillStyle = isAct ? '#f59e0b' : '#ffffff';
                  overlayCtx.strokeStyle = isAct ? '#ffffff' : col;
                  overlayCtx.lineWidth = (isAct ? 2.6 : 2.2) * invZ;
                  overlayCtx.beginPath();
                  overlayCtx.arc(p.x, p.y, (isAct ? 8 : 6.5) * invZ, 0, Math.PI * 2);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              }
            }
            overlayCtx.restore();
          }

          if (ui.tool === 'pen' && ui.penPoints.length > 0) {
            overlayCtx.save();
            overlayCtx.strokeStyle = '#10b981';
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            ui.penPoints.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.stroke();
            ui.penPoints.forEach(function (p, i) {
              overlayCtx.fillStyle = i === 0 ? '#10b981' : '#ffffff';
              overlayCtx.beginPath(); overlayCtx.arc(p.x, p.y, 5.5 * invZ, 0, Math.PI * 2); overlayCtx.fill();
            });
            overlayCtx.restore();
          }
        }

        function saveProjectState() {
          try { localStorage.setItem(ACTIVE_KEY, JSON.stringify(state)); } catch (e) {}
          ui.projectorDirty = true;
          syncProjector(false);
        }

        let dragLayerIdx = -1;

        function renderLeftPanel() {
          document.querySelectorAll('[data-side]').forEach(function (t) {
            t.classList.toggle('active', t.dataset.side === ui.sideTab);
          });
          const body = document.getElementById('left-body');
          body.innerHTML = '';

          if (ui.sideTab === 'media') {
            const topRow = document.createElement('div');
            topRow.className = 'row';
            topRow.innerHTML = '<button class="btn primary" id="btn-bin-import" style="width:100%;">+ Import Local Videos / Images</button>';
            body.appendChild(topRow);
            document.getElementById('btn-bin-import').onclick = function () { document.getElementById('file-media').click(); };

            if (!Array.isArray(state.mediaBin) || !state.mediaBin.length) {
              const empty = document.createElement('div');
              empty.style.cssText = 'padding:22px 10px;text-align:center;color:var(--text-muted);font-size:11px;';
              empty.textContent = 'Drop local videos or images anywhere on the window. Files stream directly from your drive without RAM bloat.';
              body.appendChild(empty);
              return;
            }

            const grid = document.createElement('div');
            grid.className = 'media-grid';
            state.mediaBin.forEach(function (m, mIdx) {
              const card = document.createElement('div');
              card.className = 'media-card';
              card.innerHTML =
                (m.thumb ? '<img class="media-thumb" src="' + m.thumb + '" alt="" />' : '<div class="media-thumb"></div>') +
                '<button class="media-del" title="Remove from Bin">✕</button>' +
                '<div class="media-meta"><span class="media-title" title="' + m.name + '">' + m.name + '</span></div>';

              card.querySelector('.media-del').onclick = function (e) {
                e.stopPropagation();
                state.mediaBin.splice(mIdx, 1);
                const u = blobUrlCache.get(m.id);
                if (u) { try { URL.revokeObjectURL(u); } catch (err) {} blobUrlCache.delete(m.id); }
                removeFileFromDB(m.id);
                renderLeftPanel();
                saveProjectState();
                showToast('Removed media from bin');
              };

              card.onclick = function () {
                assignMediaItemToSelected(m);
              };
              grid.appendChild(card);
            });
            body.appendChild(grid);
            return;
          }

          if (!state.layers.length) {
            body.innerHTML = '<div style="padding:24px 10px;text-align:center;color:var(--text-muted);font-size:11px;">Click Add Surface to begin.</div>';
            return;
          }

          const eyeOn = '<svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
          const eyeOff = '<svg class="ico ico-xs" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/></svg>';
          const lockOn = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
          const lockOff = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
          const dupSvg = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
          const delSvg = '<svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            const row = document.createElement('div');
            row.className = 'layer-row' + (l.id === state.selectedLayerId ? ' selected' : '');
            row.draggable = true;
            row.innerHTML =
              '<span class="layer-name" title="' + l.name + '" style="' + (!l.visible ? 'opacity:0.45;' : '') + (l.kind === 'mask' ? 'color:#fca5a5;' : '') + '">' + l.name + '</span>' +
              '<div class="layer-actions">' +
                '<button class="btn btn-ico-sm" data-a="vis" title="Visibility">' + (l.visible ? eyeOn : eyeOff) + '</button>' +
                '<button class="btn btn-ico-sm" data-a="lock" title="Lock">' + (l.locked ? lockOn : lockOff) + '</button>' +
                '<button class="btn btn-ico-sm" data-a="dup" title="Duplicate">' + dupSvg + '</button>' +
                '<button class="btn btn-ico-sm danger" data-a="del" title="Delete">' + delSvg + '</button>' +
              '</div>';

            row.addEventListener('dragstart', function () { dragLayerIdx = i; });
            row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('drag-over'); });
            row.addEventListener('dragleave', function () { row.classList.remove('drag-over'); });
            row.addEventListener('drop', function (e) {
              e.preventDefault();
              row.classList.remove('drag-over');
              if (dragLayerIdx >= 0 && dragLayerIdx !== i) {
                pushHistory();
                const moved = state.layers.splice(dragLayerIdx, 1)[0];
                state.layers.splice(i, 0, moved);
                ui.overlayDirty = true;
                ui.projectorDirty = true;
                renderLeftPanel();
                renderTimeline();
                saveProjectState();
              }
              dragLayerIdx = -1;
            });

            row.addEventListener('click', function (e) {
              const btn = e.target.closest('button');
              if (!btn) {
                state.selectedLayerId = l.id;
                ui.overlayDirty = true;
                renderLeftPanel();
                renderInspector();
                renderTimeline();
                return;
              }
              e.stopPropagation();
              const act = btn.dataset.a;
              pushHistory();
              if (act === 'vis') {
                l.visible = !l.visible;
              } else if (act === 'lock') {
                l.locked = !l.locked;
              } else if (act === 'dup') {
                const cp = cloneObj(l);
                cp.id = uid('lyr');
                cp.name = l.name + ' Copy';
                cp.points = cp.points.map(function (p) { return { x: p.x + 24, y: p.y + 24 }; });
                state.layers.splice(i + 1, 0, cp);
                state.selectedLayerId = cp.id;
              } else if (act === 'del') {
                state.layers.splice(i, 1);
                if (state.selectedLayerId === l.id) {
                  state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
                }
                showToast('Deleted "' + l.name + '"', true);
              }
              ui.overlayDirty = true;
              ui.projectorDirty = true;
              renderLeftPanel();
              renderInspector();
              renderTimeline();
              saveProjectState();
            });

            body.appendChild(row);
          }
        }

        function renderInspector() {
          document.querySelectorAll('[data-tab]').forEach(function (t) {
            t.classList.toggle('active', t.dataset.tab === ui.activeTab);
          });

          const body = document.getElementById('inspector-body');
          const sel = getSelectedLayer();

          if (!sel) {
            body.innerHTML = '<div style="padding:28px 12px;text-align:center;color:var(--text-muted);font-size:11.5px;">Select a surface or mask on the stage.</div>';
            return;
          }

          const b = getBounds(sel);

          if (ui.activeTab === 'surface') {
            const vertexCoordsHtml = sel.points.map(function (p, idx) {
              return '<div class="g2" style="margin-bottom:4px;">' +
                '<div style="display:flex;align-items:center;gap:4px;"><span class="mono" style="color:' + (idx === ui.activeVertex ? '#f59e0b' : 'var(--text-muted)') + ';width:22px;">P' + (idx + 1) + 'X</span><input type="number" step="0.5" class="inp mono" data-vx="' + idx + '" value="' + p.x + '" /></div>' +
                '<div style="display:flex;align-items:center;gap:4px;"><span class="mono" style="color:' + (idx === ui.activeVertex ? '#f59e0b' : 'var(--text-muted)') + ';width:22px;">P' + (idx + 1) + 'Y</span><input type="number" step="0.5" class="inp mono" data-vy="' + idx + '" value="' + p.y + '" /></div>' +
              '</div>';
            }).join('');

            body.innerHTML =
              '<div class="sec-card">' +
                '<div class="sec-title"><span>Surface Identity</span></div>' +
                '<div class="row"><input type="text" id="f-name" class="inp" value="' + sel.name.replace(/"/g, '&quot;') + '" /></div>' +
                '<div class="g2">' +
                  '<div><span class="lbl" style="font-size:10px;">X</span><input type="number" id="f-x" class="inp mono" value="' + Math.round(b.minX) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10px;">Y</span><input type="number" id="f-y" class="inp mono" value="' + Math.round(b.minY) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10px;">W</span><input type="number" id="f-w" class="inp mono" value="' + Math.round(b.w) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10px;">H</span><input type="number" id="f-h" class="inp mono" value="' + Math.round(b.h) + '" /></div>' +
                '</div>' +
              '</div>' +
              '<div class="sec-card">' +

        function bindInspectorHandlers(sel) {
          const on = function (id, ev, fn) { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
          const slider = function (id, key, fmt) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', function () {
              sel[key] = parseFloat(el.value);
              const vEl = el.parentElement.querySelector('.val');
              if (vEl) vEl.textContent = fmt(sel[key]);
              ui.projectorDirty = true;
              saveProjectState();
            });
          };

          on('f-name', 'input', function (e) {
            sel.name = e.target.value;
            renderLeftPanel();
            renderTimeline();
            saveProjectState();
          });

          const syncRectInputs = function () {
            pushHistory();
            const b = getBounds(sel);
            const nx = parseFloat(document.getElementById('f-x').value) || 0;
            const ny = parseFloat(document.getElementById('f-y').value) || 0;
            const nw = Math.max(12, parseFloat(document.getElementById('f-w').value) || b.w);
            const nh = Math.max(12, parseFloat(document.getElementById('f-h').value) || b.h);
            sel.points = sel.points.map(function (p) {
              return { x: Math.round(nx + ((p.x - b.minX) / b.w) * nw), y: Math.round(ny + ((p.y - b.minY) / b.h) * nh) };
            });
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          };
          ['f-x', 'f-y', 'f-w', 'f-h'].forEach(function (id) { on(id, 'change', syncRectInputs); });

          function scaleLayerBy(factor) {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) {
              return { x: Math.round(b.cx + (p.x - b.cx) * factor), y: Math.round(b.cy + (p.y - b.cy) * factor) };
            });
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          }
          on('f-scale-dn', 'click', function () { scaleLayerBy(0.9); });
          on('f-scale-up', 'click', function () { scaleLayerBy(1.1); });
          on('f-rot-15', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            const rad = (15 * Math.PI) / 180;
            const c = Math.cos(rad), s = Math.sin(rad);
            sel.points = sel.points.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          });
          on('f-flip-h', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) { return { x: Math.round(b.cx - (p.x - b.cx)), y: p.y }; });
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          });
          on('f-flip-v', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) { return { x: p.x, y: Math.round(b.cy - (p.y - b.cy)) }; });
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          });
          on('f-reset-rect', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = [
              { x: Math.round(b.minX), y: Math.round(b.minY) },
              { x: Math.round(b.maxX), y: Math.round(b.minY) },
              { x: Math.round(b.maxX), y: Math.round(b.maxY) },
              { x: Math.round(b.minX), y: Math.round(b.maxY) }
            ];
            sel.meshOffsets = [];
            sel.cropQuad = [{ u: 0, v: 0 }, { u: 1, v: 0 }, { u: 1, v: 1 }, { u: 0, v: 1 }];
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            renderInspector();
            saveProjectState();
          });
          on('f-subdiv', 'change', function (e) {
            pushHistory();
            sel.meshSubdiv = parseInt(e.target.value, 10) || 1;
            sel.meshOffsets = [];
            ui.overlayDirty = true;
            ui.projectorDirty = true;
            saveProjectState();
          });

          document.querySelectorAll('[data-vx]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              pushHistory();
              const idx = parseInt(inp.dataset.vx, 10);
              sel.points[idx].x = Math.round((parseFloat(inp.value) || 0) * 10) / 10;
              ui.overlayDirty = true;
              ui.projectorDirty = true;
              saveProjectState();
            });
          });
          document.querySelectorAll('[data-vy]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              pushHistory();
              const idx = parseInt(inp.dataset.vy, 10);
              sel.points[idx].y = Math.round((parseFloat(inp.value) || 0) * 10) / 10;
              ui.overlayDirty = true;
              ui.projectorDirty = true;
              saveProjectState();
            });
          });

          document.querySelectorAll('[data-src]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              pushHistory();
              sel.sourceType = btn.dataset.src;
              if (sel.sourceType === 'webcam') startWebcamStream();
              ui.projectorDirty = true;
              renderInspector();
              saveProjectState();
            });
          });
          document.querySelectorAll('[data-sh]').forEach(function (card) {
            card.addEventListener('click', function () {
              pushHistory();
              sel.sourceType = 'shader';
              sel.shaderId = card.dataset.sh;
              const found = SHADERS.find(function (s) { return s.id === sel.shaderId; });
              if (found) { sel.c1 = found.c1; sel.c2 = found.c2; sel.c3 = found.c3; }
              ui.projectorDirty = true;
              renderInspector();
              saveProjectState();
            });
          });

          on('f-c1', 'input', function (e) { sel.c1 = e.target.value; ui.projectorDirty = true; saveProjectState(); });
          on('f-c2', 'input', function (e) { sel.c2 = e.target.value; ui.projectorDirty = true; saveProjectState(); });
          on('f-c3', 'input', function (e) { sel.c3 = e.target.value; ui.projectorDirty = true; saveProjectState(); });
          slider('f-speed', 'speed', function (v) { return v.toFixed(2) + '×'; });
          slider('f-scale', 'scale', function (v) { return v.toFixed(2); });
          slider('f-intensity', 'intensity', function (v) { return v.toFixed(2); });

          on('f-upload', 'click', function () { document.getElementById('file-media').click(); });
