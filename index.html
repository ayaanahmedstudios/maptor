              }
            } else if (ui.tool === 'warp') {
              const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
              if (sel.points.length === 4 && sub > 1) {
                const pts = sel.points;
                for (let gy = 0; gy <= sub; gy++) {
                  for (let gx = 0; gx <= sub; gx++) {
                    if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                    const u = gx / sub, v = gy / sub;
                    const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                    const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                    const idx = gy * (sub + 1) + gx;
                    if (!sel.meshOffsets) sel.meshOffsets = [];
                    if (!sel.meshOffsets[idx]) sel.meshOffsets[idx] = { x: 0, y: 0 };
                    const mx = top.x + (bot.x - top.x) * v + sel.meshOffsets[idx].x;
                    const my = top.y + (bot.y - top.y) * v + sel.meshOffsets[idx].y;
                    if (Math.hypot(pt.x - mx, pt.y - my) <= hitR) {
                      pushHistory();
                      overlayCanvas.setPointerCapture(e.pointerId);
                      ui.dragging = { mode: 'mesh', idx: idx, startPt: pt, origOff: { x: sel.meshOffsets[idx].x, y: sel.meshOffsets[idx].y } };
                      return;
                    }
                  }
                }
              }
              for (let i = 0; i < sel.points.length; i++) {
                if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
                  pushHistory();
                  ui.activeVertex = i;
                  overlayCanvas.setPointerCapture(e.pointerId);
                  ui.dragging = { mode: 'vertex', vIdx: i, startPt: pt, origPt: { x: sel.points[i].x, y: sel.points[i].y } };
                  renderInspector();
                  return;
                }
              }
            }
          }

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            if (!l.visible) continue;
            const b = getBounds(l);
            const inBox = pt.x >= b.minX - 6 && pt.x <= b.maxX + 6 && pt.y >= b.minY - 6 && pt.y <= b.maxY + 6;
            if (pointInPoly(pt, l.points) || (ui.tool === 'box' && inBox)) {
              state.selectedLayerId = l.id;
              ui.activeVertex = -1;
              renderLayers();
              renderInspector();
              if (!l.locked) {
                pushHistory();
                overlayCanvas.setPointerCapture(e.pointerId);
                ui.dragging = {
                  mode: 'move',
                  startPt: pt,
                  origPts: l.points.map(function (p) { return { x: p.x, y: p.y }; })
                };
              }
              return;
            }
          }

          state.selectedLayerId = null;
          renderLayers();
          renderInspector();
        });

        overlayCanvas.addEventListener('pointermove', function (e) {
          const pt = toStagePt(e.clientX, e.clientY);
          const hitR = 16 / Math.max(0.3, ui.zoom);

          if (!ui.dragging) {
            if (ui.tool === 'pen') {
              overlayCanvas.style.cursor = 'crosshair';
              return;
            }
            const sel = getSelectedLayer();
            let cur = 'default';
            if (sel && !sel.locked && sel.visible) {
              if (ui.tool === 'box') {
                const handles = getBoxHandles(getBounds(sel));
                for (let i = 0; i < handles.length; i++) {
                  if (Math.hypot(pt.x - handles[i].x, pt.y - handles[i].y) <= hitR) {
                    cur = handles[i].cur;
                    break;
                  }
                }
              } else if (ui.tool === 'warp') {
                for (let i = 0; i < sel.points.length; i++) {
                  if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
                    cur = 'move';
                    break;
                  }
                }
              }
            }
            if (cur === 'default') {
              for (let i = state.layers.length - 1; i >= 0; i--) {
                if (state.layers[i].visible && pointInPoly(pt, state.layers[i].points)) {
                  cur = state.layers[i].locked ? 'not-allowed' : 'move';
                  break;
                }
              }
            }
            overlayCanvas.style.cursor = cur;
            return;
          }

          const sel = getSelectedLayer();
          if (!sel) return;
          const dx = pt.x - ui.dragging.startPt.x;
          const dy = pt.y - ui.dragging.startPt.y;

          if (ui.dragging.mode === 'move') {
            const sn = snapDelta(ui.dragging.origPts, dx, dy);
            sel.points = ui.dragging.origPts.map(function (p) {
              return { x: Math.round(p.x + sn.dx), y: Math.round(p.y + sn.dy) };
            });
          } else if (ui.dragging.mode === 'vertex') {
            const sn = snapDelta([ui.dragging.origPt], dx, dy);
            sel.points[ui.dragging.vIdx] = {
              x: Math.round(ui.dragging.origPt.x + sn.dx),
              y: Math.round(ui.dragging.origPt.y + sn.dy)
            };
          } else if (ui.dragging.mode === 'mesh') {
            sel.meshOffsets[ui.dragging.idx] = {
              x: Math.round(ui.dragging.origOff.x + dx),
              y: Math.round(ui.dragging.origOff.y + dy)
            };
          } else if (ui.dragging.mode === 'rotate') {
            const b = ui.dragging.origBounds;
            const a0 = Math.atan2(ui.dragging.startPt.y - b.cy, ui.dragging.startPt.x - b.cx);
            const a1 = Math.atan2(pt.y - b.cy, pt.x - b.cx);
            let da = a1 - a0;
            if (e.shiftKey) da = Math.round(da / (Math.PI / 12)) * (Math.PI / 12);
            const c = Math.cos(da), s = Math.sin(da);
            sel.points = ui.dragging.origPts.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
          } else if (ui.dragging.mode === 'resize') {
            const b = ui.dragging.origBounds;
            const h = ui.dragging.handle;
            let nMinX = b.minX, nMaxX = b.maxX, nMinY = b.minY, nMaxY = b.maxY;
            if (h.indexOf('w') !== -1) nMinX = Math.min(b.maxX - 16, b.minX + dx);
            if (h.indexOf('e') !== -1) nMaxX = Math.max(b.minX + 16, b.maxX + dx);
            if (h.indexOf('n') !== -1) nMinY = Math.min(b.maxY - 16, b.minY + dy);
            if (h.indexOf('s') !== -1) nMaxY = Math.max(b.minY + 16, b.maxY + dy);
            if (e.shiftKey) {
              const asp = b.w / b.h;
              const cw = nMaxX - nMinX, ch = nMaxY - nMinY;
              if (cw / ch > asp) {
                const tw = ch * asp;
                if (h.indexOf('w') !== -1) nMinX = nMaxX - tw; else nMaxX = nMinX + tw;
              } else {
                const th = cw / asp;
                if (h.indexOf('n') !== -1) nMinY = nMaxY - th; else nMaxY = nMinY + th;
              }
            }
            sel.points = ui.dragging.origPts.map(function (p) {
              const ux = (p.x - b.minX) / b.w;
              const uy = (p.y - b.minY) / b.h;
              return { x: Math.round(nMinX + ux * (nMaxX - nMinX)), y: Math.round(nMinY + uy * (nMaxY - nMinY)) };
            });
          }
          ui.projectorDirty = true;
          syncProjector(false);
        });

        overlayCanvas.addEventListener('pointerup', function () {
          if (ui.dragging) {
            ui.dragging = null;
            renderInspector();
            saveProjectState();
          }
        });

        overlayCanvas.addEventListener('dblclick', function (e) {
          if (ui.tool === 'pen') {
            commitPenPolygon();
            return;
          }
          if (ui.tool !== 'warp') return;
          const sel = getSelectedLayer();
          if (!sel || sel.locked) return;
          const pt = toStagePt(e.clientX, e.clientY);
          const hitR = 16 / Math.max(0.3, ui.zoom);
          for (let i = 0; i < sel.points.length; i++) {
            const a = sel.points[i];
            const b = sel.points[(i + 1) % sel.points.length];
            if (distSeg(pt, a, b) <= hitR) {
              pushHistory();
              sel.points.splice(i + 1, 0, { x: Math.round(pt.x), y: Math.round(pt.y) });
              sel.meshSubdiv = 1;
              sel.meshOffsets = [];
              renderInspector();
              saveProjectState();
              showToast('Inserted polygon vertex');
              return;
            }
          }
        });

        const ctxMenu = document.getElementById('ctx-menu');
        const addPopover = document.getElementById('add-popover');
        const stagePopover = document.getElementById('stage-popover');
        function hideContextMenu() {
          ctxMenu.classList.remove('open');
          addPopover.classList.remove('open');
          stagePopover.classList.remove('open');
        }
        window.addEventListener('click', hideContextMenu);
        stagePopover.addEventListener('click', function (e) { e.stopPropagation(); });

        overlayCanvas.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          hideContextMenu();
          const pt = toStagePt(e.clientX, e.clientY);
          const hitR = 16 / Math.max(0.3, ui.zoom);
          const sel = getSelectedLayer();
          if (ui.tool === 'warp' && sel && !sel.locked && sel.points.length > 3) {
            for (let i = 0; i < sel.points.length; i++) {
              if (Math.hypot(pt.x - sel.points[i].x, pt.y - sel.points[i].y) <= hitR) {
                pushHistory();
                sel.points.splice(i, 1);
                sel.meshSubdiv = 1;
                sel.meshOffsets = [];
                renderInspector();
                saveProjectState();
                showToast('Removed vertex');
                return;
              }
            }
          }

          if (!sel) return;
          ctxMenu.innerHTML =
            '<button class="ctx-item" data-cm="dup">Duplicate Layer</button>' +
            '<button class="ctx-item" data-cm="copy">Copy Style & Shader</button>' +
            (ui.copiedStyle ? '<button class="ctx-item" data-cm="paste">Paste Style</button>' : '') +
            '<button class="ctx-item" data-cm="front">Bring to Front</button>' +
            '<button class="ctx-item" data-cm="back">Send to Back</button>' +
            '<button class="ctx-item danger" data-cm="del">Delete Layer</button>';
          ctxMenu.style.left = Math.min(window.innerWidth - 185, e.clientX) + 'px';
          ctxMenu.style.top = Math.min(window.innerHeight - 210, e.clientY) + 'px';
          ctxMenu.classList.add('open');

          ctxMenu.querySelectorAll('[data-cm]').forEach(function (btn) {
            btn.onclick = function () {
              const act = btn.dataset.cm;
              const idx = state.layers.findIndex(function (l) { return l.id === sel.id; });
              if (act === 'copy') {
                ui.copiedStyle = cloneObj(sel);
                showToast('Copied style from ' + sel.name);
              } else if (act === 'paste' && ui.copiedStyle) {
                pushHistory();
                const keep = { id: sel.id, name: sel.name, points: sel.points, meshSubdiv: sel.meshSubdiv, meshOffsets: sel.meshOffsets };
                Object.assign(sel, cloneObj(ui.copiedStyle), keep);
                renderInspector();
                saveProjectState();
                showToast('Pasted style');
              } else if (act === 'dup' && idx >= 0) {
                pushHistory();
                const cp = cloneObj(sel);
                cp.id = uid('lyr');
                cp.name = sel.name + ' Copy';
                cp.points = cp.points.map(function (p) { return { x: p.x + 28, y: p.y + 28 }; });
                state.layers.splice(idx + 1, 0, cp);
                state.selectedLayerId = cp.id;
                renderLayers();
                renderInspector();
                saveProjectState();
              } else if (act === 'front' && idx >= 0) {
                pushHistory();
                state.layers.push(state.layers.splice(idx, 1)[0]);
                renderLayers();
                saveProjectState();
              } else if (act === 'back' && idx >= 0) {
                pushHistory();
                state.layers.unshift(state.layers.splice(idx, 1)[0]);
                renderLayers();
                saveProjectState();
              } else if (act === 'del' && idx >= 0) {
                pushHistory();
                state.layers.splice(idx, 1);
                state.selectedLayerId = state.layers.length ? state.layers[Math.min(idx, state.layers.length - 1)].id : null;
                renderLayers();
                renderInspector();
                saveProjectState();
                showToast('Deleted "' + sel.name + '"', true);
              }
              hideContextMenu();
            };
          });
        });

        function commitPenPolygon() {
          if (ui.penPoints.length >= 3) {
            pushHistory();
            const poly = createLayer('polygon', 'Custom Polygon', ui.penPoints);
            state.layers.push(poly);
            state.selectedLayerId = poly.id;
            showToast('Custom polygon created');
          }
          ui.penPoints = [];
          setTool('warp');
          fullUIRefresh();
          saveProjectState();
        }

        function drawOverlay() {
          const W = state.width, H = state.height;
          overlayCtx.clearRect(0, 0, W, H);
          const invZ = 1 / Math.max(0.25, ui.zoom);

          if (ui.showGrid) {
            overlayCtx.save();
            overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.11)';
            overlayCtx.lineWidth = 1.1 * invZ;
            for (let x = 0; x <= W; x += 120) {
              overlayCtx.beginPath(); overlayCtx.moveTo(x, 0); overlayCtx.lineTo(x, H); overlayCtx.stroke();
            }
            for (let y = 0; y <= H; y += 120) {
              overlayCtx.beginPath(); overlayCtx.moveTo(0, y); overlayCtx.lineTo(W, y); overlayCtx.stroke();
            }
            overlayCtx.strokeStyle = 'rgba(99, 102, 241, 0.50)';
            overlayCtx.lineWidth = 1.8 * invZ;
            overlayCtx.beginPath();
            overlayCtx.moveTo(W * 0.5, 0); overlayCtx.lineTo(W * 0.5, H);
            overlayCtx.moveTo(0, H * 0.5); overlayCtx.lineTo(W, H * 0.5);
            overlayCtx.stroke();
            overlayCtx.restore();
          }

          state.layers.forEach(function (l) {
            if (!l.visible) return;
            if (ui.xray) {
              overlayCtx.save();
              overlayCtx.fillStyle = l.kind === 'mask' ? 'rgba(239, 68, 68, 0.22)' : 'rgba(99, 102, 241, 0.16)';
              overlayCtx.strokeStyle = l.kind === 'mask' ? '#ef4444' : '#818cf8';
              overlayCtx.lineWidth = 1.6 * invZ;
              overlayCtx.beginPath();
              l.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
              overlayCtx.closePath();
              overlayCtx.fill();
              overlayCtx.stroke();
              const b = getBounds(l);
              overlayCtx.fillStyle = '#ffffff';
              overlayCtx.font = '600 ' + Math.round(13 * invZ) + 'px Inter, sans-serif';
              overlayCtx.textAlign = 'center';
              overlayCtx.fillText(l.name, b.cx, b.cy);
              overlayCtx.restore();
            } else if (l.id !== state.selectedLayerId) {
              overlayCtx.save();
              overlayCtx.strokeStyle = l.kind === 'mask' ? 'rgba(239, 68, 68, 0.38)' : 'rgba(255, 255, 255, 0.16)';
              overlayCtx.lineWidth = 1.2 * invZ;
              overlayCtx.beginPath();
              l.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
              overlayCtx.closePath();
              overlayCtx.stroke();
              overlayCtx.restore();
            }
          });

          const sel = getSelectedLayer();
          if (sel && sel.visible) {
            const col = sel.kind === 'mask' ? '#ef4444' : '#6366f1';
            overlayCtx.save();
            overlayCtx.strokeStyle = col;
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            sel.points.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.closePath();
            overlayCtx.stroke();

            if (!sel.locked) {
              if (ui.tool === 'box') {
                const b = getBounds(sel);
                overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.85)';
                overlayCtx.setLineDash([5 * invZ, 4 * invZ]);
                overlayCtx.strokeRect(b.minX, b.minY, b.w, b.h);
                overlayCtx.setLineDash([]);
                overlayCtx.beginPath();
                overlayCtx.moveTo(b.cx, b.minY);
                overlayCtx.lineTo(b.cx, b.minY - 34);
                overlayCtx.stroke();

                const hs = 5.5 * invZ;
                getBoxHandles(b).forEach(function (h) {
                  overlayCtx.fillStyle = '#ffffff';
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 2 * invZ;
                  overlayCtx.beginPath();
                  if (h.id === 'rot') overlayCtx.arc(h.x, h.y, hs * 1.15, 0, Math.PI * 2);
                  else overlayCtx.rect(h.x - hs, h.y - hs, hs * 2, hs * 2);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              } else if (ui.tool === 'warp') {
                const sub = Math.max(1, Math.min(8, Number(sel.meshSubdiv) || 1));
                if (sel.points.length === 4 && sub > 1) {
                  const pts = sel.points;
                  const gp = function (gx, gy) {
                    const u = gx / sub, v = gy / sub;
                    const top = { x: pts[0].x + (pts[1].x - pts[0].x) * u, y: pts[0].y + (pts[1].y - pts[0].y) * u };
                    const bot = { x: pts[3].x + (pts[2].x - pts[3].x) * u, y: pts[3].y + (pts[2].y - pts[3].y) * u };
                    const off = (sel.meshOffsets || [])[gy * (sub + 1) + gx] || { x: 0, y: 0 };
                    return { x: top.x + (bot.x - top.x) * v + off.x, y: top.y + (bot.y - top.y) * v + off.y };
                  };
                  overlayCtx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
                  overlayCtx.lineWidth = 1.2 * invZ;
                  for (let gy = 0; gy <= sub; gy++) {
                    overlayCtx.beginPath();
                    for (let gx = 0; gx <= sub; gx++) { const p = gp(gx, gy); if (gx === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); }
                    overlayCtx.stroke();
                  }
                  for (let gx = 0; gx <= sub; gx++) {
                    overlayCtx.beginPath();
                    for (let gy = 0; gy <= sub; gy++) { const p = gp(gx, gy); if (gy === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); }
                    overlayCtx.stroke();
                  }
                  for (let gy = 0; gy <= sub; gy++) {
                    for (let gx = 0; gx <= sub; gx++) {
                      if ((gx === 0 || gx === sub) && (gy === 0 || gy === sub)) continue;
                      const p = gp(gx, gy);
                      overlayCtx.fillStyle = '#818cf8';
                      overlayCtx.beginPath(); overlayCtx.arc(p.x, p.y, 4 * invZ, 0, Math.PI * 2); overlayCtx.fill();
                    }
                  }
                }
                sel.points.forEach(function (p, idx) {
                  overlayCtx.fillStyle = idx === ui.activeVertex ? '#f59e0b' : '#ffffff';
                  overlayCtx.strokeStyle = col;
                  overlayCtx.lineWidth = 2.4 * invZ;
                  overlayCtx.beginPath();
                  overlayCtx.arc(p.x, p.y, 7 * invZ, 0, Math.PI * 2);
                  overlayCtx.fill();
                  overlayCtx.stroke();
                });
              }
            }
            overlayCtx.restore();
          }

          if (ui.tool === 'pen' && ui.penPoints.length > 0) {
            overlayCtx.save();
            overlayCtx.strokeStyle = '#10b981';
            overlayCtx.lineWidth = 2 * invZ;
            overlayCtx.beginPath();
            ui.penPoints.forEach(function (p, i) { if (i === 0) overlayCtx.moveTo(p.x, p.y); else overlayCtx.lineTo(p.x, p.y); });
            overlayCtx.stroke();
            ui.penPoints.forEach(function (p, i) {
              overlayCtx.fillStyle = i === 0 ? '#10b981' : '#ffffff';
              overlayCtx.beginPath(); overlayCtx.arc(p.x, p.y, 6 * invZ, 0, Math.PI * 2); overlayCtx.fill();
            });
            overlayCtx.restore();
          }
        }

        function lerp(a, b, t) { return a + (b - a) * t; }
        function lerpHex(h1, h2, t) {
          const a = parseInt((h1 || '#000000').replace('#', ''), 16) || 0;
          const b = parseInt((h2 || '#000000').replace('#', ''), 16) || 0;
          const r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t));
          const g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
          const bl = Math.round(lerp(a & 255, b & 255, t));
          return '#' + [r, g, bl].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
        }

        function getActiveLayers() {
          if (!ui.transition) return state.layers;
          const tr = ui.transition;
          const raw = tr.duration <= 0.001 ? 1 : Math.min(1, Math.max(0, tr.elapsed / tr.duration));
          const t = raw * raw * (3 - 2 * raw);
          return tr.toLayers.map(function (target) {
            const prev = tr.fromLayers.find(function (f) { return f.id === target.id; });
            if (!prev) {
              const c = cloneObj(target);
              c.opacity = (target.opacity != null ? target.opacity : 1) * t;
              return c;
            }
            const out = cloneObj(target);
            out.opacity = lerp(prev.opacity != null ? prev.opacity : 1, target.opacity != null ? target.opacity : 1, t);
            out.scale = lerp(prev.scale || 1, target.scale || 1, t);
            out.intensity = lerp(prev.intensity || 1, target.intensity || 1, t);
            out.contentZoom = lerp(prev.contentZoom || 1, target.contentZoom || 1, t);
            out.contentPanX = lerp(prev.contentPanX || 0, target.contentPanX || 0, t);
            out.contentPanY = lerp(prev.contentPanY || 0, target.contentPanY || 0, t);
            out.c1 = lerpHex(prev.c1, target.c1, t);
            out.c2 = lerpHex(prev.c2, target.c2, t);
            out.c3 = lerpHex(prev.c3, target.c3, t);
            if (prev.points.length === target.points.length) {
              out.points = target.points.map(function (pt, idx) {
                return { x: lerp(prev.points[idx].x, pt.x, t), y: lerp(prev.points[idx].y, pt.y, t) };
              });
            }
            return out;
          });
        }

        function activateCue(index, smooth) {
          if (!state.cues.length) return;
          const idx = ((index % state.cues.length) + state.cues.length) % state.cues.length;
          const cue = state.cues[idx];
          const fromSnap = getActiveLayers().map(cloneObj);
          state.activeCueIndex = idx;
          ui.cueElapsed = 0;
          if (smooth && cue.fade > 0.05) {
            ui.transition = { fromLayers: fromSnap, toLayers: cue.layers.map(cloneObj), elapsed: 0, duration: cue.fade };
          } else {
            ui.transition = null;
          }
          state.layers = cue.layers.map(cloneObj);
          if (!state.layers.some(function (l) { return l.id === state.selectedLayerId; })) {
            state.selectedLayerId = state.layers[0] ? state.layers[0].id : null;
          }
          fullUIRefresh();
          syncProjector(true);
        }

        function saveProjectState() {
          ui.projectorDirty = true;
          try { localStorage.setItem(ACTIVE_KEY, JSON.stringify(state)); } catch (e) {}
          syncProjector(false);
        }

        let dragLayerIdx = -1;

        function getLayerTypeIcon(l) {
          if (l.kind === 'mask') return '<svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
          if (l.sourceType === 'text' || l.shapeType === 'text') return '<svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>';
          if (l.shapeType === 'arch') return '<svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0 1 14 0v11H5z"/></svg>';
          if (l.shapeType === 'circle') return '<svg class="ico ico-xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>';
          if (l.shapeType === 'polygon') return '<svg class="ico ico-xs" viewBox="0 0 24 24"><polygon points="12 3 21 9 18 20 6 20 3 9"/></svg>';
          return '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
        }

        function renderLayers() {
          const list = document.getElementById('layer-list');
          document.getElementById('layer-count').textContent = String(state.layers.length);
          list.innerHTML = '';

          if (!state.layers.length) {
            list.innerHTML = '<div style="padding:26px 12px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.5;">No surfaces on stage.<br/>Add a <strong style="color:var(--text-secondary);">Quad</strong>, <strong style="color:var(--text-secondary);">Window</strong>, or <strong style="color:var(--text-secondary);">Text</strong> layer above.</div>';
            return;
          }

          const eyeOn = '<svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
          const eyeOff = '<svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
          const lockOn = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
          const lockOff = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
          const dupSvg = '<svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
          const delSvg = '<svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            const row = document.createElement('div');
            row.className = 'layer-row' + (l.id === state.selectedLayerId ? ' selected' : '');
            row.draggable = true;
            const subLabel = l.kind === 'mask' ? 'Blackout Mask' : (l.sourceType + ' • ' + l.shapeType);
            row.innerHTML =
              '<div class="layer-icon-box" style="' + (l.kind === 'mask' ? 'color:#fca5a5;' : '') + '">' + getLayerTypeIcon(l) + '</div>' +
              '<div class="layer-meta">' +
                '<span class="layer-title" title="' + l.name + '" style="' + (!l.visible ? 'opacity:0.45;' : '') + '">' + l.name + '</span>' +
                '<span class="layer-sub">' + subLabel + '</span>' +
              '</div>' +
              '<div class="layer-btns">' +
                '<button class="btn btn-ico-sm" data-a="vis" title="Toggle Visibility">' + (l.visible ? eyeOn : eyeOff) + '</button>' +
                '<button class="btn btn-ico-sm" data-a="lock" title="Toggle Lock">' + (l.locked ? lockOn : lockOff) + '</button>' +
                '<button class="btn btn-ico-sm" data-a="dup" title="Duplicate Layer">' + dupSvg + '</button>' +
                '<button class="btn btn-ico-sm danger" data-a="del" title="Delete Layer">' + delSvg + '</button>' +
              '</div>';

            row.addEventListener('dragstart', function () { dragLayerIdx = i; });
            row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('drag-over'); });
            row.addEventListener('dragleave', function () { row.classList.remove('drag-over'); });
            row.addEventListener('drop', function (e) {
              e.preventDefault();
              row.classList.remove('drag-over');
              if (dragLayerIdx >= 0 && dragLayerIdx !== i) {
                pushHistory();
                const moved = state.layers.splice(dragLayerIdx, 1)[0];
                state.layers.splice(i, 0, moved);
                renderLayers();
                saveProjectState();
              }
              dragLayerIdx = -1;
            });

            row.addEventListener('click', function (e) {
              const btn = e.target.closest('button');
              if (!btn) {
                state.selectedLayerId = l.id;
                renderLayers();
                renderInspector();
                return;
              }
              e.stopPropagation();
              const act = btn.dataset.a;
              pushHistory();
              if (act === 'vis') {
                l.visible = !l.visible;
              } else if (act === 'lock') {
                l.locked = !l.locked;
              } else if (act === 'dup') {
                const cp = cloneObj(l);
                cp.id = uid('lyr');
                cp.name = l.name + ' Copy';
                cp.points = cp.points.map(function (p) { return { x: p.x + 28, y: p.y + 28 }; });
                state.layers.splice(i + 1, 0, cp);
                state.selectedLayerId = cp.id;
              } else if (act === 'del') {
                state.layers.splice(i, 1);
                if (state.selectedLayerId === l.id) {
                  state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
                }
                showToast('Deleted "' + l.name + '"', true);
              }
              renderLayers();
              renderInspector();
              saveProjectState();
            });

            list.appendChild(row);
          }
        }

        document.querySelectorAll('.insp-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            ui.activeTab = btn.dataset.tab;
            document.querySelectorAll('.insp-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
            renderInspector();
          });
        });

        function renderInspector() {
          const body = document.getElementById('inspector-body');
          const title = document.getElementById('insp-title');
          const badge = document.getElementById('insp-badge');
          const tabs = document.getElementById('insp-tabs');
          const sel = getSelectedLayer();

          if (!sel) {
            title.textContent = 'Inspector';
            badge.textContent = 'Empty';
            tabs.style.opacity = '0.4';
            tabs.style.pointerEvents = 'none';
            body.innerHTML = '<div style="padding:36px 14px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.55;">Select any surface or mask on the stage to customize its shaders, media, geometry, window mullions, and color grading.</div>';
            return;
          }

          tabs.style.opacity = '1';
          tabs.style.pointerEvents = 'auto';
          title.textContent = sel.name;
          badge.textContent = sel.kind === 'mask' ? 'Mask' : sel.shapeType;
          const b = getBounds(sel);

          if (ui.activeTab === 'surface') {
            const vertexCoordsHtml = sel.points.map(function (p, idx) {
              return '<div class="g2" style="margin-bottom:5px;">' +

                '<div style="display:flex;align-items:center;gap:5px;"><span class="mono" style="color:var(--text-muted);width:24px;">P' + (idx + 1) + 'Y</span><input type="number" class="inp mono" data-vy="' + idx + '" value="' + Math.round(p.y) + '" /></div>' +
              '</div>';
            }).join('');

            body.innerHTML =
              '<div class="sec-card">' +
                '<div class="sec-head"><span>Identity & Bounds</span><span class="mono">' + Math.round(b.w) + '×' + Math.round(b.h) + '</span></div>' +
                '<div class="row"><input type="text" id="f-name" class="inp" value="' + sel.name.replace(/"/g, '&quot;') + '" /></div>' +
                '<div class="g2" style="margin-bottom:10px;">' +
                  '<div><span class="lbl" style="font-size:10.5px;">X (px)</span><input type="number" id="f-x" class="inp mono" value="' + Math.round(b.minX) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Y (px)</span><input type="number" id="f-y" class="inp mono" value="' + Math.round(b.minY) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Width (px)</span><input type="number" id="f-w" class="inp mono" value="' + Math.round(b.w) + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Height (px)</span><input type="number" id="f-h" class="inp mono" value="' + Math.round(b.h) + '" /></div>' +
                '</div>' +
                '<div class="g3" style="margin-bottom:6px;">' +
                  '<button class="btn btn-sm" id="f-scale-dn">-10%</button>' +
                  '<button class="btn btn-sm" id="f-scale-up">+10%</button>' +
                  '<button class="btn btn-sm" id="f-rot-15">+15°</button>' +
                '</div>' +
                '<div class="g3">' +
                  '<button class="btn btn-sm" id="f-flip-h">Flip H</button>' +
                  '<button class="btn btn-sm" id="f-flip-v">Flip V</button>' +
                  '<button class="btn btn-sm" id="f-reset-rect">Reset</button>' +
                '</div>' +
              '</div>' +
              (sel.points.length === 4 ? (
                '<div class="sec-card">' +
                  '<div class="sec-head"><span>Curved Mesh Warping</span></div>' +
                  '<div class="row"><span class="lbl">Subdivisions</span>' +
                  '<select id="f-subdiv" class="inp mono" style="width:96px;">' +
                    [1, 2, 3, 4, 6, 8].map(function (n) { return '<option value="' + n + '" ' + (Number(sel.meshSubdiv) === n ? 'selected' : '') + '>' + n + '×' + n + '</option>'; }).join('') +
                  '</select></div>' +
                '</div>'
              ) : '') +
              '<div class="sec-card">' +
                '<div class="sec-head"><span>Corner & Polygon Points</span></div>' +
                vertexCoordsHtml +
              '</div>';
          } else if (ui.activeTab === 'content') {
            if (sel.kind === 'mask') {
              body.innerHTML = '<div class="sec-card"><div style="color:var(--text-secondary);font-size:12px;">Blackout Mask layers block light cleanly on the projector. Use the <strong>Window</strong> or <strong>Surface</strong> tabs to shape cutouts.</div></div>';
            } else {
              const shadersHtml = SHADERS.map(function (s) {
                return '<button class="shader-card ' + (sel.shaderId === s.id ? 'active' : '') + '" data-sh="' + s.id + '">' +
                  '<span class="shader-swatch" style="background:linear-gradient(135deg,' + s.c1 + ',' + s.c2 + ' 65%,' + s.c3 + ');"></span>' +
                  '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + s.name + '</span>' +
                '</button>';
              }).join('');

              body.innerHTML =
                '<div class="sec-card">' +
                  '<div class="sec-head"><span>Source Type</span></div>' +
                  '<div class="seg">' +
                    '<button class="' + (sel.sourceType === 'shader' ? 'active' : '') + '" data-src="shader">Shaders</button>' +
                    '<button class="' + (sel.sourceType === 'media' ? 'active' : '') + '" data-src="media">Media</button>' +
                    '<button class="' + (sel.sourceType === 'text' ? 'active' : '') + '" data-src="text">Text</button>' +
                    '<button class="' + (sel.sourceType === 'solid' ? 'active' : '') + '" data-src="solid">Fill</button>' +
                  '</div>' +
                  (sel.sourceType === 'shader' ? (
                    '<div class="shader-grid">' + shadersHtml + '</div>' +
                    '<div class="g3" style="margin-bottom:10px;">' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 7px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Primary</span><input type="color" id="f-c1" value="' + sel.c1 + '" /></label>' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 7px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Back</span><input type="color" id="f-c2" value="' + sel.c2 + '" /></label>' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 7px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Accent</span><input type="color" id="f-c3" value="' + sel.c3 + '" /></label>' +
                    '</div>' +
                    '<div class="row"><span class="lbl">Speed</span><input type="range" id="f-speed" min="0" max="3" step="0.05" value="' + sel.speed + '" /><span class="val">' + Number(sel.speed).toFixed(2) + '×</span></div>' +
                    '<div class="row"><span class="lbl">Scale</span><input type="range" id="f-scale" min="0.2" max="4" step="0.05" value="' + sel.scale + '" /><span class="val">' + Number(sel.scale).toFixed(2) + '</span></div>' +
                    '<div class="row"><span class="lbl">Intensity</span><input type="range" id="f-intensity" min="0.1" max="2.5" step="0.05" value="' + sel.intensity + '" /><span class="val">' + Number(sel.intensity).toFixed(2) + '</span></div>'
                  ) : '') +
                  (sel.sourceType === 'media' ? (
                    '<div class="g2" style="margin-bottom:8px;">' +
                      '<button class="btn primary" id="f-upload">Video / Image</button>' +
                      '<button class="btn" id="f-webcam">Live Webcam</button>' +
                    '</div>' +
                    (sel.mediaName ? '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Active: ' + sel.mediaName + '</div>' : '') +
                    (sel.mediaType === 'video' ? (
                      '<div class="g3" style="margin-bottom:8px;">' +
                        '<button class="btn btn-sm" id="f-vplay">' + (sel.videoPaused ? 'Play' : 'Pause') + '</button>' +
                        '<button class="btn btn-sm ' + (sel.videoLoop !== false ? 'active' : '') + '" id="f-vloop">Loop: ' + (sel.videoLoop !== false ? 'On' : 'Off') + '</button>' +
                        '<button class="btn btn-sm ' + (sel.videoMuted !== false ? 'active' : '') + '" id="f-vmute">Muted: ' + (sel.videoMuted !== false ? 'On' : 'Off') + '</button>' +
                      '</div>' +
                      '<div class="row"><span class="lbl">Speed</span><input type="range" id="f-vspeed" min="0.25" max="2.5" step="0.05" value="' + (sel.videoSpeed || 1) + '" /><span class="val">' + Number(sel.videoSpeed || 1).toFixed(2) + '×</span></div>'
                    ) : '')
                  ) : '') +
                  (sel.sourceType === 'text' ? (
                    '<div class="row"><textarea id="f-text" class="inp" rows="2">' + sel.text + '</textarea></div>' +
                    '<div class="row"><input type="text" id="f-font" class="inp" list="gfonts" value="' + sel.fontFamily + '" placeholder="Search Google Fonts..." /><datalist id="gfonts">' + GOOGLE_FONTS.map(function (f) { return '<option value="' + f + '"></option>'; }).join('') + '</datalist></div>' +
                    '<div class="g2" style="margin-bottom:8px;">' +
                      '<select id="f-fweight" class="inp">' + ['300','400','500','600','700','800','900'].map(function (w) { return '<option value="' + w + '" ' + (String(sel.fontWeight) === w ? 'selected' : '') + '>Weight ' + w + '</option>'; }).join('') + '</select>' +
                      '<select id="f-talign" class="inp"><option value="left" ' + (sel.textAlign === 'left' ? 'selected' : '') + '>Align Left</option><option value="center" ' + (sel.textAlign === 'center' ? 'selected' : '') + '>Align Center</option><option value="right" ' + (sel.textAlign === 'right' ? 'selected' : '') + '>Align Right</option></select>' +
                    '</div>' +
                    '<div class="row"><span class="lbl">Size</span><input type="range" id="f-fsize" min="24" max="240" step="2" value="' + sel.fontSize + '" /><span class="val">' + sel.fontSize + 'px</span></div>' +
                    '<div class="row"><span class="lbl">Spacing</span><input type="range" id="f-fspace" min="-4" max="40" step="1" value="' + sel.letterSpacing + '" /><span class="val">' + sel.letterSpacing + 'px</span></div>' +
                    '<div class="row"><span class="lbl">Shadow</span><input type="range" id="f-tshadow" min="0" max="40" step="1" value="' + sel.textShadow + '" /><span class="val">' + sel.textShadow + 'px</span></div>' +
                    '<div class="g2">' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 8px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Text</span><input type="color" id="f-tcolor" value="' + sel.textColor + '" /></label>' +
                      '<button class="btn btn-sm" id="f-tbg-toggle">' + (sel.textBg === 'transparent' ? 'Bg: Transparent' : 'Bg: Dark Card') + '</button>' +
                    '</div>'
                  ) : '') +
                  (sel.sourceType === 'solid' ? (
                    '<div class="seg">' +
                      '<button class="' + (sel.solidMode === 'solid' ? 'active' : '') + '" data-sm="solid">Solid</button>' +
                      '<button class="' + (sel.solidMode === 'gradient' ? 'active' : '') + '" data-sm="gradient">Linear</button>' +
                      '<button class="' + (sel.solidMode === 'radial' ? 'active' : '') + '" data-sm="radial">Radial</button>' +
                    '</div>' +
                    '<div class="g2" style="margin-bottom:8px;">' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 8px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Color A</span><input type="color" id="f-sc1" value="' + sel.c1 + '" /></label>' +
                      '<label style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-control);padding:5px 8px;border-radius:6px;border:1px solid var(--border-subtle);font-size:11px;"><span>Color B</span><input type="color" id="f-sc2" value="' + sel.c2 + '" /></label>' +
                    '</div>' +
                    '<div class="row"><span class="lbl">Angle</span><input type="range" id="f-gangle" min="0" max="360" step="5" value="' + sel.gradAngle + '" /><span class="val">' + sel.gradAngle + '°</span></div>'
                  ) : '') +
                '</div>' +
                '<div class="sec-card">' +
                  '<div class="sec-head"><span>Content Fit & Framing</span></div>' +
                  '<div class="seg">' +
                    '<button class="' + (sel.contentMapping !== 'skew' ? 'active' : '') + '" data-map="crop">Container Crop</button>' +
                    '<button class="' + (sel.contentMapping === 'skew' ? 'active' : '') + '" data-map="skew">Perspective Skew</button>' +
                  '</div>' +
                  '<div class="row"><span class="lbl">Zoom</span><input type="range" id="f-czoom" min="0.5" max="3" step="0.05" value="' + sel.contentZoom + '" /><span class="val">' + Math.round(sel.contentZoom * 100) + '%</span></div>' +
                  '<div class="row"><span class="lbl">Pan X</span><input type="range" id="f-cpanx" min="-100" max="100" step="1" value="' + sel.contentPanX + '" /><span class="val">' + sel.contentPanX + '%</span></div>' +
                  '<div class="row"><span class="lbl">Pan Y</span><input type="range" id="f-cpany" min="-100" max="100" step="1" value="' + sel.contentPanY + '" /><span class="val">' + sel.contentPanY + '%</span></div>' +
                  '<div class="row"><span class="lbl">Rotation</span><input type="range" id="f-crot" min="-180" max="180" step="1" value="' + sel.contentRot + '" /><span class="val">' + sel.contentRot + '°</span></div>' +
                '</div>';
            }
          } else if (ui.activeTab === 'window') {
            const winPresetsHtml = WINDOW_PRESETS.map(function (p) {
              return '<button class="win-card ' + (sel.winPreset === p.id ? 'active' : '') + '" data-wp="' + p.id + '" title="' + p.name + '">' +
                '<svg width="26" height="26" viewBox="0 0 28 28">' + p.svg + '</svg>' +
                '<span>' + p.name + '</span>' +
              '</button>';
            }).join('');

            body.innerHTML =
              '<div class="sec-card">' +
                '<div class="sec-head"><span>Architectural Presets</span></div>' +
                '<div class="win-preset-grid">' + winPresetsHtml + '</div>' +
                '<div class="g2" style="margin-bottom:10px;">' +
                  '<div><span class="lbl" style="font-size:10.5px;">Arch Profile</span><select id="f-warch" class="inp"><option value="flat" ' + (sel.winArch === 'flat' ? 'selected' : '') + '>Flat Top</option><option value="round" ' + (sel.winArch === 'round' ? 'selected' : '') + '>Round Arch</option><option value="pointed" ' + (sel.winArch === 'pointed' ? 'selected' : '') + '>Gothic Pointed</option></select></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Arch Curve %</span><input type="number" id="f-wcurve" class="inp mono" min="0" max="60" value="' + sel.winArchCurve + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Horiz. Bars</span><input type="number" id="f-whbars" class="inp mono" min="0" max="12" value="' + sel.winHBars + '" /></div>' +
                  '<div><span class="lbl" style="font-size:10.5px;">Vert. Bars</span><input type="number" id="f-wvbars" class="inp mono" min="0" max="12" value="' + sel.winVBars + '" /></div>' +
                '</div>' +
                '<div class="row"><span class="lbl">Mullion Width</span><input type="range" id="f-wbarw" min="0" max="60" step="1" value="' + sel.winBarW + '" /><span class="val">' + sel.winBarW + 'px</span></div>' +
                '<div class="row"><span class="lbl">Frame Border</span><input type="range" id="f-wframew" min="0" max="90" step="1" value="' + sel.winFrameW + '" /><span class="val">' + sel.winFrameW + 'px</span></div>' +
                '<div class="row"><span class="lbl">Corner Radius</span><input type="range" id="f-wcorner" min="0" max="140" step="2" value="' + sel.winCornerR + '" /><span class="val">' + sel.winCornerR + 'px</span></div>' +
                '<div class="row"><span class="lbl">Edge Feather</span><input type="range" id="f-wfeather" min="1" max="50" step="1" value="' + sel.winFeather + '" /><span class="val">' + sel.winFeather + 'px</span></div>' +
                '<div class="row">' +
                  '<label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);"><input type="color" id="f-wfcol" value="' + (sel.winFrameColor || '#000000') + '" /><span>Frame Color</span></label>' +
                  '<button class="btn btn-sm ' + (sel.winInvert ? 'active' : '') + '" id="f-winvert">Invert Mask</button>' +
                '</div>' +
              '</div>';

                '<div class="row"><span class="lbl">Opacity</span><input type="range" id="f-op" min="0" max="1" step="0.01" value="' + sel.opacity + '" /><span class="val">' + Math.round(sel.opacity * 100) + '%</span></div>' +

        function bindInspectorHandlers(sel) {
          const on = function (id, ev, fn) { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
          const slider = function (id, key, fmt) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', function () {
              sel[key] = parseFloat(el.value);
              const vEl = el.parentElement.querySelector('.val');
              if (vEl) vEl.textContent = fmt(sel[key]);
              saveProjectState();
            });
          };

          on('f-name', 'input', function (e) {
            sel.name = e.target.value;
            document.getElementById('insp-title').textContent = sel.name;
            renderLayers();
            saveProjectState();
          });

          const syncRectInputs = function () {
            pushHistory();
            const b = getBounds(sel);
            const nx = parseFloat(document.getElementById('f-x').value) || 0;
            const ny = parseFloat(document.getElementById('f-y').value) || 0;
            const nw = Math.max(12, parseFloat(document.getElementById('f-w').value) || b.w);
            const nh = Math.max(12, parseFloat(document.getElementById('f-h').value) || b.h);
            sel.points = sel.points.map(function (p) {
              return { x: Math.round(nx + ((p.x - b.minX) / b.w) * nw), y: Math.round(ny + ((p.y - b.minY) / b.h) * nh) };
            });
            renderInspector();
            saveProjectState();
          };
          ['f-x', 'f-y', 'f-w', 'f-h'].forEach(function (id) { on(id, 'change', syncRectInputs); });

          function scaleLayerBy(factor) {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) {
              return { x: Math.round(b.cx + (p.x - b.cx) * factor), y: Math.round(b.cy + (p.y - b.cy) * factor) };
            });
            renderInspector();
            saveProjectState();
          }
          on('f-scale-dn', 'click', function () { scaleLayerBy(0.9); });
          on('f-scale-up', 'click', function () { scaleLayerBy(1.1); });
          on('f-rot-15', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            const rad = (15 * Math.PI) / 180;
            const c = Math.cos(rad), s = Math.sin(rad);
            sel.points = sel.points.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
            renderInspector();
            saveProjectState();
          });
          on('f-flip-h', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) { return { x: Math.round(b.cx - (p.x - b.cx)), y: p.y }; });
            renderInspector();
            saveProjectState();
          });
          on('f-flip-v', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) { return { x: p.x, y: Math.round(b.cy - (p.y - b.cy)) }; });
            renderInspector();
            saveProjectState();
          });
          on('f-reset-rect', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            sel.points = [
              { x: Math.round(b.minX), y: Math.round(b.minY) },
              { x: Math.round(b.maxX), y: Math.round(b.minY) },
              { x: Math.round(b.maxX), y: Math.round(b.maxY) },
              { x: Math.round(b.minX), y: Math.round(b.maxY) }
            ];
            sel.meshOffsets = [];
            renderInspector();
            saveProjectState();
          });
          on('f-subdiv', 'change', function (e) {
            pushHistory();
            sel.meshSubdiv = parseInt(e.target.value, 10) || 1;
            sel.meshOffsets = [];
            saveProjectState();
          });

          document.querySelectorAll('[data-vx]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              pushHistory();
              const idx = parseInt(inp.dataset.vx, 10);
              sel.points[idx].x = Math.round(parseFloat(inp.value) || 0);
              saveProjectState();
            });
          });
          document.querySelectorAll('[data-vy]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              pushHistory();
              const idx = parseInt(inp.dataset.vy, 10);
              sel.points[idx].y = Math.round(parseFloat(inp.value) || 0);
              saveProjectState();
            });
          });

          document.querySelectorAll('[data-src]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              pushHistory();
              sel.sourceType = btn.dataset.src;
              renderLayers();
              renderInspector();
              saveProjectState();
            });
          });
          document.querySelectorAll('[data-sh]').forEach(function (card) {
            card.addEventListener('click', function () {
              pushHistory();
              sel.shaderId = card.dataset.sh;
              const found = SHADERS.find(function (s) { return s.id === sel.shaderId; });
              if (found) { sel.c1 = found.c1; sel.c2 = found.c2; sel.c3 = found.c3; }
              renderInspector();
              saveProjectState();
            });
          });

          on('f-c1', 'input', function (e) { sel.c1 = e.target.value; saveProjectState(); });
          on('f-c2', 'input', function (e) { sel.c2 = e.target.value; saveProjectState(); });
          on('f-c3', 'input', function (e) { sel.c3 = e.target.value; saveProjectState(); });
          slider('f-speed', 'speed', function (v) { return v.toFixed(2) + '×'; });
          slider('f-scale', 'scale', function (v) { return v.toFixed(2); });
          slider('f-intensity', 'intensity', function (v) { return v.toFixed(2); });

          on('f-upload', 'click', function () { document.getElementById('file-media').click(); });
          on('f-webcam', 'click', function () { startWebcamForLayer(sel); });
          on('f-vplay', 'click', function () { sel.videoPaused = !sel.videoPaused; renderInspector(); saveProjectState(); });
          on('f-vloop', 'click', function () { sel.videoLoop = sel.videoLoop === false ? true : false; renderInspector(); saveProjectState(); });
          on('f-vmute', 'click', function () { sel.videoMuted = sel.videoMuted === false ? true : false; renderInspector(); saveProjectState(); });
          slider('f-vspeed', 'videoSpeed', function (v) { return v.toFixed(2) + '×'; });

          on('f-text', 'input', function (e) { sel.text = e.target.value; saveProjectState(); });
          on('f-font', 'change', function (e) { sel.fontFamily = e.target.value.trim() || 'Inter'; ensureGoogleFont(sel.fontFamily); saveProjectState(); });
          on('f-fweight', 'change', function (e) { sel.fontWeight = e.target.value; saveProjectState(); });
          on('f-talign', 'change', function (e) { sel.textAlign = e.target.value; saveProjectState(); });
          slider('f-fsize', 'fontSize', function (v) { return v + 'px'; });
          slider('f-fspace', 'letterSpacing', function (v) { return v + 'px'; });
          slider('f-tshadow', 'textShadow', function (v) { return v + 'px'; });
          on('f-tcolor', 'input', function (e) { sel.textColor = e.target.value; saveProjectState(); });
          on('f-tbg-toggle', 'click', function () {
            sel.textBg = sel.textBg === 'transparent' ? '#111118' : 'transparent';
            renderInspector();
            saveProjectState();
          });

          document.querySelectorAll('[data-sm]').forEach(function (b) {
            b.addEventListener('click', function () { sel.solidMode = b.dataset.sm; renderInspector(); saveProjectState(); });
          });
          on('f-sc1', 'input', function (e) { sel.c1 = e.target.value; saveProjectState(); });
          on('f-sc2', 'input', function (e) { sel.c2 = e.target.value; saveProjectState(); });
          slider('f-gangle', 'gradAngle', function (v) { return v + '°'; });

          document.querySelectorAll('[data-map]').forEach(function (b) {
            b.addEventListener('click', function () { sel.contentMapping = b.dataset.map; renderInspector(); saveProjectState(); });
          });
          slider('f-czoom', 'contentZoom', function (v) { return Math.round(v * 100) + '%'; });
          slider('f-cpanx', 'contentPanX', function (v) { return v + '%'; });
          slider('f-cpany', 'contentPanY', function (v) { return v + '%'; });
          slider('f-crot', 'contentRot', function (v) { return v + '°'; });

          document.querySelectorAll('[data-wp]').forEach(function (card) {
            card.addEventListener('click', function () {
              pushHistory();
              const p = WINDOW_PRESETS.find(function (item) { return item.id === card.dataset.wp; });
              if (p) {
                sel.winPreset = p.id;
                sel.winArch = p.arch;
                sel.winArchCurve = p.archCurve;
                sel.winHBars = p.hBars;
                sel.winVBars = p.vBars;
                sel.winBarW = p.barW;
                sel.winFrameW = p.frameW;
                sel.winCornerR = p.cornerR;
                sel.winMode = p.mode;
                sel.winLattice = p.lattice;
                sel.winCircle = p.circle;
              }
              renderInspector();
              saveProjectState();
            });
          });
          on('f-warch', 'change', function (e) { sel.winArch = e.target.value; saveProjectState(); });
          on('f-wcurve', 'input', function (e) { sel.winArchCurve = Math.max(0, Math.min(60, parseFloat(e.target.value) || 0)); saveProjectState(); });
          on('f-whbars', 'input', function (e) { sel.winHBars = Math.max(0, Math.min(12, parseInt(e.target.value, 10) || 0)); saveProjectState(); });
          on('f-wvbars', 'input', function (e) { sel.winVBars = Math.max(0, Math.min(12, parseInt(e.target.value, 10) || 0)); saveProjectState(); });
          slider('f-wbarw', 'winBarW', function (v) { return v + 'px'; });
          slider('f-wframew', 'winFrameW', function (v) { return v + 'px'; });
          slider('f-wcorner', 'winCornerR', function (v) { return v + 'px'; });
          slider('f-wfeather', 'winFeather', function (v) { return v + 'px'; });
          on('f-wfcol', 'input', function (e) { sel.winFrameColor = e.target.value; saveProjectState(); });
          on('f-winvert', 'click', function () { sel.winInvert = !sel.winInvert; renderInspector(); saveProjectState(); });

          on('f-blend', 'change', function (e) { sel.blendMode = e.target.value; saveProjectState(); });
          slider('f-op', 'opacity', function (v) { return Math.round(v * 100) + '%'; });
          slider('f-bri', 'brightness', function (v) { return v.toFixed(2); });
          slider('f-con', 'contrast', function (v) { return v.toFixed(2); });
          slider('f-sat', 'saturation', function (v) { return v.toFixed(2); });
          slider('f-hue', 'hue', function (v) { return v + '°'; });
          slider('f-exp', 'exposure', function (v) { return v.toFixed(2); });
          slider('f-vig', 'vignette', function (v) { return Math.round(v * 100) + '%'; });
        }

        function renderTimeline() {
          const track = document.getElementById('cue-track');
          track.innerHTML = '';

          state.cues.forEach(function (cue, idx) {
            const active = idx === state.activeCueIndex;
            const blockW = Math.max(166, Math.min(360, (Number(cue.duration) || 8) * 18));
            const block = document.createElement('div');
            block.className = 'cue-block' + (active ? ' active' : '');
            block.style.width = blockW + 'px';

            const pct = active ? Math.min(100, (ui.cueElapsed / Math.max(0.1, cue.duration)) * 100) : 0;

            block.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">' +
                '<span class="mono" style="font-size:10px;color:' + (active ? '#a5b4fc' : 'var(--text-muted)') + ';font-weight:600;">0' + (idx + 1) + '</span>' +
                '<input type="text" value="' + cue.name.replace(/"/g, '&quot;') + '" data-cn="' + idx + '" style="background:transparent;border:none;font-size:12px;font-weight:600;width:100%;min-width:0;" />' +
                '<button class="btn btn-ico-sm danger" data-cdel="' + idx + '" title="Delete Cue" style="width:20px;height:20px;">✕</button>' +
              '</div>' +
              '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:11px;color:var(--text-secondary);">' +
                '<label style="display:inline-flex;align-items:center;gap:4px;">Hold <input type="number" class="mono" data-cdur="' + idx + '" min="0.5" max="300" step="0.5" value="' + cue.duration + '" style="width:46px;height:22px;background:var(--bg-control);border:1px solid var(--border-subtle);border-radius:5px;padding:0 4px;" />s</label>' +
                '<label style="display:inline-flex;align-items:center;gap:4px;">Fade <input type="number" class="mono" data-cfade="' + idx + '" min="0" max="15" step="0.1" value="' + cue.fade + '" style="width:44px;height:22px;background:var(--bg-control);border:1px solid var(--border-subtle);border-radius:5px;padding:0 4px;" />s</label>' +
              '</div>' +
              (active ? '<div class="cue-playhead" style="left:' + pct + '%;"></div>' : '') +
              '<div class="cue-resize-edge" title="Drag edge to adjust hold duration"></div>';

            block.addEventListener('click', function (e) {
              if (e.target.tagName === 'INPUT' || e.target.closest('button') || e.target.classList.contains('cue-resize-edge')) return;
              activateCue(idx, true);
            });

            block.addEventListener('dblclick', function (e) {
              const r = block.getBoundingClientRect();
              const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
              activateCue(idx, false);
              ui.cueElapsed = ratio * cue.duration;
              updateClockDisplay();
            });

            const edge = block.querySelector('.cue-resize-edge');
            edge.addEventListener('pointerdown', function (e) {
              e.stopPropagation();
              edge.setPointerCapture(e.pointerId);
              const startX = e.clientX;
              const startDur = Number(cue.duration) || 8;
              const onMove = function (ev) {
                const deltaSec = Math.round(((ev.clientX - startX) / 18) * 2) / 2;
                cue.duration = Math.max(0.5, Math.min(300, startDur + deltaSec));
                block.style.width = Math.max(166, Math.min(360, cue.duration * 18)) + 'px';
                const durInp = block.querySelector('[data-cdur]');
                if (durInp) durInp.value = String(cue.duration);
                updateClockDisplay();
              };
              const onUp = function () {
                edge.removeEventListener('pointermove', onMove);
                edge.removeEventListener('pointerup', onUp);
                saveProjectState();
              };
              edge.addEventListener('pointermove', onMove);
              edge.addEventListener('pointerup', onUp);
            });

            block.querySelector('[data-cn]').addEventListener('input', function (e) { cue.name = e.target.value; saveProjectState(); });
            block.querySelector('[data-cdur]').addEventListener('change', function (e) {
              cue.duration = Math.max(0.5, parseFloat(e.target.value) || 5);
              renderTimeline();
              saveProjectState();
            });
            block.querySelector('[data-cfade]').addEventListener('change', function (e) {
              cue.fade = Math.max(0, parseFloat(e.target.value) || 0);
              saveProjectState();
            });
            block.querySelector('[data-cdel]').addEventListener('click', function (e) {
              e.stopPropagation();
              if (state.cues.length <= 1) {
                showToast('At least one cue is required');
                return;
              }
              pushHistory();
              state.cues.splice(idx, 1);
              if (state.activeCueIndex >= state.cues.length) state.activeCueIndex = state.cues.length - 1;
              renderTimeline();
              saveProjectState();
            });

            track.appendChild(block);
          });

          updateClockDisplay();
        }

        function formatSec(s) {
          const val = Math.max(0, s);
          const m = Math.floor(val / 60);
          const sec = (val % 60).toFixed(1).padStart(4, '0');
          return String(m).padStart(2, '0') + ':' + sec;
        }

        function updateClockDisplay() {
          const total = state.cues.reduce(function (acc, c) { return acc + (Number(c.duration) || 0); }, 0);
          let cur = ui.cueElapsed;
          for (let i = 0; i < state.activeCueIndex; i++) cur += Number(state.cues[i].duration) || 0;
          document.getElementById('show-clock').textContent = formatSec(cur) + ' / ' + formatSec(total);
          const head = document.querySelector('.cue-playhead');
          const activeCue = state.cues[state.activeCueIndex];
          if (head && activeCue) {
            head.style.left = Math.min(100, (ui.cueElapsed / Math.max(0.1, activeCue.duration)) * 100) + '%';
          }
        }

        function fullUIRefresh() {
          resizeCanvas();
          renderLayers();
          renderInspector();
          renderTimeline();
        }

        function showToast(msg, withUndo) {
          const el = document.getElementById('toast');
          el.innerHTML = '<span>' + msg + '</span>' + (withUndo ? '<button class="btn btn-sm primary" id="toast-undo-btn" style="height:22px;">Undo</button>' : '');
          el.classList.add('show');
          if (withUndo) {
            const b = document.getElementById('toast-undo-btn');
            if (b) b.onclick = function () { el.classList.remove('show'); undo(); };
          }
          clearTimeout(el._t);
          el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }

          document.getElementById('tool-box').classList.toggle('active', t === 'box');
          document.getElementById('tool-warp').classList.toggle('active', t === 'warp');
          document.getElementById('tool-pen').classList.toggle('active', t === 'pen');
          const desc = {
            box: 'Transform',
            warp: 'Perspective Warp',
            pen: 'Pen Tool — Click vertices to draw'
          };
          document.getElementById('hud-mode').textContent = desc[t] || t;
        }
