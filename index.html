                '<div class="srow"><span class="slabel">Frame</span><input type="range" id="f-wframew" min="0" max="90" step="1" value="' + sel.winFrameW + '" /><span class="sval">' + sel.winFrameW + 'px</span></div>' +
                '<div class="srow"><span class="slabel">Radius</span><input type="range" id="f-wcorner" min="0" max="140" step="2" value="' + sel.winCornerR + '" /><span class="sval">' + sel.winCornerR + 'px</span></div>' +
                '<div class="srow">' +
                  '<label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);"><input type="color" id="f-wfcol" value="' + (sel.winFrameColor || '#000000') + '" /><span>Frame Color</span></label>' +
                  '<button class="ibtn solid ' + (sel.winInvert ? 'active' : '') + '" id="f-winvert">Invert</button>' +
                '</div>' +
              '</div>';
          } else if (ui.inspTab === 'shape') {
            body.innerHTML =
              '<div class="sec">' +
                '<div class="sec-title"><span>Layer Name</span></div>' +
                '<input type="text" id="f-name" class="inp" value="' + sel.name.replace(/"/g, '&quot;') + '" />' +
              '</div>' +
              '<div class="sec">' +
                '<div class="sec-title"><span>Geometry</span><span class="num" style="color:var(--text-muted);">' + Math.round(b.w) + '×' + Math.round(b.h) + '</span></div>' +
                '<div class="g2" style="margin-bottom:9px;">' +
                  '<div><span class="slabel" style="font-size:11px;">X</span><input type="number" id="f-x" class="inp num" value="' + Math.round(b.minX) + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Y</span><input type="number" id="f-y" class="inp num" value="' + Math.round(b.minY) + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Width</span><input type="number" id="f-w" class="inp num" value="' + Math.round(b.w) + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Height</span><input type="number" id="f-h" class="inp num" value="' + Math.round(b.h) + '" /></div>' +
                '</div>' +
                '<div class="g3">' +
                  '<button class="ibtn solid" id="f-scale-dn">−10%</button>' +
                  '<button class="ibtn solid" id="f-scale-up">+10%</button>' +
                  '<button class="ibtn solid" id="f-rot-15">+15°</button>' +
                '</div>' +
              '</div>';
          } else if (ui.inspTab === 'clip') {
            body.innerHTML = selClip ? (
              '<div class="sec">' +
                '<div class="sec-title"><span>Timeline Clip</span><span class="num">' + selClip.start.toFixed(1) + 's</span></div>' +
                '<div class="srow"><input type="text" id="fc-name" class="inp" value="' + selClip.name.replace(/"/g, '&quot;') + '" /></div>' +
                '<div class="g2">' +
                  '<div><span class="slabel" style="font-size:11px;">Start (s)</span><input type="number" id="fc-start" class="inp num" min="0" step="0.5" value="' + selClip.start + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Length (s)</span><input type="number" id="fc-dur" class="inp num" min="0.5" step="0.5" value="' + selClip.duration + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Fade In</span><input type="number" id="fc-fin" class="inp num" min="0" max="10" step="0.2" value="' + selClip.fadeIn + '" /></div>' +
                  '<div><span class="slabel" style="font-size:11px;">Fade Out</span><input type="number" id="fc-fout" class="inp num" min="0" max="10" step="0.2" value="' + selClip.fadeOut + '" /></div>' +
                '</div>' +
              '</div>'
            ) : '<div style="padding:28px 12px;text-align:center;color:var(--text-muted);font-size:12px;">Click a clip on the timeline to edit timing</div>';
          }

          bindInspectorHandlers(sel, selClip);
        }

        function bindInspectorHandlers(sel, selClip) {
          const on = function (id, ev, fn) { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
          const slider = function (id, key, fmt) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', function () {
              sel[key] = parseFloat(el.value);
              const vEl = el.parentElement.querySelector('.sval');
              if (vEl) vEl.textContent = fmt(sel[key]);
              syncLayerToActiveClip(sel);
              syncProjector(false);
            });
            el.addEventListener('change', scheduleSave);
          };

          if (selClip) {
            on('fc-name', 'input', function (e) { selClip.name = e.target.value; renderTimeline(); scheduleSave(); });
            on('fc-start', 'change', function (e) { selClip.start = Math.max(0, parseFloat(e.target.value) || 0); renderTimeline(); scheduleSave(); });
            on('fc-dur', 'change', function (e) { selClip.duration = Math.max(0.5, parseFloat(e.target.value) || 1); renderTimeline(); scheduleSave(); });
            on('fc-fin', 'change', function (e) { selClip.fadeIn = Math.max(0, parseFloat(e.target.value) || 0); renderTimeline(); scheduleSave(); });
            on('fc-fout', 'change', function (e) { selClip.fadeOut = Math.max(0, parseFloat(e.target.value) || 0); renderTimeline(); scheduleSave(); });
          }

          on('f-name', 'input', function (e) {
            sel.name = e.target.value;
            document.getElementById('insp-title').textContent = sel.name;
            renderLayers();
            renderTimeline();
            scheduleSave();
          });

          const syncRectInputs = function () {
            pushHistory();
            const b = getBounds(sel);
            const nx = parseFloat(document.getElementById('f-x').value) || 0;
            const ny = parseFloat(document.getElementById('f-y').value) || 0;
            const nw = Math.max(12, parseFloat(document.getElementById('f-w').value) || b.w);
            const nh = Math.max(12, parseFloat(document.getElementById('f-h').value) || b.h);
            sel.points = sel.points.map(function (p) {
              return { x: Math.round(nx + ((p.x - b.minX) / b.w) * nw), y: Math.round(ny + ((p.y - b.minY) / b.h) * nh) };
            });
            meshCache.delete(sel.id);
            ui.overlayDirty = true;
            syncLayerToActiveClip(sel);
            renderInspector();
            scheduleSave();
          };
          ['f-x', 'f-y', 'f-w', 'f-h'].forEach(function (id) { on(id, 'change', syncRectInputs); });

          function scaleLayerBy(factor) {
            pushHistory();
            const b = getBounds(sel);
            sel.points = sel.points.map(function (p) { return { x: Math.round(b.cx + (p.x - b.cx) * factor), y: Math.round(b.cy + (p.y - b.cy) * factor) }; });
            meshCache.delete(sel.id);
            ui.overlayDirty = true;
            syncLayerToActiveClip(sel);
            renderInspector();
            scheduleSave();
          }
          on('f-scale-dn', 'click', function () { scaleLayerBy(0.9); });
          on('f-scale-up', 'click', function () { scaleLayerBy(1.1); });
          on('f-rot-15', 'click', function () {
            pushHistory();
            const b = getBounds(sel);
            const rad = (15 * Math.PI) / 180;
            const c = Math.cos(rad), s = Math.sin(rad);
            sel.points = sel.points.map(function (p) {
              const rx = p.x - b.cx, ry = p.y - b.cy;
              return { x: Math.round(b.cx + rx * c - ry * s), y: Math.round(b.cy + rx * s + ry * c) };
            });
            meshCache.delete(sel.id);
            ui.overlayDirty = true;
            syncLayerToActiveClip(sel);
            renderInspector();
            scheduleSave();
          });

          document.querySelectorAll('[data-src]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              pushHistory();
              sel.sourceType = btn.dataset.src;
              syncLayerToActiveClip(sel);
              renderInspector();
              scheduleSave();
            });
          });
          document.querySelectorAll('[data-sh]').forEach(function (card) {
            card.addEventListener('click', function () {
              pushHistory();
              sel.shaderId = card.dataset.sh;
              const found = SHADERS.find(function (s) { return s.id === sel.shaderId; });
              if (found) { sel.c1 = found.c1; sel.c2 = found.c2; sel.c3 = found.c3; }
              if (selClip) selClip.name = found ? found.name : selClip.name;
              syncLayerToActiveClip(sel);
              renderLayers();
              renderInspector();
              renderTimeline();
              scheduleSave();
            });
          });

          on('f-c1', 'input', function (e) { sel.c1 = e.target.value; syncLayerToActiveClip(sel); renderLayers(); syncProjector(false); });
          on('f-c2', 'input', function (e) { sel.c2 = e.target.value; syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-c3', 'input', function (e) { sel.c3 = e.target.value; syncLayerToActiveClip(sel); syncProjector(false); });
          ['f-c1', 'f-c2', 'f-c3'].forEach(function (id) { on(id, 'change', scheduleSave); });
          slider('f-speed', 'speed', function (v) { return v.toFixed(2) + '×'; });
          slider('f-scale', 'scale', function (v) { return v.toFixed(2); });
          slider('f-intensity', 'intensity', function (v) { return v.toFixed(2); });
          slider('f-op', 'opacity', function (v) { return Math.round(v * 100) + '%'; });

          on('f-upload', 'click', function () { document.getElementById('file-media').click(); });

          on('f-text', 'input', function (e) { sel.text = e.target.value; syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-text', 'change', scheduleSave);
          on('f-font-sel', 'change', function (e) {
            sel.fontFamily = e.target.value;
            const customInp = document.getElementById('f-font-custom');
            if (customInp) customInp.value = sel.fontFamily;
            ensureGoogleFont(sel.fontFamily);
            textCache.delete(sel.id);
            syncLayerToActiveClip(sel);
            scheduleSave();
          });
          on('f-font-custom', 'change', function (e) {
            sel.fontFamily = e.target.value.trim() || 'Inter';
            ensureGoogleFont(sel.fontFamily);
            textCache.delete(sel.id);
            syncLayerToActiveClip(sel);
            scheduleSave();
          });
          on('f-fweight', 'change', function (e) { sel.fontWeight = e.target.value; textCache.delete(sel.id); syncLayerToActiveClip(sel); scheduleSave(); });
          on('f-talign', 'change', function (e) { sel.textAlign = e.target.value; textCache.delete(sel.id); syncLayerToActiveClip(sel); scheduleSave(); });
          slider('f-fsize', 'fontSize', function (v) { return v + 'px'; });
          slider('f-fspace', 'letterSpacing', function (v) { return v + 'px'; });
          on('f-tcolor', 'input', function (e) { sel.textColor = e.target.value; textCache.delete(sel.id); syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-tcolor', 'change', scheduleSave);
          on('f-tbg-toggle', 'click', function () {
            sel.textBg = sel.textBg === 'transparent' ? '#14141a' : 'transparent';
            textCache.delete(sel.id);
            syncLayerToActiveClip(sel);
            renderInspector();
            scheduleSave();
          });

          document.querySelectorAll('[data-sm]').forEach(function (b) {
            b.addEventListener('click', function () { sel.solidMode = b.dataset.sm; syncLayerToActiveClip(sel); renderInspector(); scheduleSave(); });
          });
          on('f-sc1', 'input', function (e) { sel.c1 = e.target.value; syncLayerToActiveClip(sel); renderLayers(); syncProjector(false); });
          on('f-sc2', 'input', function (e) { sel.c2 = e.target.value; syncLayerToActiveClip(sel); syncProjector(false); });

          document.querySelectorAll('[data-map]').forEach(function (b) {
            b.addEventListener('click', function () { sel.contentMapping = b.dataset.map; syncLayerToActiveClip(sel); renderInspector(); scheduleSave(); });
          });
          slider('f-czoom', 'contentZoom', function (v) { return Math.round(v * 100) + '%'; });
          slider('f-cpanx', 'contentPanX', function (v) { return v + '%'; });
          slider('f-cpany', 'contentPanY', function (v) { return v + '%'; });

          document.querySelectorAll('[data-wp]').forEach(function (card) {
            card.addEventListener('click', function () {
              pushHistory();
              const p = WINDOW_PRESETS.find(function (item) { return item.id === card.dataset.wp; });
              if (p) {
                sel.winPreset = p.id; sel.winArch = p.arch; sel.winArchCurve = p.archCurve;
                sel.winHBars = p.hBars; sel.winVBars = p.vBars; sel.winBarW = p.barW;
                sel.winFrameW = p.frameW; sel.winCornerR = p.cornerR; sel.winMode = p.mode;
                sel.winLattice = p.lattice; sel.winCircle = p.circle;
              }
              syncLayerToActiveClip(sel);
              renderInspector();
              scheduleSave();
            });
          });
          on('f-warch', 'change', function (e) { sel.winArch = e.target.value; syncLayerToActiveClip(sel); scheduleSave(); });
          on('f-wcurve', 'input', function (e) { sel.winArchCurve = Math.max(0, Math.min(60, parseFloat(e.target.value) || 0)); syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-whbars', 'input', function (e) { sel.winHBars = Math.max(0, Math.min(12, parseInt(e.target.value, 10) || 0)); syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-wvbars', 'input', function (e) { sel.winVBars = Math.max(0, Math.min(12, parseInt(e.target.value, 10) || 0)); syncLayerToActiveClip(sel); syncProjector(false); });
          slider('f-wbarw', 'winBarW', function (v) { return v + 'px'; });
          slider('f-wframew', 'winFrameW', function (v) { return v + 'px'; });
          slider('f-wcorner', 'winCornerR', function (v) { return v + 'px'; });
          slider('f-wfeather', 'winFeather', function (v) { return v + 'px'; });
          on('f-wfcol', 'input', function (e) { sel.winFrameColor = e.target.value; syncLayerToActiveClip(sel); syncProjector(false); });
          on('f-winvert', 'click', function () { sel.winInvert = !sel.winInvert; syncLayerToActiveClip(sel); renderInspector(); scheduleSave(); });
        }

        function formatSec(s) {
          const val = Math.max(0, s);
          const m = Math.floor(val / 60);
          const sec = (val % 60).toFixed(1).padStart(4, '0');
          return String(m).padStart(2, '0') + ':' + sec;
        }

        function updatePlayheadUI() {
          const x = ui.playheadSec * ui.pxPerSec;
          const ph = document.getElementById('playhead');
          if (ph) ph.style.left = x + 'px';
          document.getElementById('show-clock').textContent = formatSec(ui.playheadSec) + ' / ' + formatSec(state.showDuration);
        }

        function scrubToSec(sec) {
          ui.playheadSec = Math.max(0, Math.min(state.showDuration, sec));
          state.layers.forEach(function (l) {
            const c = getActiveClipAt(l, ui.playheadSec);
            if (c) {
              if (l.id === state.selectedLayerId) state.selectedClipId = c.id;
              applyClipToLayer(l, c, ui.playheadSec);
              meshCache.delete(l.id);
            }
          });
          ui.overlayDirty = true;
          updatePlayheadUI();
          renderInspector();
          syncProjector(false);
        }

        function renderTimeline() {
          const trackList = document.getElementById('tl-track-list');
          const lanesBox = document.getElementById('tl-lanes');
          const ruler = document.getElementById('tl-ruler');
          const area = document.getElementById('tl-area');
          const totalW = Math.max(600, Math.round(state.showDuration * ui.pxPerSec + 80));

          area.style.width = totalW + 'px';
          ruler.innerHTML = '';
          const stepSec = ui.pxPerSec >= 60 ? 1 : ui.pxPerSec >= 35 ? 2 : 5;
          for (let t = 0; t <= state.showDuration; t += stepSec) {
            const tick = document.createElement('div');
            tick.className = 'rtick';
            tick.style.left = (t * ui.pxPerSec) + 'px';
            tick.textContent = t + 's';
            ruler.appendChild(tick);
          }

          trackList.innerHTML = '';
          lanesBox.innerHTML = '';

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            const isSelLayer = l.id === state.selectedLayerId;
            const activeNow = Boolean(getActiveClipAt(l, ui.playheadSec));

            const th = document.createElement('div');
            th.className = 'tl-thead' + (isSelLayer ? ' selected' : '');
            th.innerHTML =
              '<span style="width:7px;height:7px;border-radius:50%;background:' + (activeNow ? '#10b981' : 'rgba(255,255,255,0.16)') + ';flex-shrink:0;"></span>' +
              '<span title="' + l.name.replace(/"/g, '&quot;') + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + l.name + '</span>';
            th.onclick = function () {
              state.selectedLayerId = l.id;
              const ac = getActiveClipAt(l, ui.playheadSec) || (l.clips && l.clips[0]);
              if (ac) { state.selectedClipId = ac.id; applyClipToLayer(l, ac); meshCache.delete(l.id); }
              ui.overlayDirty = true;
              renderLayers();
              renderInspector();
              renderTimeline();
              syncProjector(true);
            };
            trackList.appendChild(th);

            const lane = document.createElement('div');
            lane.className = 'tl-lane' + (isSelLayer ? ' selected' : '');
            lane.addEventListener('dblclick', function (e) {
              if (e.target !== lane) return;
              const rect = lane.getBoundingClientRect();
              const clickSec = Math.max(0, Math.round(((e.clientX - rect.left) / ui.pxPerSec) * 2) / 2);
              pushHistory();
              const nc = createClip(l, clickSec, Math.min(6, Math.max(1, state.showDuration - clickSec)), l.name);
              l.clips.push(nc);
              state.selectedLayerId = l.id;
              state.selectedClipId = nc.id;
              fullUIRefresh();
              scheduleSave();
            });

            (l.clips || []).forEach(function (clip) {
              const el = document.createElement('div');
              el.className = 'tl-clip' + (clip.id === state.selectedClipId ? ' selected' : '') + (l.kind === 'mask' ? ' mask' : '');
              el.style.left = (clip.start * ui.pxPerSec) + 'px';
              el.style.width = Math.max(20, clip.duration * ui.pxPerSec) + 'px';
              el.innerHTML =
                '<div class="trim-l"></div>' +
                '<span style="overflow:hidden;text-overflow:ellipsis;pointer-events:none;flex:1;">' + clip.name + '</span>' +
                '<div class="trim-r"></div>';

              el.addEventListener('pointerdown', function (e) {
                e.stopPropagation();
                state.selectedLayerId = l.id;
                state.selectedClipId = clip.id;
                applyClipToLayer(l, clip);
                meshCache.delete(l.id);
                ui.overlayDirty = true;
                renderLayers();
                renderInspector();
                syncProjector(true);

                const isTrimL = e.target.classList.contains('trim-l');
                const isTrimR = e.target.classList.contains('trim-r');
                const mode = isTrimL ? 'trimL' : isTrimR ? 'trimR' : 'move';
                const startX = e.clientX;
                const origStart = clip.start;
                const origDur = clip.duration;
                pushHistory();
                el.setPointerCapture(e.pointerId);

                const onMove = function (ev) {
                  const dSec = Math.round(((ev.clientX - startX) / ui.pxPerSec) * 4) / 4;
                  if (mode === 'move') {
                    clip.start = Math.max(0, Math.min(state.showDuration - clip.duration, origStart + dSec));
                  } else if (mode === 'trimR') {
                    clip.duration = Math.max(0.5, Math.min(state.showDuration - clip.start, origDur + dSec));
                  } else if (mode === 'trimL') {
                    const maxShift = origDur - 0.5;
                    const shift = Math.max(-origStart, Math.min(maxShift, dSec));
                    clip.start = origStart + shift;
                    clip.duration = origDur - shift;
                  }
                  el.style.left = (clip.start * ui.pxPerSec) + 'px';
                  el.style.width = Math.max(20, clip.duration * ui.pxPerSec) + 'px';
                };
                const onUp = function () {
                  el.removeEventListener('pointermove', onMove);
                  el.removeEventListener('pointerup', onUp);
                  renderTimeline();
                  renderInspector();
                  scheduleSave();
                };
                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', onUp);
              });

              lane.appendChild(el);
            });

            lanesBox.appendChild(lane);
          }

          updatePlayheadUI();
        }

        const rulerEl = document.getElementById('tl-ruler');
        rulerEl.addEventListener('pointerdown', function (e) {
          ui.isPlaying = false;
          updatePlayBtn();
          rulerEl.setPointerCapture(e.pointerId);
          const seek = function (ev) {
            const rect = rulerEl.getBoundingClientRect();
            scrubToSec((ev.clientX - rect.left) / ui.pxPerSec);
          };
          seek(e);
          const onUp = function () {
            rulerEl.removeEventListener('pointermove', seek);
            rulerEl.removeEventListener('pointerup', onUp);
            renderTimeline();
          };
          rulerEl.addEventListener('pointermove', seek);
          rulerEl.addEventListener('pointerup', onUp);
        });

        function fullUIRefresh() {
          resizeCanvas();
          renderLayers();
          renderInspector();
          renderTimeline();
        }

        function updateHint() {
          const h = document.getElementById('stage-top-hint');
          if (!h) return;
          if (ui.tool === 'box') h.textContent = 'Drag surface to move • Backspace to delete';
          else if (ui.tool === 'warp') h.textContent = 'Drag corners to perspective warp • Backspace to delete';
          else h.textContent = ui.penPoints.length === 0 ? 'Click stage to place polygon points' : 'Click first green dot or press Enter to close (' + ui.penPoints.length + ' pts)';
        }

        function showToast(msg, withUndo) {
          const el = document.getElementById('toast');
          el.innerHTML = '<span>' + msg + '</span>' + (withUndo ? '<button class="ibtn primary" id="toast-undo" style="height:21px;padding:0 8px;font-size:11px;">Undo</button>' : '');
          el.classList.add('show');
          if (withUndo) {
            const b = document.getElementById('toast-undo');
            if (b) b.onclick = function () { el.classList.remove('show'); undo(); };
          }
          clearTimeout(el._t);
          el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
        }

        function setTool(t) {
          ui.tool = t;
          if (t !== 'pen') { ui.penPoints = []; ui.penCursorPt = null; }
          document.getElementById('tool-box').classList.toggle('active', t === 'box');
          document.getElementById('tool-warp').classList.toggle('active', t === 'warp');
          document.getElementById('tool-pen').classList.toggle('active', t === 'pen');
          overlayCanvas.style.cursor = t === 'pen' ? 'crosshair' : 'default';
          ui.overlayDirty = true;
          updateHint();
        }

        document.getElementById('tool-box').onclick = function () { setTool('box'); };
        document.getElementById('tool-warp').onclick = function () { setTool('warp'); };
        document.getElementById('tool-pen').onclick = function () { ui.penPoints = []; setTool('pen'); };

        function addLayerType(type) {
          pushHistory();
          const l = createLayer(type);
          state.layers.push(l);
          state.selectedLayerId = l.id;
          state.selectedClipId = l.clips[0].id;
          ui.overlayDirty = true;
          fullUIRefresh();
          scheduleSave();
        }

        document.getElementById('add-quad').onclick = function () { addLayerType('quad'); };
        document.getElementById('add-arch').onclick = function () { addLayerType('arch'); };
        document.getElementById('add-text').onclick = function () { addLayerType('text'); };
        document.getElementById('add-mask').onclick = function () { addLayerType('mask'); };

        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-redo').onclick = redo;
        document.getElementById('btn-snap').onclick = function () { ui.snap = !ui.snap; this.classList.toggle('active', ui.snap); };
        document.getElementById('btn-grid').onclick = function () { ui.showGrid = !ui.showGrid; ui.overlayDirty = true; this.classList.toggle('active', ui.showGrid); };

        document.getElementById('sel-res').onchange = function (e) {
          const v = e.target.value;
          if (v === 'custom') {
            const w = parseInt(prompt('Width (px):', String(state.width)) || '', 10);
            const h = parseInt(prompt('Height (px):', String(state.height)) || '', 10);
            if (w >= 320 && h >= 240) { state.width = w; state.height = h; }
          } else {
            const parts = v.split('x').map(Number);
            if (parts[0] && parts[1]) { state.width = parts[0]; state.height = parts[1]; }
          }
          ui.zoomManual = false;
          resizeCanvas();
          scheduleSave();
        };

        document.getElementById('btn-zoom-in').onclick = function () { ui.zoomManual = true; ui.zoom = Math.min(3, ui.zoom * 1.15); resizeCanvas(); };
        document.getElementById('btn-zoom-out').onclick = function () { ui.zoomManual = true; ui.zoom = Math.max(0.15, ui.zoom / 1.15); resizeCanvas(); };
        document.getElementById('btn-zoom-fit').onclick = function () { ui.zoomManual = false; resizeCanvas(); };
        document.getElementById('btn-projector').onclick = openProjectorWindow;

        function updatePlayBtn() {
          document.getElementById('txt-play').textContent = ui.isPlaying ? 'Pause' : 'Play';
          document.getElementById('ico-play').innerHTML = ui.isPlaying
            ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
            : '<polygon points="6 4 20 12 6 20 6 4"/>';
        }
        function togglePlay() {
          ui.isPlaying = !ui.isPlaying;
          updatePlayBtn();
          if (!ui.isPlaying) renderTimeline();
        }
        document.getElementById('btn-play').onclick = togglePlay;
        document.getElementById('btn-to-start').onclick = function () { scrubToSec(0); renderTimeline(); };
        document.getElementById('inp-show-len').onchange = function (e) {
          state.showDuration = Math.max(5, Math.min(600, parseFloat(e.target.value) || 30));
          renderTimeline();
          scheduleSave();
        };
        document.getElementById('btn-loop').onclick = function () {
          ui.loopShow = !ui.loopShow;
          this.classList.toggle('active', ui.loopShow);
        };
        document.getElementById('rng-tl-zoom').oninput = function (e) {
          ui.pxPerSec = parseInt(e.target.value, 10) || 44;
          renderTimeline();
        };

        document.getElementById('btn-blade').onclick = function () {
          const sel = getSelectedLayer();
          if (!sel) return;
          const clip = getActiveClipAt(sel, ui.playheadSec);
          if (!clip || ui.playheadSec <= clip.start + 0.3 || ui.playheadSec >= clip.start + clip.duration - 0.3) {
            showToast('Move playhead inside a clip to split');
            return;
          }
          pushHistory();
          const splitPoint = Math.round(ui.playheadSec * 4) / 4;
          const rightPart = cloneObj(clip);
          rightPart.id = uid('clip');
          rightPart.start = splitPoint;
          rightPart.duration = clip.start + clip.duration - splitPoint;
          clip.duration = splitPoint - clip.start;
          sel.clips.push(rightPart);
          state.selectedClipId = rightPart.id;
          renderTimeline();
          renderInspector();
          scheduleSave();
        };

        document.getElementById('btn-add-clip').onclick = function () {
          const sel = getSelectedLayer();
          if (!sel) return;
          pushHistory();
          const lastEnd = sel.clips.reduce(function (m, c) { return Math.max(m, c.start + c.duration); }, 0);
          const startAt = lastEnd < state.showDuration - 1 ? lastEnd : Math.min(ui.playheadSec, state.showDuration - 2);
          const nc = createClip(sel, startAt, Math.min(6, Math.max(1, state.showDuration - startAt)), sel.name);
          sel.clips.push(nc);
          state.selectedClipId = nc.id;
          renderTimeline();
          renderInspector();
          scheduleSave();
        };

        document.getElementById('btn-del-clip').onclick = function () {
          const sel = getSelectedLayer();
          if (!sel || !sel.clips) return;
          const idx = sel.clips.findIndex(function (c) { return c.id === state.selectedClipId; });
          if (idx < 0) return;
          pushHistory();
          sel.clips.splice(idx, 1);
          state.selectedClipId = sel.clips[0] ? sel.clips[0].id : null;
          renderTimeline();
          renderInspector();
          scheduleSave();
        };

        function loadMediaFileIntoSelected(file) {
          if (!file || (!file.type.startsWith('video/') && !file.type.startsWith('image/'))) return;
          let sel = getSelectedLayer();
          if (!sel) {
            sel = createLayer('quad', file.name.replace(/\.[^.]+$/, ''));
            state.layers.push(sel);
            state.selectedLayerId = sel.id;
            state.selectedClipId = sel.clips[0].id;
          }
          const reader = new FileReader();
          reader.onload = function () {
            pushHistory();
            sel.kind = 'surface';
            sel.sourceType = 'media';
            sel.mediaType = file.type.startsWith('video/') ? 'video' : 'image';
            sel.mediaName = file.name;
            sel.mediaDataUrl = String(reader.result || '');
            mediaCache.delete(sel.id);
            syncLayerToActiveClip(sel);
            fullUIRefresh();
            scheduleSave();
            showToast('Loaded ' + file.name);
          };
          reader.readAsDataURL(file);
        }

        document.getElementById('file-media').addEventListener('change', function (e) {
          if (e.target.files && e.target.files[0]) loadMediaFileIntoSelected(e.target.files[0]);
          e.target.value = '';
        });

        ['dragover', 'drop'].forEach(function (evName) {
          document.body.addEventListener(evName, function (e) {
            e.preventDefault();
            if (evName === 'drop' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
              loadMediaFileIntoSelected(e.dataTransfer.files[0]);
            }
          });
        });

        function loadSavedList() {
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }
        function renderProjectsModal() {
          document.getElementById('inp-proj-name').value = state.projectName || 'Thesis Show';
          const box = document.getElementById('proj-list');
          const list = loadSavedList();
          if (!list.length) {
            box.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:12px;">No saved shows yet</div>';
            return;
          }
          box.innerHTML = '';
          list.forEach(function (p, idx) {
            const row = document.createElement('div');
            row.className = 'lyr-card';
            row.style.background = 'var(--bg-control)';
            row.innerHTML = '<span class="lyr-title">' + (p.projectName || 'Untitled') + '</span><span class="num" style="color:var(--text-muted);font-size:11px;">' + p.width + '×' + p.height + '</span><button class="ibtn primary" style="height:23px;padding:0 9px;font-size:11px;" data-ld="' + idx + '">Load</button><button class="mini-ico del" data-rm="' + idx + '">✕</button>';
            row.querySelector('[data-ld]').onclick = function () {
              pushHistory();
              state = cloneObj(p);
              ui.playheadSec = 0;
              meshCache.clear();
              ui.overlayDirty = true;
              fullUIRefresh();
              scheduleSave();
              document.getElementById('projects-modal').classList.remove('open');
              showToast('Loaded ' + state.projectName);
            };
            row.querySelector('[data-rm]').onclick = function () {
              list.splice(idx, 1);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
              renderProjectsModal();
            };
            box.appendChild(row);
          });
        }

        document.getElementById('btn-projects').onclick = function () { renderProjectsModal(); document.getElementById('projects-modal').classList.add('open'); };
        document.getElementById('btn-close-projects').onclick = function () { document.getElementById('projects-modal').classList.remove('open'); };
        document.getElementById('btn-save-proj').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'Thesis Show';
          const list = loadSavedList();
          const idx = list.findIndex(function (p) { return p.projectName === state.projectName; });
          if (idx >= 0) list[idx] = cloneObj(state);
          else list.unshift(cloneObj(state));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          scheduleSave();
          renderProjectsModal();
          showToast('Saved');
        };
        document.getElementById('btn-new-proj').onclick = function () {
          pushHistory();
          const q = createLayer('quad', 'Surface');
          state = { projectName: 'New Show', width: 1920, height: 1080, showDuration: 30, layers: [q], selectedLayerId: q.id, selectedClipId: q.clips[0].id };
          ui.playheadSec = 0;
          meshCache.clear();
          ui.overlayDirty = true;
          fullUIRefresh();
          scheduleSave();
          document.getElementById('projects-modal').classList.remove('open');
        };
        document.getElementById('btn-export-pmap').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'maptor_show';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
          a.download = state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.pmap';
          a.click();
        };
        document.getElementById('btn-import-pmap').onclick = function () { document.getElementById('file-pmap').click(); };
        document.getElementById('file-pmap').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = function () {
            try {
              const p = JSON.parse(String(r.result || '{}'));
              if (p && Array.isArray(p.layers)) {
                pushHistory();
                state = p;
                ui.playheadSec = 0;
                meshCache.clear();
                ui.overlayDirty = true;
                fullUIRefresh();
                scheduleSave();
                document.getElementById('projects-modal').classList.remove('open');
                showToast('Imported');
              }
            } catch (err) { showToast('Invalid file'); }
          };
          r.readAsText(f);
          e.target.value = '';
        });
        document.getElementById('btn-export-png').onclick = function () {
          renderer.render(state.width, state.height, getEvaluatedLayers(), ui.clockSec);
          const a = document.createElement('a');
          a.href = glCanvas.toDataURL('image/png');
          a.download = (state.projectName || 'maptor').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.png';
          a.click();
        };

        window.addEventListener('keydown', function (e) {
          const active = document.activeElement;
          const tag = active && active.tagName ? active.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || (active && active.isContentEditable)) return;

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            if (ui.tool === 'pen' && ui.penPoints.length > 0) {
              ui.penPoints.pop();
              ui.overlayDirty = true;
              updateHint();
              return;
            }
            const sel = getSelectedLayer();
            if (sel && ui.tool === 'warp' && ui.activeVertex >= 0 && sel.points.length > 3) {
              pushHistory();
              sel.points.splice(ui.activeVertex, 1);
              ui.activeVertex = -1;
              meshCache.delete(sel.id);
              syncLayerToActiveClip(sel);
              ui.overlayDirty = true;
              renderInspector();
              scheduleSave();
              showToast('Corner removed');
            } else if (sel) {
              deleteSelectedLayer();
            }
          } else if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key.toLowerCase() === 'b') {
            document.getElementById('btn-blade').click();
          } else if (e.key.toLowerCase() === 'v') {
            setTool('box');
          } else if (e.key.toLowerCase() === 'w') {
            setTool('warp');
          } else if (e.key.toLowerCase() === 'p') {
            setTool('pen');
          } else if (e.key === 'Enter' && ui.tool === 'pen') {
            commitPenPolygon();
          } else if (e.key === 'Escape' && ui.tool === 'pen') {
            ui.penPoints = [];
            setTool('box');
          }
        });

        let fpsFrames = 0, fpsTimer = 0;
        function tick(now) {
          const dt = Math.min(0.1, (now - ui.lastTime) * 0.001);
          ui.lastTime = now;
          ui.clockSec += dt;

          fpsFrames++;
          fpsTimer += dt;
          if (fpsTimer >= 0.6) {
            document.getElementById('hud-fps').textContent = Math.round(fpsFrames / fpsTimer) + ' FPS';
            fpsFrames = 0;
            fpsTimer = 0;
          }

          const evalLayers = getEvaluatedLayers();

          if (ui.isPlaying) {
            ui.playheadSec += dt;
            if (ui.playheadSec >= state.showDuration) {
              if (ui.loopShow) ui.playheadSec = 0;
              else { ui.playheadSec = state.showDuration; togglePlay(); }
            }
            updatePlayheadUI();
            syncProjector(false);
          }

          renderer.render(state.width, state.height, evalLayers, ui.clockSec);
          drawOverlay();

          requestAnimationFrame(tick);
        }

        updateHint();
        fullUIRefresh();
        syncProjector(true);
        requestAnimationFrame(tick);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
