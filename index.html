        function getMaxShowTime() {
          let maxT = Math.max(10, Number(state.showDuration) || 20);
          state.layers.forEach(function (l) {
            (l.clips || []).forEach(function (c) {
              if (c.start + c.duration > maxT) maxT = c.start + c.duration;
            });
          });
          return maxT;
        }

        function renderTimeline() {
          const pps = ui.tlPxPerSec;
          const maxT = getMaxShowTime() + 4;
          const totalW = Math.max(800, Math.round(maxT * pps));

          const inner = document.getElementById('tl-canvas-inner');
          inner.style.width = totalW + 'px';

          const ruler = document.getElementById('tl-ruler');
          ruler.innerHTML = '';

          for (let s = 0; s <= maxT; s += 1) {
            const tick = document.createElement('div');
            const isMajor = s % 5 === 0;
            tick.style.cssText = 'position:absolute;bottom:0;left:' + (s * pps) + 'px;width:1px;height:' + (isMajor ? '10px' : '5px') + ';background:rgba(255,255,255,' + (isMajor ? '0.28' : '0.12') + ');pointer-events:none;';
            ruler.appendChild(tick);
            if (isMajor) {
              const lbl = document.createElement('span');
              lbl.className = 'mono';
              lbl.style.cssText = 'position:absolute;top:3px;left:' + (s * pps + 4) + 'px;font-size:9.5px;color:var(--text-muted);pointer-events:none;';
              lbl.textContent = s + 's';
              ruler.appendChild(lbl);
            }
          }

          (state.cueMarkers || []).forEach(function (mk, mIdx) {
            const flag = document.createElement('div');
            flag.className = 'cue-flag';
            flag.style.left = (mk.time * pps) + 'px';
            flag.innerHTML = '<span>' + mk.name + '</span><span data-rm-mk="' + mIdx + '" style="opacity:0.7;">×</span>';
            flag.title = 'Click to jump • Double-click to rename';

            flag.addEventListener('click', function (e) {
              if (e.target.dataset.rmMk != null) {
                e.stopPropagation();
                state.cueMarkers.splice(mIdx, 1);
                renderTimeline();
                saveProjectState();
                return;
              }
              ui.playheadSec = mk.time;
              ui.projectorDirty = true;
              updatePlayheadUI();
            });

            flag.addEventListener('dblclick', function (e) {
              e.stopPropagation();
              const nextName = prompt('Rename Cue Marker:', mk.name);
              if (nextName && nextName.trim()) {
                mk.name = nextName.trim();
                renderTimeline();
                saveProjectState();
              }
            });

            ruler.appendChild(flag);
          });

          const trackList = document.getElementById('tl-track-list');
          const lanes = document.getElementById('tl-lanes');
          trackList.innerHTML = '';
          lanes.innerHTML = '';

          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            const hdr = document.createElement('div');
            hdr.className = 'tl-track-hdr' + (l.id === state.selectedLayerId ? ' selected' : '');
            hdr.innerHTML = '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + l.name + '</span>';
            hdr.onclick = function () {
              state.selectedLayerId = l.id;
              ui.overlayDirty = true;
              renderLeftPanel();
              renderInspector();
              renderTimeline();
            };
            trackList.appendChild(hdr);

            const lane = document.createElement('div');
            lane.className = 'tl-lane';

            (l.clips || []).forEach(function (clip, cIdx) {
              const el = document.createElement('div');
              el.className = 'tl-clip' + (clip.id === state.selectedClipId ? ' selected' : '');
              el.style.left = (clip.start * pps) + 'px';
              el.style.width = Math.max(24, clip.duration * pps) + 'px';
              el.innerHTML =
                '<div class="tl-clip-handle l"></div>' +
                '<span style="overflow:hidden;text-overflow:ellipsis;">' + clip.name + ' (' + clip.duration.toFixed(1) + 's)</span>' +
                '<div class="tl-clip-handle r"></div>';

              el.addEventListener('dblclick', function (e) {
                e.stopPropagation();
                const nn = prompt('Rename Clip:', clip.name);
                if (nn && nn.trim()) {
                  clip.name = nn.trim();
                  renderTimeline();
                  saveProjectState();
                }
              });

              el.addEventListener('pointerdown', function (e) {
                e.stopPropagation();
                state.selectedLayerId = l.id;
                state.selectedClipId = clip.id;
                renderLeftPanel();
                renderInspector();

                const isLeft = e.target.classList.contains('l');
                const isRight = e.target.classList.contains('r');
                const mode = isLeft ? 'trimL' : isRight ? 'trimR' : 'move';
                const startX = e.clientX;
                const origStart = clip.start;
                const origDur = clip.duration;

                const onMove = function (ev) {
                  const dt = Math.round(((ev.clientX - startX) / pps) * 5) / 5;
                  if (mode === 'move') {
                    clip.start = Math.max(0, origStart + dt);
                  } else if (mode === 'trimR') {
                    clip.duration = Math.max(0.5, origDur + dt);
                  } else if (mode === 'trimL') {
                    const maxShift = origDur - 0.5;
                    const shift = Math.max(-origStart, Math.min(maxShift, dt));
                    clip.start = origStart + shift;
                    clip.duration = origDur - shift;
                  }
                  el.style.left = (clip.start * pps) + 'px';
                  el.style.width = Math.max(24, clip.duration * pps) + 'px';
                  ui.projectorDirty = true;
                };
                const onUp = function () {
                  window.removeEventListener('pointermove', onMove);
                  window.removeEventListener('pointerup', onUp);
                  renderTimeline();
                  saveProjectState();
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
              });

              lane.appendChild(el);
            });

            lanes.appendChild(lane);
          }

          updatePlayheadUI();
        }

        function updatePlayheadUI() {
          const x = ui.playheadSec * ui.tlPxPerSec;
          document.getElementById('tl-playhead').style.left = x + 'px';
          const m = Math.floor(ui.playheadSec / 60);

            const r = tlRuler.getBoundingClientRect();
            const relX = Math.max(0, ev.clientX - r.left);
            ui.playheadSec = Math.round((relX / ui.tlPxPerSec) * 10) / 10;
            ui.projectorDirty = true;
            updatePlayheadUI();
          };
          scrub(e);
          const onUp = function () {
            window.removeEventListener('pointermove', scrub);
            window.removeEventListener('pointerup', onUp);
          };
          window.addEventListener('pointermove', scrub);
          window.addEventListener('pointerup', onUp);

        async function importLocalMediaFiles(fileList) {
          const files = Array.from(fileList || []).filter(function (f) {
            return f.type.startsWith('video/') || f.type.startsWith('image/');
          });
          if (!files.length) return;
          if (!Array.isArray(state.mediaBin)) state.mediaBin = [];

          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const id = uid('med');
            const objUrl = URL.createObjectURL(file);
            blobUrlCache.set(id, objUrl);
            const thumb = await generateMediaThumbnail(file, objUrl);
            const entry = {
              id: id,
              name: file.name,
              type: file.type.startsWith('video/') ? 'video' : 'image',
              size: file.size,
              thumb: thumb
            };
            saveFileToDB(id, file, entry);
            state.mediaBin.unshift(entry);
            if (i === 0) assignMediaItemToSelected(entry);
          }
          renderLeftPanel();
          saveProjectState();
        }

        function executeCtxAction(act) {
          closeAllMenus();
          const sel = getSelectedLayer();
          if (!sel) return;
          const idx = state.layers.findIndex(function (l) { return l.id === sel.id; });
          if (act === 'dup') {
            pushHistory();
            const cp = cloneObj(sel);
            cp.id = uid('lyr');
            cp.name = sel.name + ' Copy';
            cp.points = cp.points.map(function (p) { return { x: p.x + 28, y: p.y + 28 }; });
            state.layers.splice(idx + 1, 0, cp);
            state.selectedLayerId = cp.id;
          } else if (act === 'copy') {
            ui.copiedStyle = cloneObj(sel);
            showToast('Copied surface style');
            return;
          } else if (act === 'paste' && ui.copiedStyle) {
            pushHistory();
            const keepPts = sel.points;
            const keepId = sel.id;
            const keepName = sel.name;
            const keepClips = sel.clips;
            Object.assign(sel, cloneObj(ui.copiedStyle), { id: keepId, name: keepName, points: keepPts, clips: keepClips });
          } else if (act === 'front' && idx < state.layers.length - 1) {
            pushHistory();
            state.layers.splice(idx, 1);
            state.layers.push(sel);
          } else if (act === 'back' && idx > 0) {
            pushHistory();
            state.layers.splice(idx, 1);
            state.layers.unshift(sel);
          } else if (act === 'del') {
            pushHistory();
            state.layers.splice(idx, 1);
            state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
            showToast('Deleted "' + sel.name + '"', true);
          }
          ui.overlayDirty = true;
          ui.projectorDirty = true;
          fullUIRefresh();
          saveProjectState();
        }

        document.querySelectorAll('[data-ctx]').forEach(function (b) {
          b.onclick = function () { executeCtxAction(b.dataset.ctx); };
        });

        function togglePlay() {
          ui.isPlaying = !ui.isPlaying;
          document.getElementById('lbl-play').textContent = ui.isPlaying ? 'Pause' : 'Play';
        }
        document.getElementById('btn-play').onclick = togglePlay;
        document.getElementById('btn-stop').onclick = function () {
          ui.isPlaying = false;
          ui.playheadSec = 0;
          ui.projectorDirty = true;
          document.getElementById('lbl-play').textContent = 'Play';
          updatePlayheadUI();
        };
        document.getElementById('btn-loop').onclick = function () {
          ui.loopShow = !ui.loopShow;
          const b = document.getElementById('btn-loop');
          b.textContent = 'Loop: ' + (ui.loopShow ? 'On' : 'Off');
          b.classList.toggle('active', ui.loopShow);
        };
        document.getElementById('btn-add-cue').onclick = function () {
          pushHistory();
          if (!Array.isArray(state.cueMarkers)) state.cueMarkers = [];
          const mk = { id: uid('mk'), name: 'Cue ' + (state.cueMarkers.length + 1), time: Math.round(ui.playheadSec * 10) / 10 };
          state.cueMarkers.push(mk);
          renderTimeline();
          saveProjectState();
          showToast('Added cue marker at ' + mk.time + 's');
        };
        document.getElementById('btn-add-clip').onclick = function () {
          const sel = getSelectedLayer();
          if (!sel) return;
          pushHistory();
          if (!Array.isArray(sel.clips)) sel.clips = [];
          const lastEnd = sel.clips.reduce(function (m, c) { return Math.max(m, c.start + c.duration); }, 0);
          const nc = { id: uid('clip'), name: sel.name + ' #' + (sel.clips.length + 1), start: lastEnd, duration: 8, fadeIn: 0, fadeOut: 0 };
          sel.clips.push(nc);
          state.selectedClipId = nc.id;
          renderTimeline();
          saveProjectState();
        };
        document.getElementById('btn-blade').onclick = function () {
          const sel = getSelectedLayer();
          if (!sel || !Array.isArray(sel.clips)) return;
          const t = ui.playheadSec;
          const idx = sel.clips.findIndex(function (c) { return t > c.start + 0.2 && t < (c.start + c.duration - 0.2); });
          if (idx === -1) {
            showToast('Place playhead inside a clip to split');
            return;
          }
          pushHistory();
          const c = sel.clips[idx];
          const rightDur = (c.start + c.duration) - t;
          c.duration = t - c.start;
          const rightClip = { id: uid('clip'), name: c.name + ' B', start: t, duration: rightDur, fadeIn: 0, fadeOut: c.fadeOut || 0 };
          sel.clips.splice(idx + 1, 0, rightClip);
          state.selectedClipId = rightClip.id;
          ui.projectorDirty = true;
          renderTimeline();
          saveProjectState();
          showToast('Split clip at ' + t.toFixed(1) + 's');
        };

        function loadSavedList() {
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }
        function renderProjectsModal() {
          document.getElementById('inp-proj-name').value = state.projectName || 'Projection Show';
          const box = document.getElementById('proj-list');
          const list = loadSavedList();
          if (!list.length) {
            box.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:11.5px;">No saved local shows yet.</div>';
            return;
          }
          box.innerHTML = '';
          list.forEach(function (p, idx) {
            const row = document.createElement('div');
            row.className = 'layer-row';
            row.style.background = 'var(--bg-control)';
            row.innerHTML = '<span class="layer-name">' + (p.projectName || 'Untitled') + '</span><span class="mono" style="color:var(--text-muted);">' + p.width + '×' + p.height + '</span><button class="btn btn-sm primary" data-ld="' + idx + '">Load</button><button class="btn btn-sm danger" data-rm="' + idx + '">✕</button>';
            row.querySelector('[data-ld]').onclick = function () {
              pushHistory();
              state = cloneObj(p);
              fullUIRefresh();
              saveProjectState();
              document.getElementById('projects-modal').classList.remove('open');
              showToast('Loaded ' + state.projectName);
            };
            row.querySelector('[data-rm]').onclick = function () {
              list.splice(idx, 1);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
              renderProjectsModal();
            };
            box.appendChild(row);
          });
        }

        document.getElementById('btn-projects').onclick = function () {
          closeAllMenus();
          renderProjectsModal();
          document.getElementById('projects-modal').classList.add('open');
        };
        document.getElementById('btn-close-projects').onclick = function () {
          document.getElementById('projects-modal').classList.remove('open');
        };
        document.getElementById('btn-save-proj').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'Projection Show';
          const list = loadSavedList();
          const idx = list.findIndex(function (p) { return p.projectName === state.projectName; });
          if (idx >= 0) list[idx] = cloneObj(state);
          else list.unshift(cloneObj(state));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          saveProjectState();
          renderProjectsModal();
          showToast('Saved "' + state.projectName + '"');
        };
        document.getElementById('btn-new-proj').onclick = function () {
          pushHistory();
          const q = createLayer('quad', 'Main Surface');
          state = {
            projectName: 'New Projection Show',
            width: 1920,
            height: 1080,
            layers: [q],
            selectedLayerId: q.id,
            selectedClipId: q.clips[0].id,
            mediaBin: state.mediaBin || [],
            cueMarkers: [{ id: uid('mk'), name: 'Start', time: 0 }],
            showDuration: 20
          };
          fullUIRefresh();
          saveProjectState();
          document.getElementById('projects-modal').classList.remove('open');
          showToast('Created blank show');
        };
        document.getElementById('btn-export-pmap').onclick = function () {
          state.projectName = document.getElementById('inp-proj-name').value.trim() || 'maptor_show';
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.pmap';
          a.click();
          showToast('Exported .pmap file');
        };
        document.getElementById('btn-import-pmap').onclick = function () { document.getElementById('file-pmap').click(); };
        document.getElementById('file-pmap').addEventListener('change', function (e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = function () {
            try {
              const p = JSON.parse(String(r.result || '{}'));
              if (p && Array.isArray(p.layers)) {
                pushHistory();
                state = p;
                fullUIRefresh();
                saveProjectState();
                document.getElementById('projects-modal').classList.remove('open');
                showToast('Imported .pmap show');
              }
            } catch (err) { showToast('Invalid .pmap file'); }
          };
          r.readAsText(f);
          e.target.value = '';
        });
        document.getElementById('btn-export-png').onclick = function () {
          renderer.render(state.width, state.height, buildLiveLayersSnapshot(), ui.clockSec);
          const a = document.createElement('a');
          a.href = glCanvas.toDataURL('image/png');
          a.download = (state.projectName || 'maptor').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.png';
          a.click();
          showToast('Exported PNG snapshot');
        };

        window.addEventListener('keydown', function (e) {
          const tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            executeCtxAction('dup');
            return;
          }
          if (e.key === 'Backspace' || e.key === 'Delete') {
            if (ui.tool === 'pen' && ui.penPoints.length) {
              e.preventDefault();
              ui.penPoints.pop();
              ui.overlayDirty = true;
              return;
            }
            const sel = getSelectedLayer();
            if (sel && !sel.locked) {
              e.preventDefault();
              if (ui.tool === 'warp' && ui.activeVertex >= 0 && sel.points.length > 3) {
                pushHistory();
                sel.points.splice(ui.activeVertex, 1);
                ui.activeVertex = -1;
                ui.overlayDirty = true;
                ui.projectorDirty = true;
                renderInspector();
                saveProjectState();
                showToast('Removed vertex', true);
              } else {
                executeCtxAction('del');
              }
              return;
            }
          }
          if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key.toLowerCase() === 'v') {
            setTool('box');
          } else if (e.key.toLowerCase() === 'w') {
            setTool('warp');
          } else if (e.key.toLowerCase() === 'p') {
            setTool('pen');
          } else if (e.key.toLowerCase() === 'x') {
            document.getElementById('btn-xray').click();
          } else if (e.key.toLowerCase() === 's') {
            document.getElementById('btn-snap').click();
          } else if (e.key.toLowerCase() === 't') {
            document.getElementById('btn-toggle-timeline').click();
          } else if (e.key.toLowerCase() === 'b') {
            document.getElementById('btn-blade').click();
          } else if (e.key === 'Enter' && ui.tool === 'pen') {
            commitPenPolygon();
          } else if (e.key === 'Tab' && ui.tool === 'warp') {
            const sel = getSelectedLayer();
            if (sel && sel.points && sel.points.length) {
              e.preventDefault();
              ui.activeVertex = (ui.activeVertex + 1) % sel.points.length;
              ui.overlayDirty = true;
              renderInspector();
            }
          } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) {
            const sel = getSelectedLayer();
            if (sel && !sel.locked) {
              e.preventDefault();
              const step = e.altKey ? 0.5 : (e.shiftKey ? 10 : 1);
              const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
              const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
              if (ui.tool === 'warp' && ui.activeVertex >= 0 && ui.activeVertex < sel.points.length) {
                sel.points[ui.activeVertex].x = Math.round((sel.points[ui.activeVertex].x + dx) * 10) / 10;
                sel.points[ui.activeVertex].y = Math.round((sel.points[ui.activeVertex].y + dy) * 10) / 10;
              } else {
                sel.points = sel.points.map(function (p) {
                  return { x: Math.round((p.x + dx) * 10) / 10, y: Math.round((p.y + dy) * 10) / 10 };
                });
              }
              ui.overlayDirty = true;
              ui.projectorDirty = true;
              renderInspector();
              saveProjectState();
            }
          }
        });

        function tick(now) {
          const dt = Math.min(0.1, (now - ui.lastTime) * 0.001);
          ui.lastTime = now;
          ui.clockSec += dt;

          if (ui.isPlaying) {
            ui.playheadSec += dt;
            const maxT = getMaxShowTime();
            if (ui.playheadSec >= maxT) {
              if (ui.loopShow) ui.playheadSec = 0;
              else {
                ui.playheadSec = maxT;
                ui.isPlaying = false;
                document.getElementById('lbl-play').textContent = 'Play';
              }
            }
            ui.projectorDirty = true;
            updatePlayheadUI();
          }

          const projectorActive = projectorWin && !projectorWin.closed;
          const skipStageRender = ui.thermalGuard && projectorActive && document.hidden;

          if (!skipStageRender) {
            const liveLayers = buildLiveLayersSnapshot();
            renderer.render(state.width, state.height, ui.xray ? [] : liveLayers, ui.clockSec);
            if (ui.overlayDirty) drawOverlay();
          }
          syncProjector(false);

          requestAnimationFrame(tick);
        }

        hydrateMediaFromDB();
        fullUIRefresh();
        syncProjector(true);
        requestAnimationFrame(tick);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
