<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maptor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpolygon points='128,28 220,80 220,176 128,228 36,176 36,80' fill='none' stroke='%236366f1' stroke-width='20' stroke-linejoin='round'/%3E%3Cpolyline points='36,80 128,132 220,80' fill='none' stroke='%236366f1' stroke-width='18' stroke-linejoin='round'/%3E%3Cline x1='128' y1='132' x2='128' y2='228' stroke='%236366f1' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #08080b;
      --bg-panel: #0f0f14;
      --bg-elevated: #16161d;
      --bg-control: #1d1d26;
      --bg-control-hover: #262632;
      --border-subtle: rgba(255, 255, 255, 0.065);
      --border-hairline: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.20);
      --text-primary: #f4f4f7;
      --text-secondary: #a1a1af;
      --text-muted: #666675;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --danger: #ef4444;
      --success: #10b981;
      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 11px;
      --radius-lg: 14px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --left-w: 256px;
      --right-w: 332px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      line-height: 1.45;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    #app-shell {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) 152px;
      grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-app);
      transition: grid-template-columns 0.18s ease;
    }
    #app-shell.hide-left { --left-w: 0px; }
    #app-shell.hide-right { --right-w: 0px; }

    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 30;
    }
    #topbar::-webkit-scrollbar { display: none; }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .tool-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      background: var(--bg-app);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .v-sep {
      width: 1px;
      height: 18px;
      background: var(--border-hairline);
      margin: 0 3px;
      flex-shrink: 0;
    }

    button, select, input, textarea {
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 29px;
      padding: 0 9px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.08s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: var(--bg-control-hover);
      border-color: var(--border-hairline);
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .tool-pill-group .btn {
      height: 25px;
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-xs);
      padding: 0 9px;
    }
    .tool-pill-group .btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }
    .tool-pill-group .btn.active,
    .btn.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
      color: #c7d2fe;
    }
    .btn.primary {
      background: linear-gradient(180deg, #6e71f7 0%, #585bf0 100%);
      border-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.28);
    }
    .btn.primary:hover {
      background: linear-gradient(180deg, #777af9 0%, #6366f1 100%);
    }
    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn.ghost:hover {
      background: var(--bg-control);
      color: var(--text-primary);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.38);
      color: #fca5a5;
    }

    /* Clean Popover Dropdowns */
    .dropdown-wrap { position: relative; display: inline-flex; }
    .popover-menu {
      position: fixed;
      min-width: 196px;
      background: rgba(18, 18, 25, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 160;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.85);
    }
    .popover-menu.open { display: flex; }
    .pop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
    }
    .pop-item:hover { background: var(--accent-soft); color: #c7d2fe; }
    .pop-item .pop-left { display: inline-flex; align-items: center; gap: 8px; }
    .pop-sep { height: 1px; background: var(--border-subtle); margin: 4px 2px; }
    .btn-sm { height: 25px; padding: 0 8px; font-size: 11.5px; }
    .btn-ico { width: 29px; padding: 0; }
    .btn-ico-sm {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn-ico-sm:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    svg.ico {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    svg.ico-xs { width: 12px; height: 12px; }

    /* Sidebars */
    #left-panel, #right-panel {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      z-index: 20;
    }
    #left-panel { border-right: 1px solid var(--border-subtle); }
    #right-panel { border-left: 1px solid var(--border-subtle); }
    #app-shell.hide-left #left-panel { border-right: none; }
    #app-shell.hide-right #right-panel { border-left: none; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 5px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    /* Inspector Navigation Tabs */
    .insp-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      padding: 6px 10px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .insp-tab {
      height: 26px;
      border: 1px solid transparent;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
    }
    .insp-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
    .insp-tab.active {
      background: var(--bg-control-hover);
      border-color: var(--border-hairline);
      color: var(--text-primary);
    }

    /* Layer Stack Cards */
    .layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .layer-row:hover {
      background: var(--bg-elevated);
      border-color: var(--border-subtle);
    }
    .layer-row.selected {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.45);
    }
    .layer-row.drag-over { border-top: 2px solid var(--accent); }
    .layer-icon-box {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .layer-row.selected .layer-icon-box {
      background: rgba(99, 102, 241, 0.22);
      border-color: rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
    }
    .layer-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .layer-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .layer-sub {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: capitalize;
    }
    .layer-btns {
      display: flex;
      align-items: center;
      gap: 1px;
      opacity: 0.45;
      transition: opacity 0.12s;
    }
    .layer-row:hover .layer-btns,
    .layer-row.selected .layer-btns { opacity: 1; }

    /* Center Stage */
    #stage-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #060609;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
      touch-action: none;
    }

    #stage-viewport {
      position: relative;
      background: #000000;
      border-radius: 4px;
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
      transform-origin: center center;
    }

    #ref-photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0.35;
      display: none;
      z-index: 2;
    }

    #gl-canvas, #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }
    #gl-canvas { z-index: 1; }
    #overlay-canvas { z-index: 3; pointer-events: auto; }

    #stage-hud {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 15;
    }
    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(15, 15, 20, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-hairline);
      font-size: 11px;
      color: var(--text-secondary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* Section Cards & Form Inputs */
    .sec-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 11px;
      margin-bottom: 10px;
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 9px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }
    .row:last-child { margin-bottom: 0; }
    .lbl {
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-primary);
      min-width: 38px;
      text-align: right;
    }

    .inp {
      width: 100%;
      height: 29px;
      padding: 0 9px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-primary);
      transition: border-color 0.12s, background 0.12s;
    }
    .inp:hover { border-color: var(--border-hairline); }
    textarea.inp {
      height: auto;
      padding: 7px 9px;
      resize: vertical;
      line-height: 1.4;
    }
    .inp:focus {
      border-color: var(--accent);
      background: #20202b;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: var(--bg-control-hover);
      border-radius: 99px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--accent);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.65);
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 21px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      background: var(--bg-app);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      margin-bottom: 10px;
    }
    .seg button {
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.12s;
    }
    .seg button:hover { color: var(--text-primary); }
    .seg button.active {
      background: var(--bg-control-hover);
      color: var(--text-primary);
    }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .shader-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      max-height: 210px;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 10px;
    }
    .shader-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      font-size: 11px;
      transition: all 0.12s;
    }
    .shader-card:hover {
      background: var(--bg-control-hover);
      border-color: var(--border-hairline);
    }
    .shader-card.active {
      border-color: rgba(99, 102, 241, 0.55);
      background: var(--accent-soft);
      color: #c7d2fe;
    }
    .shader-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .win-preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 176px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding-right: 2px;
    }
    .win-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      background: var(--bg-control);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.12s;
    }
    .win-card:hover {
      background: var(--bg-control-hover);
      border-color: var(--border-hairline);
    }
    .win-card.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.55);
      color: #c7d2fe;
    }
    .win-card span {
      font-size: 10px;
      text-align: center;
      line-height: 1.15;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Bottom Show Timeline */
    #timeline-panel {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      z-index: 25;
    }

    #timeline-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 38px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    #timeline-bar::-webkit-scrollbar { display: none; }

    #cue-track {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 9px 12px;
      display: flex;
      align-items: stretch;
      gap: 9px;
      background: #08080b;
    }

    .cue-block {
      position: relative;
      min-width: 164px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.12s, background 0.12s;
    }
    .cue-block:hover {
      border-color: var(--border-hairline);
      background: var(--bg-control);
    }
    .cue-block.active {
      border-color: rgba(99, 102, 241, 0.6);
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.16) 0%, rgba(99, 102, 241, 0.08) 100%);
    }
    .cue-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
      pointer-events: none;
    }
    .cue-resize-edge {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 8px;
      cursor: ew-resize;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .cue-resize-edge:hover { background: rgba(99, 102, 241, 0.45); }

    /* Context Menu, Modal & Toast */
    #ctx-menu {
      position: fixed;
      min-width: 168px;
      background: rgba(20, 20, 27, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 150;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    }
    #ctx-menu.open { display: flex; }
    .ctx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      color: var(--text-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
    }
    .ctx-item:hover { background: var(--accent-soft); color: #c7d2fe; }
    .ctx-item.danger:hover { background: rgba(239, 68, 68, 0.16); color: #fca5a5; }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.9);
    }

    #toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(22, 22, 30, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s, transform 0.16s;
      z-index: 120;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #mobile-toggles { display: none; }
    @media (max-width: 980px) {
      #app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 48px minmax(0, 1fr) 148px;
      }
      #left-panel, #right-panel {
        position: fixed;
        top: 48px;
        bottom: 148px;
        width: min(332px, 90vw);
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        box-shadow: 16px 0 48px rgba(0, 0, 0, 0.85);
      }
      #right-panel {
        left: auto;
        right: 0;
        transform: translateX(105%);
        box-shadow: -16px 0 48px rgba(0, 0, 0, 0.85);
      }
      #left-panel.open, #right-panel.open { transform: translateX(0); }
      #mobile-toggles { display: flex; gap: 5px; }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- Top Command Bar -->
    <header id="topbar">
      <div class="bar-group">
        <button class="btn btn-ico ghost" id="btn-toggle-left" title="Toggle Layers Panel">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div id="mobile-toggles">

        <div class="tool-pill-group">
          <button class="btn active" id="tool-box" title="Box Transform (V)">
            <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M2 2h4v4H2zM18 2h4v4h-4zM2 18h4v4H2zM18 18h4v4h-4z"/></svg>
            <span>Transform</span>
          </button>
          <button class="btn" id="tool-warp" title="Perspective & Mesh Warp (W)">
            <svg class="ico" viewBox="0 0 24 24"><polygon points="4 6 20 3 18 21 3 18"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="3" r="2"/><circle cx="18" cy="21" r="2"/><circle cx="3" cy="18" r="2"/></svg>
            <span>Warp</span>

          <button class="btn" id="tool-pen" title="Pen / Polygon Tool (P)">

            <span>Pen</span>
          </button>
        </div>

        <div class="v-sep"></div>

        <button class="btn primary" id="btn-add-menu" title="Add Surface or Mask">
          <svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add Surface</span>
          <svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <div class="bar-group">
        <button class="btn btn-ico ghost" id="btn-undo" title="Undo (Cmd/Ctrl+Z)" disabled>
          <svg class="ico" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button class="btn btn-ico ghost" id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)" disabled>
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>

        <div class="v-sep"></div>

        <button class="btn" id="btn-xray" title="Wireframe Alignment Mode (X)">
          <svg class="ico" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>Wireframe</span>
        </button>

        <button class="btn" id="btn-view-opts" title="Stage Guides, Resolution & Eco Mode">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Stage</span>
        </button>

        <div class="v-sep"></div>

        <button class="btn" id="btn-projects" title="Saved Projects & .pmap Export">
          <svg class="ico" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Projects</span>
        </button>
        <button class="btn primary" id="btn-projector" title="Open Live Projector Output Window">
          <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          <span>Projector</span>
        </button>
        <button class="btn btn-ico ghost" id="btn-toggle-right" title="Toggle Inspector Panel">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
    </header>

    <!-- Left Layers & Stage Reference Panel -->
    <aside id="left-panel">
      <div class="panel-head">
        <span>Layers</span>
        <span id="layer-count" class="mono" style="background:var(--bg-control);padding:1px 7px;border-radius:99px;">0</span>
      </div>
      <div class="panel-body" id="layer-list"></div>
      <div style="padding:10px;border-top:1px solid var(--border-subtle);background:var(--bg-elevated);flex-shrink:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">

          <button class="btn btn-sm" id="btn-ref-upload" style="height:22px;padding:0 7px;font-size:11px;">Upload Photo</button>
        </div>
        <div id="ref-controls" style="display:none;align-items:center;gap:6px;">
          <input type="range" id="ref-opacity" min="0" max="1" step="0.05" value="0.35" />
          <button class="btn btn-ico-sm danger" id="btn-ref-clear" title="Remove Reference Photo">✕</button>
        </div>
      </div>
    </aside>

    <!-- Center Stage -->
    <main id="stage-wrap">
      <div id="stage-viewport">
        <canvas id="gl-canvas"></canvas>
        <img id="ref-photo-img" alt="" />
        <canvas id="overlay-canvas"></canvas>
      </div>
      <div id="stage-hud">
        <div class="hud-pill">
          <span id="hud-mode" style="color:var(--text-primary);font-weight:500;">Transform</span>
          <span style="opacity:0.35;">•</span>
          <span id="hud-res" class="mono">1920×1080</span>
          <span style="opacity:0.35;">•</span>
          <span id="hud-engine" class="mono" style="color:var(--success);">WebGL2</span>
        </div>
        <div class="hud-pill" style="padding:3px 8px;gap:4px;">
          <button class="btn btn-ico-sm" id="btn-zoom-out" title="Zoom Out">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span id="hud-zoom" class="mono" style="min-width:38px;text-align:center;">100%</span>
          <button class="btn btn-ico-sm" id="btn-zoom-in" title="Zoom In">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="btn btn-sm ghost" id="btn-zoom-fit" style="height:22px;padding:0 7px;font-size:11px;">Fit</button>
        </div>
      </div>
    </main>

    <!-- Right Tabbed Inspector -->
    <aside id="right-panel">
      <div class="panel-head">
        <span id="insp-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:205px;">Inspector</span>
        <span id="insp-badge" class="mono" style="background:var(--bg-control);padding:1px 7px;border-radius:99px;text-transform:uppercase;font-size:10px;">None</span>
      </div>
      <div class="insp-tabs" id="insp-tabs">
        <button class="insp-tab active" data-tab="content">Content</button>
        <button class="insp-tab" data-tab="surface">Surface</button>
        <button class="insp-tab" data-tab="window">Window</button>
        <button class="insp-tab" data-tab="color">Color</button>
      </div>
      <div class="panel-body" id="inspector-body"></div>
    </aside>

    <!-- Bottom Show Timeline -->
    <section id="timeline-panel">
      <div id="timeline-bar">
        <div class="bar-group">
          <button class="btn btn-sm primary" id="btn-play" title="Play / Pause Show (Space)">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            <span id="lbl-play">Play Show</span>
          </button>
          <button class="btn btn-ico-sm" id="btn-prev-cue" title="Previous Cue">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>

            <svg class="ico ico-xs" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>

          <button class="btn btn-sm active" id="btn-seq-mode">Auto-Advance</button>

          <button class="btn btn-sm" id="btn-update-cue" title="Overwrite active cue with current stage">Update Cue</button>
          <button class="btn btn-sm primary" id="btn-capture-cue" title="Snapshot current stage as new cue">+ Capture Cue</button>

        <div id="proj-list"></div>

  <div id="toast"></div>

            c1: '#e5e7eb', c2: '#111827', c3: '#d97706',
            glsl: [
              'vec4 renderEffect(vec2 uv, float t){',
              '  vec2 p = uv * 3.5 * u_scale;',
              '  float v = sin(p.x * 2.2 + sin(p.y * 3.0 + t * 0.25) * 2.2 + cos(p.x * 4.5 - p.y * 2.5));',
              '  float vein = smoothstep(0.18, 0.0, abs(v));',
              '  return vec4(mix(u_c2, u_c1, 0.5 + 0.5 * v) + u_c3 * vein * u_intensity * 0.85, 1.0);',
              '}'
            ].join('\n')
          },
          {
            id: 'stainedglass',
            name: 'Stained Glass',
            c1: '#f43f5e', c2: '#09090b', c3: '#3b82f6',
            glsl: [
              'vec4 renderEffect(vec2 uv, float t){',
              '  vec2 g = uv * vec2(4.0, 6.0) * u_scale; vec2 id = floor(g); vec2 f = fract(g);',
              '  float lead = step(0.06, f.x) * step(f.x, 0.94) * step(0.06, f.y) * step(f.y, 0.94);',
              '  float hue = 0.5 + 0.5 * sin(id.x * 1.9 + id.y * 2.7 + t * 0.5);',
              '  vec3 glass = mix(u_c1, u_c3, hue) * (0.75 + 0.25 * sin(length(f - 0.5) * 6.0));',
              '  return vec4(mix(u_c2, glass * u_intensity, lead), 1.0);',
              '}'
            ].join('\n')
          }
        ];

        const STORAGE_KEY = 'maptor_saved_projects_v2';
        const ACTIVE_KEY = 'maptor_active_project_v2';
        const LIVE_KEY = 'maptor_live_frame_v2';

        let state = null;
        let idSeq = 1;
        function uid(prefix) {
          return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + (idSeq++).toString(36);
        }

        function createLayer(type, customName, customPts) {
          const W = state ? state.width : 1920;
          const H = state ? state.height : 1080;
          const cx = W * 0.5;
          const cy = H * 0.5;
          const rw = Math.round(W * 0.28);
          const rh = Math.round(H * 0.44);

          let points = [];
          if (customPts && customPts.length >= 3) {
            points = customPts.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) }));
          } else {
            points = [
              { x: Math.round(cx - rw * 0.5), y: Math.round(cy - rh * 0.5) },
              { x: Math.round(cx + rw * 0.5), y: Math.round(cy - rh * 0.5) },
              { x: Math.round(cx + rw * 0.5), y: Math.round(cy + rh * 0.5) },
              { x: Math.round(cx - rw * 0.5), y: Math.round(cy + rh * 0.5) }
            ];
          }

          const isArch = type === 'arch';
          const isCircle = type === 'circle';
          const isText = type === 'text';
          const isMask = type === 'mask';

          return {
            id: uid('lyr'),
            name: customName || (
              isMask ? 'Cutout Mask' :
              isText ? 'Typography Card' :
              isArch ? 'Cathedral Arch Window' :
              isCircle ? 'Circle Surface' :
              type === 'polygon' ? 'Custom Polygon' : 'Quad Surface'
            ),
            kind: isMask ? 'mask' : 'surface',
            shapeType: type || 'quad',
            visible: true,
            locked: false,
            points,
            meshSubdiv: 1,
            meshOffsets: [],
            sourceType: isText ? 'text' : 'shader',
            shaderId: 'rain',
            c1: '#93c5fd',
            c2: '#0b1222',
            c3: '#f59e0b',
            speed: 1.0,
            scale: 1.0,
            intensity: 1.2,
            solidMode: 'gradient',
            gradAngle: 135,
            mediaDataUrl: '',
            mediaType: '',
            mediaName: '',
            videoLoop: true,
            videoSpeed: 1.0,
            videoMuted: true,
            videoPaused: false,
            text: 'THESIS\nEXHIBITION',
            fontFamily: 'Instrument Serif',
            fontWeight: '400',
            fontSize: 108,
            letterSpacing: 4,
            lineHeight: 1.05,
            textAlign: 'center',
            textColor: '#f4f4f6',
            textBg: 'transparent',
            textShadow: 12,
            contentMapping: 'crop',
            contentZoom: 1.0,
            contentPanX: 0,
            contentPanY: 0,
            contentRot: 0,
            winPreset: isArch ? 'cathedral' : isCircle ? 'iris' : 'none',
            winArch: isArch ? 'round' : 'flat',
            winArchCurve: isArch ? 40 : 0,
            winHBars: isArch ? 2 : 0,
            winVBars: isArch ? 1 : 0,
            winBarW: isArch ? 15 : 0,
            winFrameW: isArch ? 24 : isCircle ? 4 : 0,
            winCornerR: 0,
            winFrameColor: '#000000',
            winFeather: 2,
            winMode: 'grid',
            winLattice: false,
            winCircle: isCircle,
            winInvert: false,
            opacity: 1.0,
            brightness: 1.0,
            contrast: 1.0,
            saturation: 1.0,
            hue: 0,
            exposure: 0,
            vignette: 0,
            blendMode: 'normal'
          };
        }

        function cloneObj(o) {
          return JSON.parse(JSON.stringify(o));
        }

        function buildDefaultScene() {
          const archLayer = createLayer('arch', 'Cathedral Arch Window');
          archLayer.points = [
            { x: 340, y: 170 },
            { x: 860, y: 185 },
            { x: 860, y: 895 },
            { x: 340, y: 910 }
          ];
          archLayer.shaderId = 'rain';
          archLayer.c1 = '#93c5fd';
          archLayer.c2 = '#0b1222';
          archLayer.c3 = '#f59e0b';

          const textLayer = createLayer('text', 'Editorial Title');
          textLayer.points = [
            { x: 980, y: 270 },
            { x: 1620, y: 255 },
            { x: 1620, y: 825 },
            { x: 980, y: 810 }
          ];
          textLayer.text = 'LIGHT &\nARCHITECTURE';
          textLayer.fontFamily = 'Instrument Serif';
          textLayer.fontSize = 104;
          textLayer.textBg = '#111118';
          textLayer.winPreset = 'none';
          textLayer.winFrameW = 18;
          textLayer.winBarW = 0;
          textLayer.winCornerR = 16;

          const layers = [archLayer, textLayer];
          const cue1 = {
            id: uid('cue'),
            name: 'Act I — Rain & Title',
            duration: 10,
            fade: 1.5,
            layers: layers.map(cloneObj)
          };

          const cue2Layers = layers.map(cloneObj);
          cue2Layers[0].shaderId = 'aurora';
          cue2Layers[0].c1 = '#34d399';
          cue2Layers[0].c2 = '#060918';
          cue2Layers[0].c3 = '#818cf8';
          cue2Layers[1].text = 'THESIS\nPRESENTATION';

          const cue2 = {
            id: uid('cue'),
            name: 'Act II — Aurora Shift',
            duration: 10,
            fade: 1.5,
            layers: cue2Layers
          };

          return {
            projectName: 'Thesis Projection Show',
            width: 1920,
            height: 1080,
            layers,
            selectedLayerId: archLayer.id,
            cues: [cue1, cue2],
            activeCueIndex: 0
          };
        }

        state = buildDefaultScene();
        try {
          const raw = localStorage.getItem(ACTIVE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.layers)) state = parsed;
          }
        } catch (e) {}

        const history = { undo: [], redo: [] };
        function pushHistory() {
          history.undo.push(JSON.stringify(state));
          if (history.undo.length > 40) history.undo.shift();
          history.redo = [];
          updateHistoryButtons();
        }
        function undo() {
          if (!history.undo.length) return;
          history.redo.push(JSON.stringify(state));
          state = JSON.parse(history.undo.pop());
          updateHistoryButtons();
          fullUIRefresh();
          saveProjectState();
          showToast('Undid last change');
        }
        function redo() {
          if (!history.redo.length) return;
          history.undo.push(JSON.stringify(state));
          state = JSON.parse(history.redo.pop());
          updateHistoryButtons();
          fullUIRefresh();
          saveProjectState();
          showToast('Redid change');
        }
        function updateHistoryButtons() {
          document.getElementById('btn-undo').disabled = history.undo.length === 0;
          document.getElementById('btn-redo').disabled = history.redo.length === 0;
        }

        const ui = {
          tool: 'box',
          activeTab: 'content',
          xray: false,
          ecoMode: false,
          snap: true,
          showGrid: true,
          zoom: 1,
          zoomManual: false,
          penPoints: [],
          dragging: null,
          activeVertex: -1,
          copiedStyle: null,
          isPlaying: false,
          autoAdvance: true,
          loopShow: true,
          cueElapsed: 0,
          transition: null,
          clockSec: 0,
          lastTime: performance.now(),
          lastFrameRender: 0,
          projectorDirty: true,
          engineName: 'WebGL2'
        };

        const mediaCache = new Map();
        const textCache = new Map();
        let activeWebcamStream = null;

        function getTypographyCanvas(layer) {
          const key = JSON.stringify([
            layer.text, layer.fontFamily, layer.fontWeight, layer.fontSize,
            layer.letterSpacing, layer.lineHeight, layer.textAlign,
            layer.textColor, layer.textBg, layer.textShadow
          ]);
          const cached = textCache.get(layer.id);
          if (cached && cached.key === key) return cached.canvas;

          ensureGoogleFont(layer.fontFamily);
          const cvs = cached ? cached.canvas : document.createElement('canvas');
          cvs.width = 1600;
          cvs.height = 1000;
          const ctx = cvs.getContext('2d');
          ctx.clearRect(0, 0, 1600, 1000);

          if (layer.textBg && layer.textBg !== 'transparent') {
            ctx.fillStyle = layer.textBg;
            ctx.fillRect(0, 0, 1600, 1000);
          }

          const lines = String(layer.text || '').split('\n');
          const fs = Math.max(14, Number(layer.fontSize) || 96);
          const lh = fs * (Number(layer.lineHeight) || 1.1);
          ctx.font = (layer.fontWeight || '400') + ' ' + fs + 'px "' + (layer.fontFamily || 'Inter') + '", sans-serif';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = layer.textColor || '#ffffff';

          if (layer.textShadow > 0) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = Number(layer.textShadow) * 1.5;
            ctx.shadowOffsetY = Math.round(Number(layer.textShadow) * 0.35);
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          const startY = (1000 - lines.length * lh) * 0.5 + lh * 0.5;
          const anchorX = layer.textAlign === 'left' ? 120 : layer.textAlign === 'right' ? 1480 : 800;

          lines.forEach((line, idx) => {
            const y = startY + idx * lh;
            const sp = Number(layer.letterSpacing) || 0;
            if (sp === 0) {
              ctx.textAlign = layer.textAlign || 'center';
              ctx.fillText(line, anchorX, y);
            } else {
              const chars = Array.from(line);
              const widths = chars.map(ch => ctx.measureText(ch).width);
              const totalW = widths.reduce((a, b) => a + b, 0) + Math.max(0, chars.length - 1) * sp;
              let cx = anchorX;
              if (layer.textAlign === 'center') cx = anchorX - totalW * 0.5;
              if (layer.textAlign === 'right') cx = anchorX - totalW;
              ctx.textAlign = 'left';
              chars.forEach((ch, ci) => {
                ctx.fillText(ch, cx, y);
                cx += widths[ci] + sp;
              });
            }
          });

          textCache.set(layer.id, { canvas: cvs, key });
          return cvs;
        }

        function startWebcamForLayer(layer) {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('Webcam not available in this browser');
            return;
          }
          navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function (stream) {
            activeWebcamStream = stream;
            const v = document.createElement('video');
            v.srcObject = stream;
            v.muted = true;
            v.playsInline = true;
            v.play().catch(function () {});
            layer.kind = 'surface';
            layer.sourceType = 'media';
            layer.mediaType = 'webcam';
            layer.mediaName = 'Live Camera Feed';
            layer.mediaDataUrl = 'webcam://live';
            mediaCache.set(layer.id, { kind: 'video', el: v, key: 'webcam://live', isDynamic: true });
            renderLayers();
            renderInspector();
            showToast('Webcam connected');
          }).catch(function () {
            showToast('Camera permission denied');
          });
        }

        function getLayerSourceMedia(layer) {
          if (layer.sourceType === 'text') {
            return { el: getTypographyCanvas(layer), ready: true, w: 1600, h: 1000, isDynamic: false };
          }
          if (layer.sourceType !== 'media' || !layer.mediaDataUrl) return null;

          if (layer.mediaDataUrl === 'webcam://live') {
            const cam = mediaCache.get(layer.id);
            if (cam && cam.el) {
              return { el: cam.el, ready: cam.el.readyState >= 2, w: cam.el.videoWidth || 1280, h: cam.el.videoHeight || 720, isDynamic: true };
            }
            return null;
          }

          const key = layer.mediaType + '|' + layer.mediaDataUrl.length + '|' + layer.mediaDataUrl.slice(0, 64);
          let entry = mediaCache.get(layer.id);
          if (!entry || entry.key !== key) {
            if (entry && entry.kind === 'video') {
              try { entry.el.pause(); entry.el.src = ''; } catch (e) {}
            }
            if (layer.mediaType === 'video') {
              const v = document.createElement('video');
              v.src = layer.mediaDataUrl;
              v.loop = layer.videoLoop !== false;
              v.muted = layer.videoMuted !== false;
              v.playsInline = true;
              v.crossOrigin = 'anonymous';
              v.play().catch(function () {});
              entry = { kind: 'video', el: v, key, isDynamic: true };
            } else {
              const im = new Image();
              im.src = layer.mediaDataUrl;
              entry = { kind: 'image', el: im, key, isDynamic: false, uploaded: false };
            }
            mediaCache.set(layer.id, entry);
          }

          if (entry.kind === 'video') {
            entry.el.loop = layer.videoLoop !== false;
            entry.el.muted = layer.videoMuted !== false;
            entry.el.playbackRate = Number(layer.videoSpeed) || 1.0;
            if (layer.videoPaused) {
              if (!entry.el.paused) entry.el.pause();
            } else if (entry.el.paused && entry.el.readyState >= 2) {
              entry.el.play().catch(function () {});
            }
            return {
              el: entry.el,
              ready: entry.el.readyState >= 2,
              w: entry.el.videoWidth || 1920,
              h: entry.el.videoHeight || 1080,
              isDynamic: true
            };
          }
          return {
            el: entry.el,
            ready: entry.el.complete && entry.el.naturalWidth > 0,
            w: entry.el.naturalWidth || 1920,
            h: entry.el.naturalHeight || 1080,
            isDynamic: false
          };
        }

        function createHybridRenderer(canvas) {
          let gl = null;
          try {
            gl = canvas.getContext('webgl2', { alpha: false, antialias: true, preserveDrawingBuffer: true });
          } catch (e) {
            gl = null;
          }

          if (!gl) {
            ui.engineName = 'Canvas2D';
            const ctx = canvas.getContext('2d');
            return {
              engine: 'Canvas2D',
              render: function (W, H, layers) {
                if (canvas.width !== W || canvas.height !== H) {
                  canvas.width = W;
                  canvas.height = H;
                }
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);
                layers.forEach(function (l) {
                  if (!l.visible || l.opacity <= 0.001 || !l.points || l.points.length < 3) return;
                  ctx.save();
                  ctx.globalAlpha = l.opacity;
                  ctx.beginPath();
                  l.points.forEach(function (p, i) {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                  });
                  ctx.closePath();
                  ctx.clip();
                  if (l.kind === 'mask') {
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                  } else {
                    const src = getLayerSourceMedia(l);
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    l.points.forEach(function (p) {
                      if (p.x < minX) minX = p.x;
                      if (p.y < minY) minY = p.y;
                      if (p.x > maxX) maxX = p.x;
                      if (p.y > maxY) maxY = p.y;
                    });
                    if (src && src.ready) {
                      ctx.drawImage(src.el, minX, minY, maxX - minX, maxY - minY);
                    } else {
                      const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
                      grad.addColorStop(0, l.c1 || '#6366f1');
                      grad.addColorStop(1, l.c2 || '#09090b');
                      ctx.fillStyle = grad;
                      ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
                    }
                  }
                  ctx.restore();
                });
              }
            };
          }

          ui.engineName = 'WebGL2';
          const VS = [
            '#version 300 es',
            'precision highp float;',
            'layout(location=0) in vec2 a_pos;',
            'layout(location=1) in vec2 a_uv;',
            'uniform vec2 u_res;',
            'out vec2 v_uv;',
            'out vec2 v_screen;',
            'void main(){',
            '  v_uv = a_uv;',
            '  v_screen = a_pos;',
            '  vec2 c = (a_pos / u_res) * 2.0 - 1.0;',
            '  gl_Position = vec4(c.x, -c.y, 0.0, 1.0);',
            '}'
          ].join('\n');

          function buildFS(shaderBody) {
            return [
              '#version 300 es',
              'precision highp float;',
              'in vec2 v_uv;',
              'in vec2 v_screen;',
              'out vec4 outColor;',
              'uniform sampler2D u_tex;',
              'uniform int u_srcMode;',
              'uniform int u_solidMode;',
              'uniform float u_gradAngle;',
              'uniform int u_cropMode;',
              'uniform vec2 u_texSize;',
              'uniform vec4 u_bounds;',
              'uniform vec2 u_pan;',
              'uniform float u_zoom;',
              'uniform float u_rot;',
              'uniform float u_time;',
              'uniform float u_scale;',
              'uniform float u_intensity;',
              'uniform float u_opacity;',
              'uniform vec3 u_c1;',
              'uniform vec3 u_c2;',
              'uniform vec3 u_c3;',
              'uniform int u_winArch;',
              'uniform float u_winArchCurve;',
              'uniform int u_winMode;',
              'uniform float u_winHBars;',
              'uniform float u_winVBars;',
              'uniform float u_winBarW;',
              'uniform float u_winFrameW;',
              'uniform float u_winCornerR;',
              'uniform vec3 u_winFrameColor;',
              'uniform float u_winFeather;',
              'uniform int u_winLattice;',
              'uniform int u_winCircle;',
              'uniform int u_winInvert;',
              'uniform float u_brightness;',
              'uniform float u_contrast;',
              'uniform float u_saturation;',
              'uniform float u_hue;',
              'uniform float u_exposure;',
              'uniform float u_vignette;',
              shaderBody,
              'vec2 getMappedUV(){',
              '  vec2 uv = v_uv;',
              '  if(u_cropMode == 0){',
              '    vec2 bMin = u_bounds.xy;',
              '    vec2 bSize = max(vec2(1.0), u_bounds.zw - u_bounds.xy);',
              '    uv = (v_screen - bMin) / bSize;',
              '    float boxAsp = bSize.x / bSize.y;',
              '    float texAsp = max(0.01, u_texSize.x / max(1.0, u_texSize.y));',
              '    vec2 cen = uv - 0.5;',
              '    if(boxAsp > texAsp) cen.y *= texAsp / boxAsp;',
              '    else cen.x *= boxAsp / texAsp;',
              '    uv = cen + 0.5;',
              '  }',
              '  vec2 p = (uv - 0.5) / max(0.05, u_zoom);',
              '  float c = cos(u_rot), s = sin(u_rot);',
              '  return vec2(p.x * c - p.y * s, p.x * s + p.y * c) + 0.5 - u_pan;',
              '}',
              'vec2 evalWindowMask(vec2 uv){',
              '  float f = max(0.002, u_winFeather);',
              '  float od = -1.0;',
              '  if(u_winCircle == 1){',
              '    od = length((uv - 0.5) * 2.0) - 1.0;',
              '  } else if(u_winArch == 1 && u_winArchCurve > 0.01 && uv.y < u_winArchCurve){',
              '    od = length(vec2((uv.x - 0.5) * 2.0, (u_winArchCurve - uv.y) / u_winArchCurve)) - 1.0;',
              '  } else if(u_winArch == 2 && u_winArchCurve > 0.01 && uv.y < u_winArchCurve){',
              '    float ny = (u_winArchCurve - uv.y) / u_winArchCurve;',
              '    od = abs((uv.x - 0.5) * 2.0) - sqrt(max(0.0, 1.0 - ny * ny));',
              '  } else if(u_winCornerR > 0.002){',
              '    vec2 q = abs(uv - 0.5) - (0.5 - u_winCornerR);',
              '    od = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - u_winCornerR;',
              '  } else {',
              '    vec2 d = abs(uv - 0.5) - 0.5;',
              '    od = max(d.x, d.y);',
              '  }',
              '  float outerAlpha = 1.0 - smoothstep(-f, f, od);',
              '  float bar = 0.0;',
              '  if(u_winFrameW > 0.001){',
              '    bar = max(bar, smoothstep(-u_winFrameW - f, -u_winFrameW + f, od));',
              '  }',
              '  float hb = u_winBarW * 0.5;',
              '  if(hb > 0.0004){',
              '    if(u_winMode == 2){',
              '      vec2 p = uv - 0.5; float r = length(p) * 2.0; float a = atan(p.y, p.x);',
              '      float seg = 6.2831853 / max(3.0, u_winVBars);',
              '      bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(mod(a + seg * 0.5, seg) - seg * 0.5) * r));',
              '      bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(r - 0.48)));',
              '    } else if(u_winMode == 3){',
              '      vec2 p = vec2(uv.x - 0.5, 1.0 - uv.y); float r = length(p); float a = atan(p.y, p.x);',
              '      float seg = 3.1415926 / max(2.0, u_winVBars);',
              '      bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(mod(a, seg) - seg * 0.5) * r));',
              '      bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(r - 0.55)));',
              '    } else if(u_winMode == 1){',
              '      bar = max(bar, max(max(1.0 - smoothstep(hb, hb + f, abs(uv.x - 0.26)), 1.0 - smoothstep(hb, hb + f, abs(uv.x - 0.74))), 1.0 - smoothstep(hb, hb + f, abs(uv.y - max(0.32, u_winArchCurve)))));',
              '    } else {',
              '      float cols = u_winVBars + 1.0;',
              '      float rows = u_winHBars + 1.0;',
              '      if(cols > 1.5 && uv.x > 0.02 && uv.x < 0.98){',
              '        bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(fract(uv.x * cols + 0.5) - 0.5) / cols));',
              '      }',
              '      if(rows > 1.5 && uv.y > 0.02 && uv.y < 0.98){',
              '        bar = max(bar, 1.0 - smoothstep(hb, hb + f, abs(fract(uv.y * rows + 0.5) - 0.5) / rows));',
              '      }',
              '    }',
              '    if(u_winLattice == 1){',

                gl.uniform1f(gl.getUniformLocation(prog, 'u_winBarW'), (Number(layer.winBarW) || 0) / avgDim);

        let lastSyncTs = 0;
        function syncProjector(force) {
          if (force) ui.projectorDirty = true;
          if (!ui.projectorDirty && !ui.transition) return;
          const now = performance.now();
          if (!force && now - lastSyncTs < 32) return;
          lastSyncTs = now;
          ui.projectorDirty = false;
          const payload = {
            width: state.width,
            height: state.height,
            layers: getActiveLayers()
          };
          if (bc) {
            try { bc.postMessage(payload); } catch (e) {}
          }
          if (projectorWin && !projectorWin.closed) {
            try { projectorWin.postMessage(payload, '*'); } catch (e) {}
          }
          if (force) {
            try { localStorage.setItem(LIVE_KEY, JSON.stringify(payload)); } catch (e) {}
          }
        }

        if (bc) {
          bc.onmessage = function (e) {
            if (e.data && e.data.type === 'PROJECTOR_READY') syncProjector(true);
          };
        }
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'PROJECTOR_READY') syncProjector(true);
        });

        function openProjectorWindow() {
          if (projectorWin && !projectorWin.closed) {
            projectorWin.focus();
            syncProjector(true);
            return;
          }
          const url = createProjectorBlobURL();
          projectorWin = window.open(url, 'MaptorProjectorOutput', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
          if (!projectorWin) {
            showToast('Popup blocked — please allow popups for Maptor');
            return;
          }
          setTimeout(function () { syncProjector(true); }, 150);
          setTimeout(function () { syncProjector(true); }, 500);
          showToast('Projector Output Connected');
        }

        const stageWrap = document.getElementById('stage-wrap');
        const stageViewport = document.getElementById('stage-viewport');

        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const renderer = createHybridRenderer(glCanvas);
        document.getElementById('hud-engine').textContent = renderer.engine;

        function resizeCanvas() {
          const rect = stageWrap.getBoundingClientRect();
          const pad = 44;
          const availW = Math.max(120, rect.width - pad);
          const availH = Math.max(120, rect.height - pad);
          const fitScale = Math.min(availW / state.width, availH / state.height);
          if (!ui.zoomManual) ui.zoom = fitScale;

          const dispW = Math.max(1, Math.round(state.width * ui.zoom));
          const dispH = Math.max(1, Math.round(state.height * ui.zoom));
          stageViewport.style.width = dispW + 'px';
          stageViewport.style.height = dispH + 'px';
          overlayCanvas.width = state.width;
          overlayCanvas.height = state.height;

          document.getElementById('hud-res').textContent = state.width + '×' + state.height;
          document.getElementById('hud-zoom').textContent = Math.round((ui.zoom / fitScale) * 100) + '%';
        }

        if ('ResizeObserver' in window) {
          new ResizeObserver(resizeCanvas).observe(stageWrap);
        }
        window.addEventListener('resize', resizeCanvas);

        function getSelectedLayer() {
          return state.layers.find(function (l) { return l.id === state.selectedLayerId; }) || null;
        }

        function getBounds(layer) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          layer.points.forEach(function (p) {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;

          return {
            minX, minY, maxX, maxY,
            w: Math.max(1, maxX - minX),
            h: Math.max(1, maxY - minY),
            cx: (minX + maxX) * 0.5,
            cy: (minY + maxY) * 0.5
          };
        }

        function toStagePt(clientX, clientY) {
          const r = stageViewport.getBoundingClientRect();
          return {
            x: ((clientX - r.left) / Math.max(1, r.width)) * state.width,
            y: ((clientY - r.top) / Math.max(1, r.height)) * state.height
          };
        }

        function pointInPoly(pt, poly) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const hit = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-6) + xi);
            if (hit) inside = !inside;
          }
          return inside;

        function distSeg(p, a, b) {
          const l2 = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
          if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
          const t = Math.max(0, Math.min(1, ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2));
          return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));

          const step = 20;
          let minX = Infinity, minY = Infinity;
          origPts.forEach(function (p) {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
          });
          const targetX = Math.round((minX + rawDx) / step) * step;
          const targetY = Math.round((minY + rawDy) / step) * step;
          return { dx: targetX - minX, dy: targetY - minY };
        }

            { id: 's',  x: b.cx,   y: b.maxY, cur: 'ns-resize' },
            { id: 'sw', x: b.minX, y: b.maxY, cur: 'nesw-resize' },
            { id: 'w',  x: b.minX, y: b.cy,   cur: 'ew-resize' },
